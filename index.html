<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De serfs a ciutadans</title>
<style>
  :root {
    --fondo: #f6f1e7;
    --superficie: #fffdf8;
    --texto: #1f1d1a;
    --texto-suave: #5b564e;
    --primario: #1f3a8a;
    --secundario: #b91c1c;
    --acento: #c9a227;
    --acierto: #15803d;
    --fallo: #b91c1c;
    --borde: rgba(0, 0, 0, .12);
    --sombra: 0 6px 24px rgba(0, 0, 0, .10);
    --fuente-titulos: Georgia, "Times New Roman", serif;
    --fuente-texto: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --patron: none;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    background-image: var(--patron);
    color: var(--texto);
    font-family: var(--fuente-texto);
    line-height: 1.5;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--fuente-titulos); line-height: 1.2; margin: 0 0 .5em; }

  /* Barra superior */
  .barra {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--primario); color: #fff;
    box-shadow: var(--sombra);
  }
  .barra .marca { font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.1rem; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .barra .marca span.icono { font-size: 1.4rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .16); font-size: .9rem; white-space: nowrap;
  }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav button {
    background: transparent; border: 1px solid rgba(255, 255, 255, .45); color: #fff;
    padding: 6px 12px; border-radius: 999px; font-size: .9rem;
  }
  .nav button[aria-current="true"] { background: #fff; color: var(--primario); }
  .franja { height: 6px; background: linear-gradient(90deg, var(--primario) 0 33.3%, var(--superficie) 33.3% 66.6%, var(--secundario) 66.6%); }

  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  .pantalla { display: none; animation: aparecer .35s ease; }
  .pantalla.activa { display: block; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .tarjeta {
    background: var(--superficie); border: 1px solid var(--borde);
    border-radius: var(--radio); box-shadow: var(--sombra); padding: 24px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; border: none;
    background: var(--secundario); color: #fff; font-weight: 700; font-size: 1rem;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
    transition: transform .1s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  .btn.secundario { background: transparent; color: var(--primario); border: 2px solid var(--primario); box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Portada */
  .portada { text-align: center; padding: 40px 24px; }
  .portada .gran-icono { font-size: 4.5rem; line-height: 1; margin-bottom: 12px; }
  .portada h1 { font-size: clamp(2rem, 6vw, 3.2rem); color: var(--primario); }
  .portada .subtitulo { font-size: 1.15rem; color: var(--texto-suave); margin: 0 auto 24px; max-width: 560px; }
  .portada .acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .estadisticas { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .estadistica { background: var(--fondo); border-radius: 12px; padding: 12px; }
  .estadistica b { display: block; font-size: 1.5rem; font-family: var(--fuente-titulos); color: var(--primario); }
  .estadistica small { color: var(--texto-suave); }

  /* Rango */
  .rango-actual { display: flex; align-items: center; gap: 14px; text-align: left; margin-top: 20px; }
  .rango-actual .icono { font-size: 2.4rem; }
  .barra-progreso { height: 12px; border-radius: 999px; background: var(--borde); overflow: hidden; }
  .barra-progreso > div { height: 100%; background: linear-gradient(90deg, var(--primario), var(--secundario)); transition: width .6s ease; }

  /* Mapa */
  .mapa { display: grid; gap: 14px; }
  .nivel {
    display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px;
    text-align: left; width: 100%;
    background: var(--superficie); border: 2px solid var(--borde); border-radius: var(--radio);
    padding: 14px 16px; box-shadow: var(--sombra);
    transition: transform .15s ease, border-color .15s ease;
  }
  .nivel:not(:disabled):hover { transform: translateY(-2px); border-color: var(--acento); }
  .nivel:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .nivel .num {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.6rem;
    background: var(--fondo); border: 3px solid var(--primario);
  }
  .nivel.aprobado .num { border-color: var(--acierto); }
  .nivel h3 { margin: 0 0 2px; font-size: 1.1rem; }
  .nivel p { margin: 0; color: var(--texto-suave); font-size: .92rem; }
  .estrellas { font-size: 1.3rem; letter-spacing: 2px; white-space: nowrap; color: var(--acento); }
  .estrellas .vacia { color: var(--borde); }

  /* Pregunta */
  .cabecera-juego { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .cabecera-juego .titulo-nivel { font-family: var(--fuente-titulos); font-weight: 700; color: var(--primario); }
  .dificultad { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 10px; border-radius: 999px; }
  .dificultad.facil { background: color-mix(in srgb, var(--acierto) 18%, transparent); color: var(--acierto); }
  .dificultad.media { background: color-mix(in srgb, var(--acento) 25%, transparent); color: color-mix(in srgb, var(--acento) 60%, var(--texto)); }
  .dificultad.dificil { background: color-mix(in srgb, var(--fallo) 18%, transparent); color: var(--fallo); }
  .pregunta-texto { font-size: clamp(1.15rem, 3.4vw, 1.45rem); font-family: var(--fuente-titulos); margin: 16px 0 20px; }
  .opciones { display: grid; gap: 10px; }
  .opcion {
    display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
    text-align: left; width: 100%;
    padding: 12px 14px; border-radius: 12px;
    background: var(--fondo); border: 2px solid var(--borde);
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opcion:not(:disabled):hover { border-color: var(--primario); transform: translateX(3px); }
  .opcion .letra {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--superficie); border: 2px solid var(--primario); font-weight: 700; color: var(--primario);
  }
  .opcion.correcta { border-color: var(--acierto); background: color-mix(in srgb, var(--acierto) 14%, var(--superficie)); }
  .opcion.correcta .letra { background: var(--acierto); border-color: var(--acierto); color: #fff; }
  .opcion.incorrecta { border-color: var(--fallo); background: color-mix(in srgb, var(--fallo) 12%, var(--superficie)); animation: temblor .35s ease; }
  .opcion.incorrecta .letra { background: var(--fallo); border-color: var(--fallo); color: #fff; }
  .opcion:disabled { cursor: default; }
  @keyframes temblor { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 12px; display: none; }
  .feedback.visible { display: block; animation: aparecer .3s ease; }
  .feedback.ok { background: color-mix(in srgb, var(--acierto) 12%, var(--superficie)); border-left: 5px solid var(--acierto); }
  .feedback.ko { background: color-mix(in srgb, var(--fallo) 10%, var(--superficie)); border-left: 5px solid var(--fallo); }
  .feedback strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  .feedback .fuente { display: block; margin-top: 6px; font-size: .85rem; color: var(--texto-suave); }
  .pie-pregunta { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; flex-wrap: wrap; }
  .puntos-flotantes { font-weight: 700; color: var(--acierto); font-size: 1.1rem; }

  /* Resultado */
  .resultado { text-align: center; }
  .resultado .gran-icono { font-size: 4rem; }
  .resultado .estrellas { font-size: 2.6rem; }
  .resultado .estrellas span { display: inline-block; animation: estrella .5s ease backwards; }
  .resultado .estrellas span:nth-child(2) { animation-delay: .15s; }
  .resultado .estrellas span:nth-child(3) { animation-delay: .3s; }
  @keyframes estrella { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .repaso { text-align: left; margin-top: 20px; }
  .repaso li { margin-bottom: 10px; }
  .repaso .mal { color: var(--fallo); }

  /* Logros */
  .logros { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .logro { background: var(--superficie); border: 2px solid var(--borde); border-radius: var(--radio); padding: 16px; text-align: center; }
  .logro .icono { font-size: 2.4rem; display: block; margin-bottom: 6px; }
  .logro h3 { font-size: 1rem; margin-bottom: 4px; }
  .logro p { margin: 0; font-size: .85rem; color: var(--texto-suave); }
  .logro.bloqueado { filter: grayscale(1); opacity: .5; }
  .logro.conseguido { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 30%, transparent); }

  /* Apuntes */
  .apuntes { font-size: 1rem; }
  .apuntes h1 { color: var(--primario); font-size: 1.8rem; }
  .apuntes h2 { color: var(--primario); font-size: 1.4rem; margin-top: 1.6em; padding-bottom: 4px; border-bottom: 2px solid var(--borde); }
  .apuntes h3 { font-size: 1.15rem; margin-top: 1.2em; }
  .apuntes h4 { font-size: 1rem; margin: 1em 0 .4em; }
  .apuntes blockquote { margin: 1em 0; padding: 10px 16px; background: var(--fondo); border-left: 5px solid var(--acento); border-radius: 0 10px 10px 0; }
  .apuntes table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .92rem; display: block; overflow-x: auto; }
  .apuntes th, .apuntes td { border: 1px solid var(--borde); padding: 6px 10px; text-align: left; vertical-align: top; }
  .apuntes th { background: var(--fondo); }
  .apuntes code { background: var(--fondo); padding: 1px 5px; border-radius: 4px; }
  .apuntes hr { border: none; border-top: 1px solid var(--borde); margin: 1.5em 0; }

  /* Aviso de logro */
  .aviso {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 48px));
    display: flex; align-items: center; gap: 12px;
    background: var(--texto); color: var(--superficie);
    padding: 12px 18px; border-radius: 14px; box-shadow: var(--sombra);
    transition: transform .4s ease, visibility .4s; z-index: 50; max-width: calc(100% - 32px);
    visibility: hidden;
  }
  .aviso.visible { transform: translate(-50%, 0); visibility: visible; }
  .aviso .icono { font-size: 2rem; }
  .aviso small { display: block; opacity: .75; }

  .confeti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .confeti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: caer linear forwards; }
  @keyframes caer { to { transform: translateY(110vh) rotate(720deg); } }

  .seccion-titulo { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .texto-suave { color: var(--texto-suave); }
  .pie { text-align: center; margin-top: 32px; }
  .enlace-reinicio { background: none; border: none; color: var(--texto-suave); text-decoration: underline; font-size: .85rem; }

  @media (max-width: 560px) {
    .tarjeta { padding: 18px; }
    .nivel { grid-template-columns: 46px 1fr; }
    .nivel .num { width: 46px; height: 46px; font-size: 1.3rem; }
    .nivel .estrellas { grid-column: 2; font-size: 1.1rem; }
    .barra .marca { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="confeti" id="confeti" aria-hidden="true"></div>

ir els privilegis nobiliaris: era l'expressió del liberalisme moderat.","fuente":"10. Els sistemes liberals > Les revolucions liberals del 1830 i el 1848"},{"texto":"Què era la \"Carta atorgada\" de Lluís XVIII?","opciones":["Una constitució democràtica","Un document que concedia llibertats molt restringides i dues cambres consultives","Una declaració d'independència","Un tractat de pau amb Rússia"],"correcta":1,"dificultad":"media","explicacion":"Lluís XVIII va fer unes concessions mínimes que diferenciaven el seu règim de l'absolutisme tradicional.","fuente":"10. Els sistemes liberals > Del rebuig a la Revolució"},{"texto":"Quines dues característiques van tenir les revolucions de 1848?","opciones":["Absolutista i religiosa","Només econòmica","Contingut democràtic i nacionalista","Colonial i militar"],"correcta":2,"dificultad":"dificil","explicacion":"Demanaven democràcia (sobirania popular, sufragi universal masculí) i la independència dels pobles sotmesos als imperis.","fuente":"10. Els sistemes liberals > Les revolucions liberals del 1830 i el 1848"},{"texto":"Quines demandes socials es van reclamar el 1848?","opciones":["El dret de vaga i la jornada laboral de 10 hores","Tornar a cobrar el delme","Restaurar els gremis","El sufragi censatari"],"correcta":0,"dificultad":"dificil","explicacion":"Les classes populars van incorporar demandes socials com el dret a la vaga i la jornada de 10 hores.","fuente":"10. Els sistemes liberals > Les revolucions liberals del 1830 i el 1848"}]}],"apuntes":"# Tema 1. De serfs a ciutadans: crisi i revolució\n> La Revolució francesa va posar les bases del món contemporani: va trencar amb l'Antic Règim i va impulsar els règims constitucionals i democràtics. Aquest tema va des de la societat del segle XVIII fins a les revolucions liberals del 1830 i el 1848.\n\n- ⭐ **Clave:** la **presa de la Bastilla** (**14 de juliol de 1789**) va iniciar la Revolució i va mostrar que la mobilització popular podia vèncer l'absolutisme.\n- La **Bastilla** era una fortalesa-presó de París, símbol de la tirania: qualsevol persona hi podia ser tancada per voluntat del monarca. El seu governador, el **marquès de Launay**, va ser detingut i executat. Avui el lloc és la plaça de la Bastilla.\n- Els revolucionaris van crear un **nou calendari**: la proclamació de la república (**20/9/1792**) va ser l'any I. Substituïa el calendari gregorià i suprimia les festes religioses i les referències monàrquiques.\n- El 14 de juliol és la festa nacional de França.\n\n## 1. Com era l'Antic Règim?\nAl segle XVIII a Europa predominaven les societats de l'**Antic Règim**: ⭐ economia **agrària tradicional**, societat dividida en **estaments** i govern de **monarquies absolutes**.\n\n### L'agricultura era de subsistència\n- ⭐ **Agricultura de subsistència**: principal activitat econòmica; tècniques tradicionals, rendiments baixos, orientada a l'**autoconsum** i amb intercanvis molt escassos.\n- Sistema de conreu: **rotació triennal amb guaret**. Camps oberts dividits en tres àrees (blat de tardor, cereals de primavera i guaret). El bestiar pasturava i fertilitzava el guaret.\n- ⭐ **Crisis de subsistència**: anys de mal temps → males collites → alça del preu del blat → fam i epidèmies → **revoltes populars**.\n\n### Una societat estamental\n- Dividida en estaments per **naixement (\"sang\")**, no per diners.\n- ⭐ **Privilegiats** (noblesa i clergat):\n  - La **noblesa** tenia terres vinculades al títol, **no pagava impostos** i tenia lleis i tribunals especials.\n  - L'**Església** cobrava el **delme** (10% de la collita dels pagesos) i tenia grans propietats. L'**alt clergat**, d'origen noble, monopolitzava els càrrecs eclesiàstics.\n- ⭐ **No privilegiats** = **Tercer Estat** (poble planer): pagesos, criats, artesans, comerciants i **burgesos rics**. Tots compartien la **manca de drets**.\n  - La majoria eren **pagesos** (arrendataris o jornalers) que pagaven rendes i drets senyorials als privilegiats.\n  - Els **artesans** depenien de les normes del seu **gremi**, que dificultaven la innovació.\n- Piràmide: monarca absolut → alt clergat i noblesa de la cort → noblesa → burgesia i baix clergat → classes populars urbanes i pagesos.\n\n### El comerç triangular i el tràfic d'esclaus\n- Europa importava de les colònies **matèries primeres** (sucre, cotó, tabac...) i hi venia **manufactures** (armes, teles...).\n- ⭐ **Comerç triangular** entre **Europa, Àfrica i Amèrica**: s'hi afegien **esclaus** comprats a Àfrica (a canvi d'armes, alcohol...) i venuts a les plantacions americanes. Milions d'africans van ser esclavitzats. Grans beneficis per a comerciants europeus.\n\n### La població i la producció van augmentar\n- Al segle XVIII la **població europea va créixer**: no hi va haver grans pandèmies ni guerres, i amb l'alta natalitat va augmentar la població.\n- Més demanda d'aliments → es van conrear **terres ermes** i es van introduir la **patata** i el **blat de moro**.\n- La indústria va créixer amb dos sistemes:\n  - **Feina a domicili**: comerciants que donaven matèria primera als artesans i venien la producció.\n  - **Manufactures**: grans tallers amb molts artesans (armes i articles de luxe: vidre, tapissos...).\n\n### La burgesia va tenir més poder i influència\n- Els negocis van enriquir la **burgesia** (comerciants, banquers...), mentre la riquesa de nobles i clergues es basava en la terra.\n- ⭐ La burgesia tenia **poder econòmic** però, com a Tercer Estat, era **desigual davant la llei**.\n\n> 🧠 **Recorda:** Antic Règim = agricultura de subsistència + societat estamental + monarquia absoluta. Privilegiats (noblesa i clergat) no pagaven impostos; el Tercer Estat ho pagava tot i no tenia drets. La burgesia s'enriquia però no tenia poder polític.\n\n## 2. Quines noves maneres de pensar van sorgir al segle XVIII?\n### La Il·lustració va néixer del racionalisme\n- La **revolució científica del segle XVII** va ser la base d'un nou moviment intel·lectual: ⭐ la **Il·lustració**, sobretot a **França**.\n- ⭐ Els il·lustrats utilitzaven la **raó** i l'**observació** (eines del mètode científic) per analitzar críticament la realitat, deixant de banda la tradició, la revelació religiosa i la superstició.\n- Confiaven que la raó i la ciència portarien **progrés** i **felicitat**.\n- Confiaven en l'**educació**: ensenyar a pensar i formar tècnicament el ciutadà per crear una societat tolerant i pròspera.\n- Revolució científica al segle XVIII: medicina, matemàtiques, astronomia, biologia, cartografia. Exemples: expedicions de **James Cook** (costes d'Austràlia) i la **vacuna de la verola** d'**Edward Jenner**.\n\n### L'Enciclopèdia\n- ⭐ Obra dirigida per **Diderot** i **D'Alembert**, publicada entre **1751 i 1772**, **35 volums**, amb uns 140 especialistes i molts gravats.\n- Llenguatge clar per arribar a la burgesia. La seva crítica a les tradicions i a la intolerància va provocar la **censura** de la monarquia i l'Església.\n- Va ser el primer moviment que va reclamar el **dret al coneixement per a tothom**. Avui: enciclopèdies en línia com la Viquipèdia.\n\n### Quina nova societat proposaven els il·lustrats?\n- **Locke** (1632-1704, anglès): l'Estat neix d'un **pacte** entre governants i individus; només és legítim si respecta els **drets naturals** (vida, llibertat i propietat) i si hi ha un **parlament** escollit que aprova les lleis. Va influir en els il·lustrats francesos.\n- ⭐ Bases del **liberalisme polític**:\n  - **Voltaire** (1694-1778): crític amb la religió, els privilegis i l'absolutisme; un parlament havia de limitar el poder del rei i els impostos no havien de recaure només en el Tercer Estat.\n  - ⭐ **Montesquieu** (1689-1755): **divisió de poders** → **legislatiu** (parlament), **executiu** (rei i ministres) i **judicial** (jutges independents).\n  - ⭐ **Rousseau** (1712-1778): **contracte social** (pacte entre tots els ciutadans) i **sobirania nacional**: el poder emana dels ciutadans i s'expressa amb el **vot**. Obra: *El contracte social* (1762).\n- Contra la **societat estamental**: ningú podia heretar privilegis; defensaven la **mobilitat social**, la **igualtat davant la llei** i el **mèrit**.\n- Economia:\n  - Contra el **mercantilisme** (la riquesa venia del comerç i de l'acumulació de metalls preciosos).\n  - **Fisiocràcia**: l'**agricultura** és la principal font de riquesa i l'Estat no ha d'intervenir en l'economia.\n  - ⭐ **Liberalisme econòmic**: lliure iniciativa, propietat privada i llibertat econòmica.\n\n### Dones i salons il·lustrats\n- Dones de l'alta societat organitzaven **salons**: s'hi debatien idees noves, descobriments científics, lectures, música...\n- Destaquen **Claudine Guérin de Tencin** (mare de D'Alembert) i **Marie-Thérèse Rodet de Geoffrin**.\n\n> 🧠 **Recorda:** Il·lustració = raó + observació + educació + progrés. Enciclopèdia: Diderot i D'Alembert. Montesquieu → divisió de poders. Rousseau → sobirania nacional i contracte social. Locke → drets naturals. Liberalisme econòmic → llibertat econòmica i propietat privada.\n\n## 3. Quina alternativa es va crear enfront de la monarquia absoluta?\n### Els reis tenien un poder absolut\n- ⭐ **Monarquia absoluta**: el sistema més estès a Europa. **Hereditària** i de **dret diví** (el poder del rei venia de Déu; el rei era sagrat).\n- El rei concentrava **tots els poders** (legislatiu, executiu i judicial); els habitants eren **súbdits** sense drets.\n- Prototip: **Lluís XIV** de França (1643-1715), el **Rei Sol**.\n\n### El Despotisme Il·lustrat va introduir reformes\n- Alguns reis (**Caterina de Rússia**, **Frederic II de Prússia**, **Carles III d'Espanya**) van fer reformes inspirades en la Il·lustració, però **sense renunciar al poder absolut** ni als privilegis.\n- ⭐ Lema: **\"Tot per al poble, però sense el poble\"**.\n- Reformes: modernitzar l'agricultura, comerç i manufactura, eficàcia fiscal, ciència, educació...\n- La dificultat de reformar \"des de dalt\" va obrir pas a les **revolucions liberals**.\n\n### Ja existien règims parlamentaris\n- Les revolucions del **segle XVII** a **Anglaterra** i als **Països Baixos** van acabar amb la monarquia absoluta, impulsades per la burgesia.\n- ⭐ **Parlamentarisme**: separació de poders i un **parlament** escollit (per propietaris i aristòcrates) que fa les lleis i controla el govern.\n- A Anglaterra: ⭐ **habeas corpus** (1679), que garantia les llibertats individuals, i ⭐ **Bill of Rights** (1689), que limitava el poder del rei.\n\n### La independència dels Estats Units: la primera revolució liberal\n- Les **tretze colònies** angleses de la costa atlàntica (uns 2,5 milions d'habitants, 500.000 esclaus) van guanyar identitat en la guerra amb els francesos del Canadà (1756-1763).\n- Tensions contra la Gran Bretanya pel monopoli comercial, els impostos i la **manca de representació** al Parlament britànic. Exemple: **Motí del te de Boston** (1773).\n- Guerra el **1775**. ⭐ **Declaració d'Independència: 4 de juliol de 1776**. La Gran Bretanya la va reconèixer el **1783**.\n- ⭐ **Constitució dels EUA (1787)** amb una Declaració de Drets: la **primera constitució liberal escrita**. **George Washington**, primer president (1789).\n- La Constitució: **separació de poders**, república amb un **president** escollit (4 anys) i **estructura federal**. Legislatiu: Congrés (Senat i Cambra de Representants). Judicial: Tribunal Suprem.\n- Només votaven els **propietaris blancs rics**; no votaven dones, pobres, població negra ni índia.\n- Va influir en la Revolució francesa (1789) i en les independències d'Hispanoamèrica.\n\n> 🧠 **Recorda:** absolutisme = tot el poder al rei. Despotisme il·lustrat = reformes sense el poble. Parlamentarisme = Anglaterra (habeas corpus 1679, Bill of Rights 1689). EUA: independència el 1776 i primera constitució liberal el 1787.\n\n## 4. Com van accedir els Borbons al tron espanyol?\n### La Guerra de Successió\n- El **1700** va morir **Carles II** sense fills. Candidats: **Felip de Borbó** (francès, net de Lluís XIV) i l'arxiduc **Carles d'Habsburg** (austríac).\n- Felip va ser proclamat rei com a **Felip V**; Carles no ho va acceptar → ⭐ **Guerra de Successió (1701-1713)**, amb un doble vessant:\n  - **Conflicte internacional**: Gran Bretanya, Holanda, Portugal i Àustria, preocupats per la força dels Borbons, van donar suport a Carles.\n  - **Guerra civil**: la **Corona d'Aragó**, que temia perdre els seus furs, va donar suport a Carles; **Castella**, a Felip V.\n- Carles va ser nomenat **emperador d'Alemanya** i els seus aliats, que volien l'equilibri europeu, van abandonar-lo.\n- ⭐ **Tractat d'Utrecht (1713)**: reconeix **Felip V** com a rei d'Espanya a canvi de cessions; la **Gran Bretanya** passa a ser la principal potència.\n  - Espanya cedeix a **Àustria**: el Milanesat, Nàpols, Sardenya, Flandes i Luxemburg; a **Savoia**: Sicília.\n  - La **Gran Bretanya** obté **Gibraltar** i **Menorca**, i avantatges comercials a Amèrica (monopoli del comerç d'esclaus i el **navili de permís**).\n- A la Península: batalla d'**Almansa** (1707); la guerra va acabar a **Catalunya el 1714** i a Mallorca el 1715.\n\n### L'entronització dels Borbons i de l'absolutisme\nDurant el regnat de **Felip V (1700-1746)**, es va imposar el model absolutista francès:\n- ⭐ **Decrets de Nova Planta (1701-1716)**: van suprimir les lleis i institucions pròpies de la Corona d'Aragó (Aragó, València, Catalunya i Mallorca).\n- Es van suprimir les **Corts**, excepte les de Castella; els consells van perdre poder davant les secretaries (futurs ministeris).\n- Revisió d'Utrecht: **Pactes de Família** amb França per recuperar Nàpols, Sicília i Parma.\n\n### Després es van emprendre reformes\n- **Ferran VI (1746-1759)**: política de neutralitat i pau. El **marquès de l'Ensenada** va impulsar el **Cadastre d'Ensenada** (cens de propietats), la reforma de l'Armada, el canal de Castella i el Concordat amb la Santa Seu.\n- ⭐ **Carles III (1759-1788)**: màxim exponent del **Despotisme Il·lustrat a Espanya**. Ministres italians (**Squillace**, **Grimaldi**); liberalització del preu del blat.\n- ⭐ **Motí de Squillace (1766)**: revolta contra la pujada del preu del blat i dels impostos.\n- Després: **Floridablanca**, **Aranda** i **Campomanes** van impulsar mesures:\n  - **Expulsió dels jesuïtes** (1767).\n  - Noves escoles i reforma universitària; totes les professions declarades **honestes** (1783).\n  - Retallar els privilegis de la **Mesta** i colonitzar **Sierra Morena**.\n  - **Comerç lliure amb Amèrica** per a tots els ports (1778) i creació del **Banco de San Carlos**.\n- Borbons del segle XVIII: Felip V (1700-1746), Ferran VI (1746-1759), Carles III (1759-1788) i Carles IV (1788-1808).\n- **Il·lustrats espanyols**: el pare **Feijoo**, **Ustáriz**, **Maians**; i més tard **Jovellanos**, **Floridablanca**, **Campomanes**, **Olavide**, **Ensenada** i **Aranda**.\n\n> 🧠 **Recorda:** Guerra de Successió (1701-1713) → Felip V, primer Borbó. Utrecht (1713): Gibraltar i Menorca per a la Gran Bretanya. Nova Planta: fi dels furs de la Corona d'Aragó. Carles III = despotisme il·lustrat a Espanya.\n\n## 5. La Revolució francesa. Va ser el 1789 l'any del Tercer Estat?\n### El malestar de la majoria de la població\n- A França la majoria eren **pagesos** que pagaven impostos i rendes al rei, als nobles i a l'Església; reclamaven la propietat de la terra.\n- A les ciutats, treballadors i artesans no podien subsistir i els **burgesos** estaven limitats per normes.\n- Les idees il·lustrades i l'exemple americà van donar a la burgesia idees per demanar canvis:\n  - **Econòmics**: dret de propietat, llibertat per produir, comprar, vendre...\n  - **Polítics**: llibertat, igualtat davant la llei, participació... → ⭐ **sobirania nacional** (el poder emana del poble) mitjançant eleccions.\n- ⭐ El **Tercer Estat** era el **95%** de la població; els privilegiats (5%) no pagaven impostos.\n\n### La reivindicació política\n- El rei necessitava diners. El **1788** l'Estat ja no podia pagar els deutes: calia que els privilegiats paguessin impostos.\n- ⭐ **Lluís XVI** va convocar els **Estats Generals** el **5 de maig de 1789** (reunió dels tres estaments; l'únic organisme que podia aprovar una reforma fiscal).\n- **Quaderns de queixes**: recollien les queixes de cada poble per presentar-les al rei.\n- El Tercer Estat demanava suprimir els drets senyorials i la sobirania nacional; nobles i clergues defensaven els seus privilegis.\n\n### I va acabar en revolució\n- Es votava **per estament** i els privilegiats sempre guanyaven (2 vots contra 1).\n- ⭐ El Tercer Estat es va constituir en **Assemblea Nacional** i va defensar el vot **per persona**.\n- ⭐ **Jurament del Jeu de Paume** (sala de Versalles): es van comprometre a no separar-se fins aprovar una **Constitució** (quadre de Jacques-Louis David).\n- Els privilegiats van amenaçar amb l'exèrcit → el poble de París va assaltar la **Bastilla** (**14 de juliol de 1789**). Revoltes a altres ciutats i al camp contra els senyors.\n\n### Les etapes de la Revolució francesa\n| Etapa | Anys | Qui la impulsa | Característiques |\n|---|---|---|---|\n| ⭐ **Monarquia constitucional** | 1789-1792 | Burgesia moderada | Abolir l'Antic Règim, parlament per **sufragi censatari**, constitució (liberalisme moderat) |\n| ⭐ **República social** | 1792-1794 | Burgesia radical + classes populars | República, **sufragi universal masculí**, lleis socials |\n| ⭐ **República conservadora** | 1794-1799 | Burgesia moderada | Torna el liberalisme moderat (Directori) |\n\n> 🧠 **Recorda:** crisi econòmica + idees il·lustrades + exemple americà → Estats Generals (maig 1789) → Assemblea Nacional → Jurament del Jeu de Paume → presa de la Bastilla (14/7/1789). Tres etapes: monarquia constitucional, república social i república conservadora.\n\n## 6. Va acceptar el rei la monarquia constitucional?\n### L'Assemblea va impulsar mesures revolucionàries\n- L'Assemblea Nacional (Tercer Estat + alguns nobles i eclesiàstics) representava la nova nació: tothom passava a ser **ciutadà**.\n- ⭐ **Decret del 4 d'agost de 1789**: abolició dels **privilegis** i dels **drets senyorials**.\n- ⭐ **Declaració de Drets de l'Home i del Ciutadà** (**26 d'agost de 1789**): drets i llibertats dels nous ciutadans, però **excloïa les dones i els esclaus**.\n\n### La primera Constitució liberal (1791)\n- L'**Assemblea Nacional Constituent** va fer la ⭐ **Constitució de 1791**, la primera de la França contemporània:\n  - **Separació de poders**, però el rei conservava el **dret de vet** sobre les lleis.\n  - **Igualtat davant la llei** i **sobirania nacional**.\n  - ⭐ **Sufragi censatari**: només votaven els **homes majors de 25 anys** amb un cert nivell de riquesa.\n- S'inaugurava la **monarquia parlamentària** i s'escollia l'**Assemblea Legislativa**.\n- Societat liberal: s'**abolien els gremis**, llibertat econòmica i igualtat davant els impostos.\n- **Constitució civil del clergat**: l'Església havia de jurar la Constitució; els seus béns es van expropiar i vendre.\n- Es va crear la **Guàrdia Nacional** per defensar la Revolució.\n\n### Les forces contrarevolucionàries\n- La família reial, els antics privilegiats i l'Església no acceptaven el canvi. Molts nobles van **emigrar** i van buscar ajuda d'**Àustria** i **Prússia**.\n- ⭐ **Fugida de Varennes** (juny de 1791): Lluís XVI va intentar escapar per encapçalar la **contrarevolució**; va ser detingut i considerat un **traïdor**.\n- **Abril de 1792**: França declara la guerra a Àustria i Prússia. El juliol de 1792 l'exèrcit austríac arriba a les portes de París.\n\n### Les diferents opcions polítiques\n- **Absolutistes** (realistes): volien mantenir l'Antic Règim (noblesa i clergat); molts es van exiliar.\n- **Patriotes** (liberals), que defensaven la revolució liberal:\n  - **Monàrquics** (constitucionalistes): monarquia liberal i constitucional.\n  - **Republicans**: contra el poder hereditari; tots els poders elegits.\n    - ⭐ **Girondins** = moderats.\n    - ⭐ **Jacobins** = radicals.\n\n> 🧠 **Recorda:** 4 d'agost de 1789: fi dels privilegis. 26 d'agost: Declaració de Drets. Constitució de 1791: monarquia parlamentària, vet reial i sufragi censatari. Fugida de Varennes (1791) → rei traïdor. Girondins moderats, jacobins radicals.\n\n## 7. Què va canviar amb la república?\n### La proclamació de la república\n- Les classes populars de París (⭐ **sans-culottes**) van assaltar el **palau de les Tulleries** (agost de 1792): els reis van ser empresonats.\n- Eleccions per **sufragi universal masculí** → ⭐ **Convenció Nacional** (setembre de 1792): proclama la **república** i guanya a **Valmy** contra austríacs i prussians.\n- A la Convenció: **girondins** (primer govern, moderats) i **jacobins** (radicals, lligats als sans-culottes).\n- Els **sans-culottes** eren els més humils; el nom ve de no portar *culottes* (pantalons fins al genoll de les classes altes). Símbols: **pica** (poble en armes), **capell frigi** (llibertat), **escarapel·la tricolor** (la França revolucionària).\n\n### L'execució de Lluís XVI i Maria Antonieta\n- La Convenció els va jutjar per conspiració i van ser executats a la **guillotina** (1793): ⭐ Lluís XVI el **21 de gener de 1793**; Maria Antonieta el 16 d'octubre.\n- Més divisió entre revolucionaris; revoltes contrarevolucionàries a l'interior. Gran Bretanya, Holanda i Espanya es van unir a Prússia i Àustria contra França.\n\n### La instauració del Terror\n- **Juny de 1793**: els **jacobins** arriben al poder. Govern dictatorial del ⭐ **Comitè de Salvació Pública**, amb **Robespierre**.\n- **Lleva en massa**: incorporació obligatòria dels ciutadans a l'exèrcit (1,2 milions de soldats).\n- ⭐ **Constitució de 1793** i nova Declaració de Drets: **drets socials** (vida, feina, ensenyament, assistència pública).\n- Reformes: **ensenyament obligatori**, repartiment de terres als pagesos, **preu màxim** dels productes bàsics i **salari mínim**.\n- ⭐ **El Terror**: es van suspendre drets i llibertats; tribunals revolucionaris condemnaven a presó o a la guillotina els sospitosos (**Llei de sospitosos**).\n\n### El cop d'estat que va portar al Directori\n- La burgesia rebutjava les lleis socials i el Terror → ⭐ **reacció termidoriana** (cop d'estat del 1794) dels republicans moderats.\n- ⭐ **Directori** (1795): govern de **cinc membres**. Va reforçar el liberalisme econòmic i una nova societat burgesa, amb noves elits enriquides. Inestabilitat: la **\"conspiració dels iguals\"** i l'oposició **neojacobina**.\n\n> 🧠 **Recorda:** assalt a les Tulleries (1792) → Convenció i república. Execució del rei (21/1/1793). Jacobins + Robespierre = Terror. Reacció termidoriana (1794) → Directori (1795), 5 membres.\n\n## 8. Com va acabar la Revolució francesa?\n### Napoleó va agafar el poder\n- La burgesia creia que el Directori era ineficaç i que l'exèrcit podia garantir l'ordre.\n- ⭐ **1799**: **Napoleó Bonaparte**, general jove i popular, fa el **cop d'estat de Brumari**: fi del Directori i **fi de la Revolució**. Es consolida el **liberalisme moderat**.\n\n### Un govern personalista i autoritari\n- ⭐ **Consolat (1799-1804)**: nova Constitució **sense declaració de drets**; el poder executiu predomina, llibertats limitades i **censura**.\n- Napoleó, **primer cònsol**, assumeix gairebé tot el poder → **dictadura personalista**.\n\n### Una nova França\n- **Prefectes** als departaments (representants de l'Estat).\n- **Liceus** (escoles públiques) per formar funcionaris.\n- **Concordat** amb l'Església (1801), amb tolerància religiosa.\n- ⭐ Tres codis: **Civil (1804)**, de Comerç (1807) i Penal (1810): igualtat davant la llei, dret de propietat, llibertat individual i accés lliure als càrrecs públics.\n- ⭐ El **Codi Civil** restringia al mínim els **drets de les dones**: havien d'obeir el marit, necessitaven la seva autorització per treballar i per actes jurídics, i l'adulteri femení es castigava més.\n\n### Un imperi a la conquesta d'Europa\n- ⭐ **1804**: Napoleó es fa coronar **emperador** pel Papa i comença la conquesta d'Europa.\n- Territoris annexionats o governats per familiars: a **Espanya** (envaïda el **1808**) va ser rei **Josep Bonaparte**, germà de Napoleó.\n- Als territoris ocupats es va suprimir l'absolutisme i es van implantar **règims constitucionals**, però aviat va créixer el **rebuig als francesos** (invasors) i les aspiracions d'independència nacional.\n- **1812**: màxima extensió de l'Imperi. Després, declivi: fracàs a **Rússia**, dificultats a **Espanya** i coalició encapçalada per la Gran Bretanya, que ocupa París (1814).\n- ⭐ Derrota definitiva a **Waterloo (1815)**; confinat a l'illa de **Santa Helena**, on va morir el 1821.\n\n> 🧠 **Recorda:** cop de Brumari (1799) → Consolat → Imperi (1804). Codi Civil (1804): igualtat i propietat, però pocs drets per a les dones. Màxima extensió el 1812. Waterloo (1815).\n\n## 9. Per què la Revolució francesa va establir les bases del món contemporani?\n### La ciutadania i la sobirania popular\n- ⭐ Les persones van passar de **súbdits** a **ciutadans** amb drets i deures, iguals davant la llei.\n- Entre 1789 i 1799 es van liquidar privilegis i estaments, però els drets no es van estendre de cop: el **sufragi universal masculí** de 1792 va donar pas al **sufragi censatari** (discriminava els homes per riquesa i les dones pel gènere).\n- ⭐ **Olympe de Gouges**: escriptora feminista, va redactar la **Declaració de Drets de la Dona i de la Ciutadana (1791)**. Guillotinada el 1793.\n- **Claire Lacombe** va fundar el 1791 la **Societat de Republicanes Revolucionàries**.\n\n### Els nous sistemes polítics\n- ⭐ **Divisió de poders** + **Constitució** amb drets, llibertats i obligacions = **base de les democràcies actuals**.\n- Formes d'Estat: **monarquia parlamentària** (rei sotmès a la llei) i **república** (president escollit).\n- Precedents dels sistemes contraris a la democràcia: la **dictadura dels jacobins** i el **sistema autoritari de Napoleó**.\n- Els **clubs** revolucionaris són l'antecedent dels **partits polítics**.\n\n### La importància de l'Estat\n- Només l'**Estat** podia fer lleis per a tota la nació. Es va crear una **administració pública**, **departaments** i **ajuntaments**.\n- ⭐ **Liberalisme econòmic**: propietat privada, fi dels gremis, llibertat d'empresa i de comerç; fi de les duanes interiors i **sistema únic de pesos i mesures** (1790: litre, gram, metre).\n- L'Estat regulava preus i salaris per garantir la subsistència.\n- ⭐ **Separació Església-Estat**: Estat laic, llibertat de culte i **ensenyament públic** com a dret garantit per l'Estat.\n- Lema: ⭐ **\"Llibertat, igualtat i fraternitat\"**. L'herència de la Revolució va trobar la resistència dels absolutistes i dels sectors conservadors.\n\n> 🧠 **Recorda:** de súbdits a ciutadans. Divisió de poders + Constitució = democràcia. Olympe de Gouges va reclamar els drets de les dones. Estat laic, ensenyament públic i liberalisme econòmic. \"Llibertat, igualtat i fraternitat\".\n\n## 10. Com es van consolidar els sistemes liberals?\n### Del rebuig a la Revolució\n- ⭐ **Congrés de Viena (1815)**: Àustria, Prússia, Rússia i el Regne Unit van reorganitzar Europa rebutjant la Revolució.\n- ⭐ **Restauració absolutista (1815-1848)**: tornen les monarquies absolutes; fi de les constitucions, la sobirania nacional i els drets.\n- Excepció: el **Regne Unit** manté el parlament. A França, **Lluís XVIII** va aprovar una **\"Carta atorgada\"** amb llibertats molt limitades.\n\n### La remodelació d'Europa\n- El mapa es va refer a favor dels vencedors (imperis d'Àustria, Rússia i Turquia) sense respectar la voluntat dels pobles. França torna a les fronteres del 1792.\n- ⭐ **Santa Aliança**: pacte d'ajuda entre monarques absoluts per intervenir en qualsevol país amenaçat per una revolució liberal.\n\n### Les revolucions liberals del 1830 i el 1848\n- **1820-1824**: insurreccions a Espanya, Portugal, Nàpols i el Piemont, sufocades pels exèrcits absolutistes.\n- ⭐ **1830**: nova onada centrada a **França**. **Carles X** va ser destronat → monarquia constitucional amb **sufragi censatari** (**liberalisme moderat**), també a Espanya i Portugal. Quadre: *La llibertat guiant el poble*, d'**Eugène Delacroix**.\n- ⭐ **1848**: la **\"Primavera dels Pobles\"**, iniciada a París i estesa per Europa; va acabar amb la Restauració absolutista.\n  - Contingut **democràtic**: sobirania popular, **sufragi universal masculí**, llibertat de premsa, reunió i associació, i demandes socials (dret de vaga, jornada de 10 hores).\n  - Contingut **nacionalista**: pobles que volien independitzar-se dels imperis (Hongria, Bohèmia, nord d'Itàlia, Confederació Germànica).\n- La majoria van fracassar, però van obrir la porta a reformes **liberals, constitucionals i democràtiques** i a les aspiracions nacionals.\n\n> 🧠 **Recorda:** Congrés de Viena (1815) → Restauració absolutista i Santa Aliança. 1830: liberalisme moderat (França, Carles X destronat). 1848: Primavera dels Pobles, democràcia i nacionalisme.\n\n## Cronologia\n| Data | Fet |\n|---|---|\n| 1679 | Habeas corpus (Anglaterra) |\n| 1689 | Bill of Rights (Anglaterra) |\n| 1700 | Mor Carles II; Felip V, rei |\n| 1701-1713 | Guerra de Successió |\n| 1701-1716 | Decrets de Nova Planta |\n| 1713 | Tractat d'Utrecht |\n| 1714 | Fi de la guerra a Catalunya |\n| 1751-1772 | Publicació de l'Enciclopèdia |\n| 1762 | *El contracte social* de Rousseau |\n| 1766 | Motí de Squillace |\n| 1767 | Expulsió dels jesuïtes |\n| 1773 | Motí del te de Boston |\n| 4/7/1776 | Declaració d'Independència dels EUA |\n| 1783 | Reconeixement de la independència dels EUA |\n| 1787 | Constitució dels EUA |\n| 5/5/1789 | Obertura dels Estats Generals |\n| 14/7/1789 | Presa de la Bastilla |\n| 4/8/1789 | Abolició dels privilegis i drets senyorials |\n| 26/8/1789 | Declaració de Drets de l'Home i del Ciutadà |\n| 1791 | Constitució; fugida de Varennes; Declaració de Drets de la Dona (Olympe de Gouges) |\n| 1792 | Guerra amb Àustria i Prússia; assalt a les Tulleries; Convenció i república (20/9) |\n| 21/1/1793 | Execució de Lluís XVI |\n| 1793 | Constitució (drets socials); Terror jacobí |\n| 1794 | Reacció termidoriana |\n| 1795 | Directori |\n| 1799 | Cop d'estat de Brumari: Consolat |\n| 1804 | Napoleó, emperador; Codi Civil |\n| 1808 | Invasió d'Espanya; Josep Bonaparte, rei |\n| 1812 | Màxima expansió de l'Imperi |\n| 1815 | Waterloo; Congrés de Viena; Santa Aliança |\n| 1830 | Revolució liberal a França |\n| 1848 | Revolucions democràtiques: Primavera dels Pobles |\n\n## Glossari\n| Concepte | Definició |\n|---|---|\n| Antic Règim | Sistema del segle XVIII: economia agrària, societat estamental i monarquia absoluta |\n| Estament | Grup social al qual es pertany per naixement |\n| Delme | Impost del 10% de la collita que els pagesos pagaven a l'Església |\n| Crisi de subsistència | Males collites que provocaven fam, epidèmies i revoltes |\n| Comerç triangular | Comerç entre Europa, Àfrica i Amèrica basat en el tràfic d'esclaus |\n| Il·lustració | Moviment intel·lectual del segle XVIII basat en la raó |\n| Divisió de poders | Separació dels poders legislatiu, executiu i judicial (Montesquieu) |\n| Sobirania nacional | El poder emana dels ciutadans i s'expressa amb el vot (Rousseau) |\n| Fisiocràcia | Doctrina que considera l'agricultura la principal font de riquesa |\n| Liberalisme econòmic | Lliure iniciativa, propietat privada i no intervenció de l'Estat |\n| Despotisme il·lustrat | Reformes il·lustrades sense renunciar a l'absolutisme (\"tot per al poble, però sense el poble\") |\n| Parlamentarisme | Sistema amb separació de poders i un parlament escollit que fa les lleis |\n| Decrets de Nova Planta | Lleis de Felip V que van suprimir els furs de la Corona d'Aragó |\n| Sufragi censatari | Només voten els homes amb un cert nivell de riquesa |\n| Sufragi universal masculí | Voten tots els homes adults |\n| Sans-culottes | Classes populars de París que no portaven *culottes* |\n| Girondins | Republicans moderats |\n| Jacobins | Republicans radicals, liderats per Robespierre |\n| Terror | Etapa jacobina (1793-1794) de repressió dels sospitosos |\n| Directori | Govern de cinc membres (1795-1799) |\n| Consolat | Règim de Napoleó com a primer cònsol (1799-1804) |\n| Restauració | Retorn de l'absolutisme després del 1815 |\n| Santa Aliança | Pacte de monarques absoluts per frenar les revolucions liberals |\n"};

  const azar = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];

    $('#marcaTitulo').textContent = DATOS.meta.titulo;
    $('#navMapa').textContent = T.niveles;
    $('#navLogros').textContent = T.logros;
    $('#navApuntes').textContent = T.apuntes;
    if (!DATOS.apuntes) $('#navApuntes').hidden = true;
  }

  function actualizarBarra() {
    const { actual } = rangoActual();
    $('#chipRango').textContent = actual ? actual.icono + ' ' + actual.nombre : '🔒 ' + T.sinRango;
    $('#chipPuntos').textContent = '⭐ ' + puntosTotales() + ' ' + T.puntos;
  }

  // ---------- Navegación ----------
  function mostrar(id) {
    document.querySelectorAll('.pantalla').forEach((s) => s.classList.toggle('activa', s.id === id));
    document.querySelectorAll('.nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.ir === id)));
    const render = { portada: renderPortada, mapa: renderMapa, logros: renderLogros, apuntes: renderApuntes }[id];
    if (render) render();
    actualizarBarra();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => { partida = null; mostrar(b.dataset.ir); }));
  $('#marcaTitulo').addEventListener('click', () => { partida = null; mostrar('portada'); });
  $('#marcaTitulo').style.cursor = 'pointer';

  // ---------- Portada ----------
  function renderPortada() {
    const { actual, siguiente, pct } = rangoActual();
    const aprobados = DATOS.niveles.filter((n) => (progreso.niveles[n.id] || {}).aprobado).length;
    const estrellas = DATOS.niveles.reduce((s, n) => s + ((progreso.niveles[n.id] || {}).estrellas || 0), 0);
    const totalPreg = DATOS.niveles.reduce((s, n) => s + n.preguntas.length, 0);
    const haJugado = Object.keys(progreso.niveles).length > 0;
    const progresoSig = siguiente ? Math.min(100, Math.round((pct / siguiente.umbral) * 100)) : 100;
    $('#portada').innerHTML = `
      <div class="tarjeta portada">
        <div class="gran-icono">${esc(DATOS.meta.icono || '📚')}</div>
        <h1>${esc(DATOS.meta.titulo)}</h1>
        <p class="subtitulo">${esc(DATOS.meta.subtitulo || '')}</p>
        ${DATOS.meta.intro ? `<p>${esc(DATOS.meta.intro)}</p>` : ''}
        <div class="estadisticas">
          <div class="estadistica"><b>${aprobados}/${DATOS.niveles.length}</b><small>${esc(T.nivelesSuperados)}</small></div>
          <div class="estadistica"><b>${estrellas}/${DATOS.niveles.length * 3}</b><small>${esc(T.estrellas)}</small></div>
          <div class="estadistica"><b>${puntosTotales()}</b><small>${esc(T.puntos)} / ${MAX_TOTAL}</small></div>
          <div class="estadistica"><b>${totalPreg}</b><small>${esc(T.preguntas)}</small></div>
        </div>
        <div class="rango-actual">
          <span class="icono">${actual ? esc(actual.icono) : '🔒'}</span>
          <div style="flex:1">
            <strong>${actual ? esc(actual.nombre) : esc(T.sinRango)}</strong>
            <div class="texto-suave" style="font-size:.9rem">${siguiente ? esc(T.siguienteRango) + ': ' + esc(siguiente.icono + ' ' + siguiente.nombre) : esc(T.rangoMaximo)}</div>
            <div class="barra-progreso" style="margin-top:6px"><div style="width:${progresoSig}%"></div></div>
          </div>
        </div>
        <div class="acciones">
          <button class="btn" id="btnJugar">▶ ${esc(haJugado ? T.continuar : T.jugar)}</button>
          ${DATOS.apuntes ? `<button class="btn secundario" id="btnApuntes">📖 ${esc(T.apuntes)}</button>` : ''}
        </div>
      </div>
      <div class="pie"><button class="enlace-reinicio" id="btnReiniciar">${esc(T.reiniciar)}</button></div>`;
    $('#btnJugar').onclick = () => mostrar('mapa');
    if ($('#btnApuntes')) $('#btnApuntes').onclick = () => mostrar('apuntes');
    $('#btnReiniciar').onclick = () => {
      if (confirm(T.confirmarReinicio)) {
        progreso = { niveles: {}, logros: [] };
        guardar();
        mostrar('portada');
      }
    };
  }

  // ---------- Mapa de niveles ----------
  function renderMapa() {
    const items = DATOS.niveles.map((n, i) => {
      const p = progreso.niveles[n.id] || {};
      const abierto = desbloqueado(i);
      return `
        <button class="nivel ${p.aprobado ? 'aprobado' : ''}" data-nivel="${i}" ${abierto ? '' : 'disabled'}>
          <span class="num">${abierto ? esc(n.icono || String(i + 1)) : '🔒'}</span>
          <span>
            <h3>${i + 1}. ${esc(n.titulo)}</h3>
            <p>${abierto ? esc(n.resumen || '') : esc(T.bloqueado)}${p.mejorPct != null ? ` · ${esc(T.mejor)}: ${Math.round(p.mejorPct * 100)}%` : ''}</p>
          </span>
          <span class="estrellas">${pintarEstrellas(p.estrellas || 0)}</span>
        </button>`;
    }).join('');
    $('#mapa').innerHTML = `
      <div class="seccion-titulo"><h2>${esc(T.niveles)}</h2><span class="texto-suave">${esc(T.ayudaMapa)}</span></div>
      <div class="mapa">${items}</div>`;
    document.querySelectorAll('.nivel').forEach((b) => b.addEventListener('click', () => empezar(Number(b.dataset.nivel))));
  }

  // ---------- Partida ----------
  let partida = null;

  function empezar(indice) {
    const nivel = DATOS.niveles[indice];
    // Barajar dentro de cada dificultad para mantener la progresión fácil -> difícil
    const grupos = { facil: [], media: [], dificil: [] };
    nivel.preguntas.forEach((p) => grupos[p.dificultad].push(p));
    const orden = [].concat(azar(grupos.facil), azar(grupos.media), azar(grupos.dificil));
    const preguntas = orden.map((p) => {
      const opciones = azar(p.opciones.map((texto, i) => ({ texto, correcta: i === p.correcta })));
      return Object.assign({}, p, { opcionesBarajadas: opciones });
    });
    partida = { indice, nivel, preguntas, actual: 0, puntos: 0, aciertos: 0, fallos: [], respondida: false };
    mostrar('juego');
    renderPregunta();
  }

  function renderPregunta() {
    const { nivel, preguntas, actual } = partida;
    const p = preguntas[actual];
    const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
    const avance = Math.round((actual / preguntas.length) * 100);
    partida.respondida = false;
    $('#juego').innerHTML = `
      <div class="tarjeta">
        <div class="cabecera-juego">
          <span class="titulo-nivel">${esc(nivel.icono || '')} ${esc(nivel.titulo)}</span>
          <span class="texto-suave">${esc(T.pregunta)} ${actual + 1} ${esc(T.de)} ${preguntas.length} · ⭐ ${partida.puntos}</span>
        </div>
        <div class="barra-progreso"><div style="width:${avance}%"></div></div>
        <div style="margin-top:14px"><span class="dificultad ${p.dificultad}">${esc(T.dificultad[p.dificultad])} · ${PUNTOS[p.dificultad]} ${esc(T.puntos)}</span></div>
        <p class="pregunta-texto">${esc(p.texto)}</p>
        <div class="opciones" role="group">
          ${p.opcionesBarajadas.map((o, i) => `
            <button class="opcion" data-i="${i}"><span class="letra">${letras[i]}</span><span>${esc(o.texto)}</span></button>`).join('')}
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="pie-pregunta">
          <button class="btn secundario" id="btnSalir">← ${esc(T.salir)}</button>
          <span class="puntos-flotantes" id="puntosGanados"></span>
          <button class="btn" id="btnSiguiente" disabled>${esc(actual + 1 < preguntas.length ? T.siguiente : T.verResultado)} →</button>
        </div>
      </div>`;
    document.querySelectorAll('.opcion').forEach((b) => b.addEventListener('click', () => responder(Number(b.dataset.i))));
    $('#btnSiguiente').onclick = siguiente;
    $('#btnSalir').onclick = () => { if (confirm(T.confirmarSalir)) { partida = null; mostrar('mapa'); } };
  }

  function responder(i) {
    if (!partida || partida.respondida) return;
    partida.respondida = true;
    const p = partida.preguntas[partida.actual];
    const elegida = p.opcionesBarajadas[i];
    const botones = document.querySelectorAll('.opcion');
    botones.forEach((b, j) => {
      b.disabled = true;
      if (p.opcionesBarajadas[j].correcta) b.classList.add('correcta');
    });
    const fb = $('#feedback');
    if (elegida.correcta) {
      const ganados = PUNTOS[p.dificultad];
      partida.puntos += ganados;
      partida.aciertos++;
      $('#puntosGanados').textContent = '+' + ganados;
      fb.className = 'feedback visible ok';
      fb.innerHTML = `<strong>${esc(elegir(T.mensajesAcierto))}</strong>${esc(p.explicacion)}`;
    } else {
      botones[i].classList.add('incorrecta');
      partida.fallos.push(p);
      fb.className = 'feedback visible ko';
      const correcta = p.opcionesBarajadas.find((o) => o.correcta).texto;
      fb.innerHTML = `<strong>${esc(elegir(T.mensajesFallo))}</strong>
        ${esc(T.laCorrectaEra)}: <b>${esc(correcta)}</b>.<br>${esc(p.explicacion)}
        ${p.fuente ? `<span class="fuente">📖 ${esc(p.fuente)}</span>` : ''}`;
    }
    const sig = $('#btnSiguiente');
    sig.disabled = false;
    sig.focus();
  }

  function siguiente() {
    if (!partida || !partida.respondida) return;
    partida.actual++;
    if (partida.actual < partida.preguntas.length) renderPregunta();
    else terminar();
  }

  function terminar() {
    const { nivel, indice, preguntas, puntos, aciertos, fallos } = partida;
    const pct = aciertos / preguntas.length;
    const estrellas = estrellasDe(pct);
    const aprobado = pct >= APROBADO;
    const previo = progreso.niveles[nivel.id] || {};
    const eraAprobado = !!previo.aprobado;
    const rangoAntes = rangoActual().actual;
    progreso.niveles[nivel.id] = {
      aprobado: eraAprobado || aprobado,
      estrellas: Math.max(previo.estrellas || 0, estrellas),
      mejorPct: Math.max(previo.mejorPct || 0, pct),
      mejorPuntos: Math.max(previo.mejorPuntos || 0, puntos),
    };
    guardar();
    const nuevos = comprobarLogros();
    const rangoDespues = rangoActual().actual;
    const hayMas = indice + 1 < DATOS.niveles.length;
    const nuevoDesbloqueo = aprobado && !eraAprobado && hayMas;
    partida = null;

    mostrar('resultado');
    $('#resultado').innerHTML = `
      <div class="tarjeta resultado">
        <div class="gran-icono">${aprobado ? (estrellas === 3 ? '🏆' : '🎉') : '💪'}</div>
        <h2>${esc(aprobado ? (estrellas === 3 ? T.nivelPerfecto : T.nivelSuperado) : T.nivelNoSuperado)}</h2>
        <div class="estrellas">${pintarEstrellas(estrellas)}</div>
        <p>${aciertos}/${preguntas.length} ${esc(T.aciertos)} · <b>+${puntos} ${esc(T.puntos)}</b>${puntos > (previo.mejorPuntos || 0) && previo.mejorPuntos != null ? ' · ' + esc(T.nuevoRecord) : ''}</p>
        ${aprobado ? '' : `<p class="texto-suave">${esc(T.necesitas)}</p>`}
        ${nuevoDesbloqueo ? `<p><b>🔓 ${esc(T.desbloqueado)}: ${esc(DATOS.niveles[indice + 1].titulo)}</b></p>` : ''}
        ${rangoDespues && rangoDespues !== rangoAntes ? `<p><b>${esc(rangoDespues.icono)} ${esc(T.nuevoRango)}: ${esc(rangoDespues.nombre)}</b></p>` : ''}
        <div class="acciones" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
          <button class="btn secundario" id="btnRepetir">↻ ${esc(T.repetir)}</button>
          ${aprobado && hayMas ? `<button class="btn" id="btnSigNivel">${esc(T.siguienteNivel)} →</button>` : `<button class="btn" id="btnMapa">${esc(T.niveles)}</button>`}
        </div>
        ${fallos.length ? `
          <div class="repaso">
            <h3>${esc(T.repasa)}</h3>
            <ul>${fallos.map((p) => `<li><b>${esc(p.texto)}</b><br><span>✅ ${esc(p.opciones[p.correcta])}</span><br><small class="texto-suave">${esc(p.explicacion)}</small></li>`).join('')}</ul>
          </div>` : ''}
      </div>`;
    $('#btnRepetir').onclick = () => empezar(indice);
    if ($('#btnSigNivel')) $('#btnSigNivel').onclick = () => empezar(indice + 1);
    if ($('#btnMapa')) $('#btnMapa').onclick = () => mostrar('mapa');
    if (aprobado) confeti(estrellas === 3 ? 120 : 60);
    avisarLogros(nuevos);
  }

  // ---------- Logros ----------
  function listaLogros() {
    const rangos = DATOS.rangos.map((r, i) => ({ id: 'rango-' + i, nombre: r.nombre, icono: r.icono, descripcion: r.descripcion || (T.consigue + ' ' + Math.round(r.umbral * 100) + '% ' + T.delTotal) }));
    const esp = DATOS.logrosEspeciales || {};
    const especiales = ['primerNivel', 'perfecto', 'todos', 'maestro'].filter((k) => esp[k]).map((k) => Object.assign({ id: k }, esp[k]));
    return rangos.concat(especiales);
  }

  function comprobarLogros() {
    const pct = MAX_TOTAL ? puntosTotales() / MAX_TOTAL : 0;
    const estados = DATOS.niveles.map((n) => progreso.niveles[n.id] || {});
    const cumple = {
      primerNivel: estados.some((e) => e.aprobado),
      perfecto: estados.some((e) => e.estrellas === 3),
      todos: estados.every((e) => e.aprobado),
      maestro: estados.every((e) => e.estrellas === 3),
    };
    DATOS.rangos.forEach((r, i) => { cumple['rango-' + i] = pct >= r.umbral; });
    const nuevos = [];
    for (const l of listaLogros()) {
      if (cumple[l.id] && !progreso.logros.includes(l.id)) { progreso.logros.push(l.id); nuevos.push(l); }
    }
    if (nuevos.length) guardar();
    return nuevos;
  }

  function avisarLogros(lista) {
    const aviso = $('#aviso');
    let i = 0;
    const siguienteAviso = () => {
      if (i >= lista.length) return;
      const l = lista[i++];
      aviso.innerHTML = `<span class="icono">${esc(l.icono)}</span><div><small>${esc(T.logroDesbloqueado)}</small><b>${esc(l.nombre)}</b></div>`;
      aviso.classList.add('visible');
      setTimeout(() => { aviso.classList.remove('visible'); setTimeout(siguienteAviso, 450); }, 2800);
    };
    setTimeout(siguienteAviso, 600);
  }

  function renderLogros() {
    const lista = listaLogros();
    const conseguidos = lista.filter((l) => progreso.logros.includes(l.id)).length;
    $('#logros').innerHTML = `
      <div class="seccion-titulo"><h2>${esc(T.logros)}</h2><span class="texto-suave">${conseguidos}/${lista.length}</span></div>
      <div class="logros">${lista.map((l) => {
        const ok = progreso.logros.includes(l.id);
        return `<div class="logro ${ok ? 'conseguido' : 'bloqueado'}"><span class="icono">${esc(l.icono)}</span><h3>${esc(l.nombre)}</h3><p>${esc(l.descripcion || '')}</p></div>`;
      }).join('')}</div>`;
  }

  // ---------- Apuntes (mini renderizador de Markdown) ----------
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  }
  function markdown(md) {
    const lineas = md.replace(/\r/g, '').split('\n');
    let html = '', i = 0;
    while (i < lineas.length) {
      const l = lineas[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = m[1].length; html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
      if (/^(-{3,}|\*{3,})\s*$/.test(l)) { html += '<hr>'; i++; continue; }
      if (l.startsWith('>')) {
        const bloque = [];
        while (i < lineas.length && lineas[i].startsWith('>')) bloque.push(lineas[i++].replace(/^>\s?/, ''));
        html += `<blockquote>${markdown(bloque.join('\n'))}</blockquote>`; continue;
      }
      if (/^\s*\|/.test(l)) {
        const filas = [];
        while (i < lineas.length && /^\s*\|/.test(lineas[i])) filas.push(lineas[i++]);
        const celdas = (f) => f.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const cab = celdas(filas[0]);
        const cuerpo = filas.slice(1).filter((f) => !/^\s*\|?\s*:?-{2,}/.test(f));
        html += '<table><thead><tr>' + cab.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
          cuerpo.map((f) => '<tr>' + celdas(f).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        const ordenada = /^\s*\d+\./.test(l);
        const items = [];
        while (i < lineas.length && /^\s*([-*]|\d+\.)\s+/.test(lineas[i])) {
          const nivel = lineas[i].match(/^\s*/)[0].length;
          items.push({ nivel, texto: lineas[i].replace(/^\s*([-*]|\d+\.)\s+/, '') });
          i++;
        }
        const tag = ordenada ? 'ol' : 'ul';
        let out = `<${tag}>`, abiertos = 0, base = items[0].nivel;
        items.forEach((it, k) => {
          const prof = it.nivel > base ? 1 : 0;
          if (prof > abiertos) { out += '<ul>'; abiertos++; }
          else if (prof < abiertos) { out += '</ul>'; abiertos--; }
          out += `<li>${inline(it.texto)}</li>`;
        });
        while (abiertos-- > 0) out += '</ul>';
        html += out + `</${tag}>`;
        continue;
      }
      const parrafo = [];
      while (i < lineas.length && lineas[i].trim() && !/^(#{1,4}\s|>|\s*\||\s*([-*]|\d+\.)\s+|-{3,}\s*$)/.test(lineas[i])) parrafo.push(lineas[i++]);
      if (!parrafo.length) { html += `<p>${inline(lineas[i++])}</p>`; continue; }
      html += `<p>${inline(parrafo.join(' '))}</p>`;
    }
    return html;
  }
  function renderApuntes() {
    $('#apuntes').innerHTML = `<div class="tarjeta apuntes">${DATOS.apuntes ? markdown(DATOS.apuntes) : ''}</div>`;
  }

  // ---------- Efectos ----------
  function confeti(n) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cont = $('#confeti');
    const colores = (DATOS.tema && DATOS.tema.confeti) || [getComputedStyle(document.documentElement).getPropertyValue('--primario'), getComputedStyle(document.documentElement).getPropertyValue('--secundario'), getComputedStyle(document.documentElement).getPropertyValue('--acento')];
    for (let k = 0; k < n; k++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colores[k % colores.length];
      p.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.5 + 's';
      cont.appendChild(p);
      setTimeout(() => p.remove(), 4500);
    }
  }

  // ---------- Teclado ----------
  document.addEventListener('keydown', (e) => {
    if (!partida || !$('#juego').classList.contains('activa')) return;
    const n = parseInt(e.key, 10);
    if (!partida.respondida && n >= 1 && n <= partida.preguntas[partida.actual].opcionesBarajadas.length) { responder(n - 1); e.preventDefault(); }
    else if (partida.respondida && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== $('#btnSiguiente')) { siguiente(); e.preventDefault(); }
  });

  aplicarTema();
  mostrar('portada');
})();
</script>
</body>
