<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minijuego</title>
<style>
/*__COMUN_CSS__*/
  .mj-zona { touch-action: none; overflow: hidden; background: var(--shell); }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .pregunta {
    position: absolute; left: 50%; top: 12px; z-index: 5; transform: translateX(-50%);
    width: min(720px, calc(100% - 24px)); display: none; gap: 8px;
    background: var(--papel); color: var(--tinta); border-radius: var(--r); padding: 10px 12px 12px;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.8);
  }
  .pregunta.ver { display: grid; animation: bajar .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes bajar { from { transform: translate(-50%, -20px); opacity: 0; } }
  .pregunta p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1rem, 3.6vw, 1.35rem); text-align: center; text-wrap: balance; }
  .pregunta .carriles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pregunta .carriles button {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px;
    border: 1.5px solid var(--tinta); border-radius: 8px; background: color-mix(in srgb, var(--papel) 55%, white);
    font-family: var(--f-mono); font-weight: 500; font-size: clamp(.78rem, 3vw, .98rem); text-align: left; line-height: 1.15;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .pregunta .carriles button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tinta); color: var(--papel); font-weight: 700; }
  .pregunta .carriles button:not(:disabled):hover, .pregunta .carriles button.sobre { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, var(--papel)); transform: translateY(-1px); }
  .pregunta .carriles button:disabled { cursor: default; }
  .pregunta .carriles button.elegida { border-color: var(--tinta); border-width: 3px; }
  .pregunta .carriles button.bien { background: var(--acierto); border-color: var(--acierto); color: var(--papel); }
  .pregunta .carriles button.mal { background: var(--fallo); border-color: var(--fallo); color: var(--papel); }
  .pregunta .carriles button.bien .n, .pregunta .carriles button.mal .n { background: var(--papel); color: var(--tinta); }
  .pregunta .nota { margin: 0; text-align: center; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; color: var(--tinta-suave); }
  .pregunta .carriles button > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) {
    .pregunta { padding: 8px 8px 10px; gap: 6px; }
    .pregunta .carriles { gap: 5px; }
    .pregunta .carriles button { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 6px 4px; font-size: .78rem; }
    .pregunta .carriles button .n { width: 22px; height: 22px; font-size: .75rem; }
  }
  .mj-zona.eligiendo #lienzo { cursor: default; }
  .mj-zona.eligiendo .ayuda-tactil { display: none; }
  .ayuda-tactil { position: absolute; bottom: 14px; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; padding: 0 14px; pointer-events: none; opacity: .5; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; color: var(--claro); }
  .sin-webgl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .sin-webgl div { max-width: 420px; display: grid; gap: 14px; background: var(--papel); color: var(--tinta); padding: 24px; border-radius: var(--r); }
  .sin-webgl a { color: var(--acento); font-weight: 700; }
</style>
</head>
<body>
<main class="mj-zona" id="zona">
  <canvas id="lienzo" aria-label="Joc"></canvas>
  <div class="pregunta" id="pregunta" aria-live="polite"><p id="pregTexto"></p><div class="carriles" id="pregOpciones" role="group"></div><p class="nota" id="pregNota"></p></div>
  <div class="ayuda-tactil" id="ayuda"><span>◀</span><span>▶</span></div>
</main>
<script>
/*__THREE__*/
</script>
<script>
const DATOS = /*__DATOS__*/null;
</script>
<script>
/*__COMUN_JS__*/
</script>
<script>
(function () {
  'use strict';
  const J = MJ.JUEGO, T = MJ.T;
  const cv = document.getElementById('lienzo');
  const zona = document.getElementById('zona');
  const $preg = document.getElementById('pregunta'), $pt = document.getElementById('pregTexto'), $po = document.getElementById('pregOpciones'), $pn = document.getElementById('pregNota');
  if (!MJ.esTactil()) document.getElementById('ayuda').style.display = 'none';

  // ---------- Constantes de juego (idénticas a la versión 1) ----------
  const GENERA = 150;      // metros por delante que se generan
  const PARADA = 7;        // metros antes de la puerta en que el corredor se detiene
  const ARRANQUE = .8;     // segundos para recuperar la velocidad tras elegir
  const HUECO = 170;       // metros entre puertas
  const VIDAS = J.vidas || 3;
  const V0 = 17, VMAX = 31;
  // Escena 3D (metros)
  const CARRIL = 2.2, CALLE = CARRIL * 3, ACERA = 1.8, VISTA = 190, PASO_FAROLA = 20;
  // Llegada: la calle desemboca en una plaza (6 m antes de la meta) y la Bastilla está 22 m después de la meta.
  // El corredor se detiene 12 m antes del centro de la muralla, al final del puente levadizo.
  const BASTILLA_TRAS_META = 22, PLAZA_ANTES_META = 6, PARADA_BASTILLA = 16, DURACION_LLEGADA = 3.4;

  // ---------- WebGL ----------
  let renderer = null;
  try {
    if (!window.THREE || !window.WebGLRenderingContext || window.__sinWebGL) throw new Error('sin WebGL');
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !MJ.esTactil(), powerPreference: 'high-performance' });
  } catch (e) { renderer = null; }
  if (!renderer) {
    cv.remove();
    zona.insertAdjacentHTML('beforeend', `<div class="sin-webgl"><div><b>${MJ.esc(T.sinWebgl || 'Aquest dispositiu no pot mostrar gràfics 3D.')}</b><a href="carrera.html">${MJ.esc(T.versioClassica || 'Juga a la versió clàssica')} →</a></div></div>`);
  }

  // ---------- Estado (idéntico a la versión 1) ----------
  let s = null;
  function nuevo() {
    if (s) limpiarEscena();
    s = {
      dist: 0, v: V0, carril: 1, x: 1, vidas: VIDAS, puntos: 0, monedas: 0, aciertos: 0, fallos: 0,
      objs: [], genPos: 40, puertaSig: 0, puertasGeneradas: 0, invul: 0, sacudida: 0, t: 0,
      meta: null, fin: false, preguntas: MJ.azar(J.puertas).slice(0, J.numPuertas || J.puertas.length).map((p) => {
        const ops = MJ.azar(p.opciones.map((texto, i) => ({ texto, ok: i === p.correcta })));
        return { pregunta: p.pregunta, ops };
      }),
      mostrada: -1, resaltado: null,
      fase: 'corre', vObjetivo: V0, puertaActual: null, elegida: null, tEspera: 0, bonus: 0, rapidesa: 0, hover: -1, zancada: 0, tAmbiente: -1,
    };
    zona.classList.remove('eligiendo');
    MJ.hud([{ id: 'vidas', etiqueta: T.vidas, valor: '♥'.repeat(VIDAS) }, { id: 'puntos', etiqueta: T.puntos, valor: 0 }, { id: 'puerta', etiqueta: T.porta, valor: `0/${s.preguntas.length}` }]);
    $preg.classList.remove('ver');
  }
  const LARGO = () => 40 + (s.preguntas.length + 1) * HUECO;

  // ---------- Generación de pista (idéntica a la versión 1) ----------
  function generar() {
    while (s.genPos < s.dist + GENERA + 20 && !s.meta) {
      const i = s.puertasGeneradas;
      const posPuerta = 40 + (i + 1) * HUECO - 20;
      if (i >= s.preguntas.length) {
        s.meta = { tipo: 'meta', pos: s.genPos + 60 };
        s.objs.push(s.meta);
        break;
      }
      if (s.genPos < posPuerta - 28) {
        const fila = s.genPos;
        const r = Math.random();
        if (r < .62) {
          const libres = MJ.azar([0, 1, 2]);
          const n = Math.random() < .35 + Math.min(.3, i * .05) ? 2 : 1;
          for (let k = 0; k < n; k++) s.objs.push({ tipo: 'obst', carril: libres[k], pos: fila, v: Math.random() });
          const libre = libres[n];
          if (Math.random() < .55) for (let k = 1; k <= 3; k++) s.objs.push({ tipo: 'moneda', carril: libre, pos: fila + k * 4 });
        } else {
          const c = Math.floor(Math.random() * 3);
          for (let k = 0; k < 4; k++) s.objs.push({ tipo: 'moneda', carril: c, pos: fila + k * 4 });
        }
        s.genPos += 17 + Math.random() * 8 - Math.min(5, i * .6);
      } else {
        s.objs.push({ tipo: 'puerta', pos: posPuerta, idx: i });
        s.puertasGeneradas++;
        s.genPos = posPuerta + 30;
      }
    }
  }

  // ---------- Actualización (idéntica a la versión 1, salvo las chispas en 3D) ----------
  function mover(dir) {
    if (MJ.estado() !== 'jugando' || s.fase !== 'corre') return;
    const n = Math.max(0, Math.min(2, s.carril + dir));
    if (n !== s.carril) { s.carril = n; MJ.sfx.paso(); }
  }
  function perderVida(motivo) {
    s.vidas--; s.invul = 1.4; s.sacudida = .35;
    MJ.hudSet('vidas', '♥'.repeat(Math.max(0, s.vidas)) + '♡'.repeat(VIDAS - Math.max(0, s.vidas)));
    if (s.vidas <= 0) terminar(false);
    return motivo;
  }
  function actualizar(dt) {
    if (s.fin) return;
    s.t += dt;
    if (s.invul > 0) s.invul -= dt;
    if (s.sacudida > 0) s.sacudida -= dt;
    actualizarChispas(dt);
    actualizarFuegos(dt);
    if (s.fase === 'eligiendo') { s.tEspera += dt; return; }
    if (s.fase === 'llegada') { actualizarLlegada(dt); return; }
    if (s.v < s.vObjetivo) s.v = Math.min(s.vObjetivo, s.v + (s.vObjetivo / ARRANQUE) * dt);
    s.dist += s.v * dt;
    sonidoCarrera();
    s.puntos += s.v * dt * .5;
    s.x += (s.carril - s.x) * Math.min(1, dt * 16);
    generar();
    const carrilActual = Math.round(s.x);
    const prox = s.objs.find((o) => o.tipo === 'puerta' && !o.pasada);
    if (s.fase === 'corre' && prox && prox.pos - s.dist <= PARADA) { detenerse(prox); return; }
    for (const o of s.objs) {
      const z = o.pos - s.dist;
      if (o.hecho) continue;
      if (o.tipo === 'moneda' && z < 1.2 && z > -1 && o.carril === carrilActual) {
        o.hecho = true; s.monedas++; s.puntos += 10; MJ.sfx.moneda(); chispas((o.carril - 1) * CARRIL, 1.1, 0);
      } else if (o.tipo === 'obst' && z < 1.1 && z > -.8 && o.carril === carrilActual && s.invul <= 0) {
        o.hecho = true; MJ.sfx.madera(); MJ.flash(T.ai, false); perderVida('obst');
      } else if (o.tipo === 'puerta' && z < .4) {
        o.hecho = true; o.pasada = true;
        const elegida = s.elegida != null ? s.elegida : carrilActual;
        const q = s.preguntas[o.idx], ok = q.ops[elegida].ok;
        s.resaltado = { idx: o.idx, elegida, t: 1.6 };
        pintarOpciones(o.idx, elegida, true);
        MJ.hudSet('puerta', `${o.idx + 1}/${s.preguntas.length}`);
        if (ok) {
          s.aciertos++; s.puntos += 150 + s.bonus; s.rapidesa += s.bonus;
          $pn.textContent = s.bonus ? `+150 · +${s.bonus} ${String(T.rapidesa).toLowerCase()}` : '+150';
          MJ.sfx.canon(); MJ.sfx.fanfarria(); MJ.flash(T.selloAcierto, true); s.vObjetivo = Math.min(VMAX, s.vObjetivo + 1.6);
        } else {
          s.fallos++; $pn.textContent = '';
          MJ.sfx.trompeta(); MJ.flash(T.selloFallo, false); perderVida('puerta');
        }
        s.fase = 'corre'; s.elegida = null; s.puertaActual = null;
      } else if (o.tipo === 'meta' && z < 2) {
        o.hecho = true; llegar(); return;
      }
    }
    for (const o of s.objs) if (o.pos - s.dist <= -6 && o.malla) quitarMalla(o);
    s.objs = s.objs.filter((o) => o.pos - s.dist > -6);
    if (s.resaltado) { s.resaltado.t -= dt; if (s.resaltado.t <= 0) { s.resaltado = null; $preg.classList.remove('ver'); } }
    MJ.hudSet('puntos', MJ.fmt(Math.round(s.puntos)));
  }
  function sonidoCarrera() {
    MJ.sonido.tempo(.9 + Math.max(0, Math.min(1, (s.v - V0) / (VMAX - V0))) * .25);
    const zancada = Math.floor((s.t * 14) / Math.PI);
    if (zancada !== s.zancada && s.v > 3) { s.zancada = zancada; MJ.sfx.adoquin(zancada % 2); }
    if (s.t - s.tAmbiente > .5) { s.tAmbiente = s.t; MJ.sonido.ambienteIntensidad(.3 + .7 * Math.min(1, s.dist / LARGO())); }
  }
  function detenerse(puerta) {
    s.dist = puerta.pos - PARADA;
    s.vObjetivo = Math.max(s.vObjetivo, s.v); s.v = 0;
    s.fase = 'eligiendo'; s.puertaActual = puerta; s.tEspera = 0; s.hover = -1;
    zona.classList.add('eligiendo');
    mostrarPregunta(puerta.idx);
    MJ.sfx.tic();
    MJ.sonido.atenuar(true); MJ.sonido.redoble(true);
  }
  function elegir(c) {
    if (MJ.estado() !== 'jugando' || s.fase !== 'eligiendo' || c < 0 || c > 2) return false;
    s.elegida = c; s.carril = c; s.fase = 'cruzando'; s.hover = -1;
    s.bonus = Math.round(100 * Math.max(0, Math.min(1, 1 - (s.tEspera - 2) / 8)));
    zona.classList.remove('eligiendo');
    MJ.sonido.redoble(false); MJ.sonido.atenuar(false);
    pintarOpciones(s.puertaActual.idx, c, false);
    $pn.textContent = '';
    MJ.sfx.paso();
    return true;
  }
  function mostrarPregunta(idx) {
    s.mostrada = idx;
    const q = s.preguntas[idx];
    $pt.textContent = q.pregunta;
    pintarOpciones(idx, null, false);
    $pn.textContent = MJ.esTactil() ? T.triaTactil : T.triaTeclat;
    $preg.classList.add('ver');
    const b = $po.querySelector('button');
    if (b && !MJ.esTactil()) b.focus({ preventScroll: true });
  }
  function pintarOpciones(idx, elegida, resuelta) {
    const q = s.preguntas[idx];
    $po.innerHTML = q.ops.map((o, i) => {
      let cls = '';
      if (resuelta) { if (o.ok) cls = 'bien'; else if (i === elegida) cls = 'mal'; }
      else if (elegida === i) cls = 'elegida';
      const bloqueado = elegida != null || resuelta;
      return `<button data-i="${i}" class="${cls}" ${bloqueado ? 'disabled' : ''}><span class="n">${i + 1}</span><span>${MJ.esc(o.texto)}</span></button>`;
    }).join('');
  }
  $po.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) elegir(Number(b.dataset.i)); });
  // Llegada a la Bastilla: el corredor frena ante el puente levadizo, la cámara se eleva para mostrar
  // la fortaleza, se iza la bandera tricolor y hay fuegos artificiales; después, el resultado.
  function llegar() {
    s.fase = 'llegada'; s.tLlegada = 0; s.carril = 1;
    $preg.classList.remove('ver');
    MJ.sonido.redoble(false); MJ.sonido.atenuar(false);
    MJ.sfx.aclamacion();
  }
  function actualizarLlegada(dt) {
    s.tLlegada += dt;
    const bast = s.meta.pos + BASTILLA_TRAS_META, destino = bast - PARADA_BASTILLA;
    const antes = s.dist;
    s.dist += (destino - s.dist) * Math.min(1, dt * 2.2);
    s.v = (s.dist - antes) / Math.max(dt, 1e-3);
    s.x += (1 - s.x) * Math.min(1, dt * 3);
    if (s.tLlegada > .7 && Math.floor(s.tLlegada / .45) !== s.ultimoFuego) { s.ultimoFuego = Math.floor(s.tLlegada / .45); lanzarFuego(); }
    if (s.tLlegada >= (MJ.reducido() ? 1.2 : DURACION_LLEGADA)) terminar(true);
  }
  function terminar(victoria) {
    if (s.fin) return;
    s.fin = true;
    const puntos = Math.round(s.puntos + (victoria ? 300 + s.vidas * 100 : 0));
    MJ.fin({
      puntos, victoria,
      titulo: victoria ? J.textoVictoria : J.textoDerrota,
      resumen: [[T.encerts, `${s.aciertos}/${s.preguntas.length}`], [J.objeto && J.objeto.plural || T.objetos, s.monedas], [T.rapidesa, `+${s.rapidesa}`]],
    });
  }

  // =====================================================================
  // ESCENA 3D
  // =====================================================================
  const C = {
    shell: MJ.color('--shell') || '#0f1733', papel: MJ.color('--papel') || '#efe3c6', tinta: MJ.color('--tinta') || '#1d1a16',
    acento: MJ.color('--acento') || '#b3202a', oro: MJ.color('--oro') || '#c9a44c', azul: (J.colores && J.colores.azul) || '#1f3b7a',
  };
  let bandera, multitud, fuegos;
  let escena, camara, luna, luzCalida, farolasLuz = [], grupoPista, suelo, aceras = [], edificios = [], farolas = [], bastilla, corredor, chispasPts;
  const texturas = {};

  // --- Texturas generadas por código (sin imágenes externas) ---
  function lienzo(w, h, pintar) { const c = document.createElement('canvas'); c.width = w; c.height = h; pintar(c.getContext('2d'), w, h); return c; }
  function textura(c, repetir) {
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    if (repetir) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  }
  const aleatorio = (semilla) => () => { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; };
  function texAdoquines() {
    // Una baldosa cubre el ancho de la calle; las juntas marcan sutilmente los tres carriles
    return lienzo(512, 512, (g, w, h) => {
      const r = aleatorio(7);
      g.fillStyle = '#2a2622'; g.fillRect(0, 0, w, h);
      const fil = 14, alto = h / fil;
      for (let y = 0; y < fil; y++) {
        let x = (y % 2) * -18;
        while (x < w) {
          const ancho = 30 + r() * 16;
          const tono = 68 + r() * 34;
          g.fillStyle = `rgb(${tono + 6},${tono},${tono - 8})`;
          g.beginPath();
          g.roundRect ? g.roundRect(x + 2, y * alto + 2, ancho - 4, alto - 4, 6) : g.rect(x + 2, y * alto + 2, ancho - 4, alto - 4);
          g.fill();
          g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(x + 4, y * alto + 4, ancho - 10, 3);
          x += ancho;
        }
      }
      g.fillStyle = 'rgba(0,0,0,.35)'; [w / 3, (2 * w) / 3].forEach((x) => g.fillRect(x - 3, 0, 6, h));
    });
  }
  function texLosas() {
    return lienzo(256, 256, (g, w, h) => {
      const r = aleatorio(3);
      g.fillStyle = '#3a342d'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < 4; y++) for (let x = 0; x < 2; x++) { const t = 92 + r() * 22; g.fillStyle = `rgb(${t},${t - 6},${t - 14})`; g.fillRect(x * 128 + 3, y * 64 + 3, 122, 58); }
    });
  }
  // Fachadas del París de 1789 (anterior a Haussmann): entramado de madera, sillería o revoque;
  // ventanas pequeñas de muchos cristales con contraventanas y tienda en la planta baja.
  // luces=false: color; luces=true: mapa emisivo (solo las ventanas iluminadas con velas)
  function texFachada(tipo, semilla, plantas, luces) {
    const r = aleatorio(semilla * 31 + 7);
    const revoques = ['#cdbf9f', '#c2ae8a', '#d6c6a2', '#b9a27e', '#c9b48e'];
    return lienzo(256, 512, (g, w, h) => {
      const baja = h * .22, alto = (h - baja - h * .04) / plantas;
      if (luces) { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); }
      else if (tipo === 'piedra') {
        g.fillStyle = '#b3a78f'; g.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 18) for (let x = (y / 18) % 2 ? -22 : 0; x < w; x += 44) { const t = 150 + r() * 30; g.fillStyle = `rgb(${t},${t - 8},${t - 24})`; g.fillRect(x + 1, y + 1, 42, 16); }
      } else {
        g.fillStyle = revoques[semilla % revoques.length]; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(${r() < .5 ? '0,0,0' : '255,255,255'},${r() * .07})`; g.fillRect(r() * w, r() * h, 2 + r() * 8, 2 + r() * 8); }
        if (tipo === 'revoque') { g.fillStyle = 'rgba(0,0,0,.12)'; for (let y = 0; y < h - baja; y += 16) { g.fillRect(0, y, 18, 14); g.fillRect(w - 18, y + 8, 18, 14); } } // esquinas de piedra
      }
      // Entramado de madera: vigas horizontales, postes y cruces de San Andrés

  // --- Soldados del ejército real (1789): casaca blanca con solapas azules, tricornio negro con
  //     escarapela blanca, calzón blanco, polainas negras y mosquete con bayoneta.

  function fusionar(partes) {
    const pos = [], nor = [], col = [], c = new THREE.Color();
    for (const pz of partes) {
      const g = (pz.geo.index ? pz.geo.toNonIndexed() : pz.geo.clone());
      g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(...pz.p), new THREE.Quaternion().setFromEuler(new THREE.Euler(...(pz.r || [0, 0, 0]))), new THREE.Vector3(1, 1, 1)));
      c.set(pz.c);

      for (let i = 0; i < P.length; i++) { pos.push(P[i]); nor.push(N[i]); }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

  function geometriaSoldado(pose) {

      { geo: B(.16, .38, .19), p: [-.12, .6, 0], c: CALZON }, { geo: B(.16, .38, .19), p: [.12, .6, 0], c: CALZON },       // calzón

      { geo: B(.1, .52, .02), p: [-.1, 1.2, .145], c: AZUL }, { geo: B(.1, .52, .02), p: [.1, 1.2, .145], c: AZUL },       // solapas
      { geo: B(.06, .7, .015), p: [0, 1.15, .16], r: [0, 0, .62], c: CUERO }, { geo: B(.06, .7, .015), p: [0, 1.15, .16], r: [0, 0, -.62], c: CUERO }, // correajes cruzados

  function geometriaMultitud() {

    for (let i = 0; i < 26; i++) {

      const m = new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rot, 0)), new THREE.Vector3(1, .9 + r() * .2, 1));

  function lanzarFuego() {

    for (let i = 0; i < 40; i++) {
      const k = d.siguiente; d.siguiente = (d.siguiente + 1) % d.vida.length;
      const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1), v = 5 + Math.random() * 3;

  function actualizarFuegos(dt) {
    if (!fuegos) return;
    const d = fuegos.userData, pos = fuegos.geometry.attributes.position.array, col = fuegos.geometry.attributes.color.array;
    let activos = false;
    for (let k = 0; k < d.vida.length; k++) {

      d.vida[k] -= dt;
      d.vel[k * 3 + 1] -= 3 * dt;

  // --- Objetos de la pista (se crean al verlos y se quitan al pasar) ---
  function crearMalla(o) {

      const c2 = new THREE.Mesh(new THREE.BoxGeometry(.8, .7, .8), MAT.maderaOscura); c2.position.set(.45, .35, .1); c2.rotation.y = .3; g.add(c2);

    const d = chispasPts.userData, pos = chispasPts.geometry.attributes.position.array;
    for (let i = 0; i < 12; i++) {
      const k = d.siguiente; d.siguiente = (d.siguiente + 1) % d.vida.length;
      pos[k * 3] = x; pos[k * 3 + 1] = y; pos[k * 3 + 2] = z;
      d.vel[k * 3] = (Math.random() - .5) * 4; d.vel[k * 3 + 1] = Math.random() * 4 + 1; d.vel[k * 3 + 2] = (Math.random() - .5) * 4;
      d.vida[k] = .7;
    }
  }
  function actualizarChispas(dt) {
    if (!chispasPts) return;
    const d = chispasPts.userData, pos = chispasPts.geometry.attributes.position.array;
    for (let k = 0; k < d.vida.length; k++) {
      if (d.vida[k] <= 0) continue;
      d.vida[k] -= dt;
      d.vel[k * 3 + 1] -= 9 * dt;
      pos[k * 3] += d.vel[k * 3] * dt; pos[k * 3 + 1] += d.vel[k * 3 + 1] * dt; pos[k * 3 + 2] += d.vel[k * 3 + 2] * dt;
      if (d.vida[k] <= 0) pos[k * 3 + 1] = -999;
    }
    chispasPts.geometry.attributes.position.needsUpdate = true;
  }

  // --- Cámara adaptada a la forma de la pantalla ---
  let W = 0, H = 0;
  function medir() {
    if (!renderer) return;
    const r = zona.getBoundingClientRect();
    W = r.width; H = r.height;
    renderer.setPixelRatio(Math.min(calidad.dpr, window.devicePixelRatio || 1));
    renderer.setSize(W, H, false);
    camara.aspect = W / Math.max(1, H);
    camara.fov = camara.aspect < 1 ? 70 : 58;
    camara.updateProjectionMatrix();
    dibujar(0);
  }

  // --- Calidad automática ---
  const calidad = { dpr: 1.5, nivel: 2, muestras: 0, tiempo: 0 };
  function vigilarRendimiento(dt) {
    if (calidad.nivel === 0 || !dt || window.__sinAutocalidad) return;
    calidad.muestras++; calidad.tiempo += dt;
    if (calidad.tiempo < 2) return;
    const fps = calidad.muestras / calidad.tiempo;
    calidad.muestras = 0; calidad.tiempo = 0;
    if (fps < 40) {
      calidad.nivel--;
      if (calidad.nivel === 1) { renderer.shadowMap.enabled = false; luna.castShadow = false; escena.traverse((m) => { if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach((x) => { x.needsUpdate = true; }); }); }
      else { calidad.dpr = 1; renderer.setPixelRatio(1); farolasLuz.forEach((l) => { l.visible = false; }); }
      medir();
    }
  }

  // --- Sincronizar la escena con el estado del juego y dibujar ---
  function dibujar(dt) {
    if (!renderer || !s) return;
    const xCorr = (s.x - 1) * CARRIL;
    // Suelo y aceras: desplazar la textura
    texturas.adoquines.offset.y = s.dist / CALLE;
    texturas.losas.offset.y = s.dist / 3.6;
    // Edificios y farolas: reciclar por delante
    const inicioPlaza = s.meta ? s.meta.pos - PLAZA_ANTES_META : Infinity;
    for (const e of edificios) {
      while (e.userData.pos < s.dist - 16) e.userData.pos += e.userData.largoLado;
      e.position.z = -(e.userData.pos - s.dist);
      e.visible = e.userData.pos + e.userData.ancho / 2 < inicioPlaza;   // la calle termina donde empieza la plaza
    }
    // Las aceras también terminan al llegar a la plaza
    const finAcera = Math.min(VISTA + 20, 20 + Math.max(0, inicioPlaza - s.dist));
    aceras.forEach((a) => { a.scale.z = finAcera / (VISTA + 20); a.position.z = 20 - finAcera / 2; });
    const largoF = farolas.length * PASO_FAROLA;
    const cercanas = [];
    for (const f of farolas) {
      while (f.userData.pos < s.dist - 8) f.userData.pos += largoF;
      f.position.z = -(f.userData.pos - s.dist);
      f.visible = f.userData.pos < inicioPlaza - 2;
      const zf = f.userData.pos - s.dist;
      if (zf > -2) cercanas.push({ f, zf });
    }
    cercanas.sort((a, b) => a.zf - b.zf);
    farolasLuz.forEach((l, i) => { const c = cercanas[i]; if (c) { c.f.userData.farol.getWorldPosition(l.position); l.position.y -= .3; } });
    // La Bastilla se acerca a medida que avanzas
    // Mientras no se conoce la meta, la Bastilla espera al fondo; después está en su sitio real
    const distBastilla = s.meta ? s.meta.pos + BASTILLA_TRAS_META - s.dist : Infinity;
    bastilla.position.set(0, 0, -Math.min(175, distBastilla));
    // Llegada: se iza la bandera y la multitud celebra
    const kL = s.fase === 'llegada' ? Math.min(1, s.tLlegada / (MJ.reducido() ? .6 : 2.4)) : 0;
    const suave = kL * kL * (3 - 2 * kL);
    bandera.position.y = 16.9 + suave * 6.2;
    const bp = bandera.geometry.attributes.position, bb = bandera.userData.base;
    for (let i = 0; i < bp.count; i++) { const x = bb[i * 3]; bp.array[i * 3 + 2] = Math.sin(s.t * 6 + x * 3) * .12 * (x + 1.3); }
    bp.needsUpdate = true;
    multitud.position.y = s.fase === 'llegada' && !MJ.reducido() ? Math.abs(Math.sin(s.t * 7)) * .12 : 0;
    // Objetos de la pista
    for (const o of s.objs) {
      const z = o.pos - s.dist;
      const visible = z < VISTA - 10 && z > -6 && !(o.hecho && o.tipo !== 'puerta') && !(o.tipo === 'puerta' && o.pasada && z < -1);
      if (visible && !o.malla && o.tipo !== 'meta') { o.malla = crearMalla(o); if (o.malla) grupoPista.add(o.malla); }
      if (!o.malla) continue;
      o.malla.visible = visible;
      if (!visible) continue;
      if (o.tipo === 'puerta') o.malla.position.set(0, 0, -z);
      else o.malla.position.set((o.carril - 1) * CARRIL, 0, -z);
      if (o.tipo === 'moneda') { o.malla.position.y = 1.1 + (MJ.reducido() ? 0 : Math.sin(s.t * 3 + o.pos * 1.3) * .08); o.malla.rotation.y = s.t * 2.5 + o.pos; }
      if (o.tipo === 'puerta') {
        const activa = s.fase === 'eligiendo' && s.puertaActual === o;
        o.malla.userData.carteles.forEach((cart) => {
          const marcado = activa && s.hover === cart.userData.c;
          const tex = marcado ? cart.userData.texM : cart.userData.texN;
          if (cart.material.map !== tex) { cart.material.map = tex; cart.material.needsUpdate = true; }
          cart.scale.setScalar(marcado ? 1.06 : 1);
        });
      }
    }
    // Corredor y cámara
    corredor.position.set(xCorr, 0, 0);
    corredor.rotation.y = Math.PI + (s.carril - s.x) * -.35;
    animarCorredor(s.t, s.fase !== 'eligiendo' && s.v > .5, dt || 0);
    const cz = camara.aspect < 1 ? 8.8 : 6.6, cy = camara.aspect < 1 ? 3.9 : 3.3;
    const objetivoX = xCorr * .55;
    camara.position.x += (objetivoX - camara.position.x) * Math.min(1, (dt || 1) * 5);
    // En la llegada la cámara se aleja y se eleva para mostrar la fortaleza entera
    camara.position.y = cy + suave * 5; camara.position.z = cz + suave * 12;
    if (s.sacudida > 0 && !MJ.reducido()) { camara.position.x += (Math.random() - .5) * .25; camara.position.y += (Math.random() - .5) * .15; }
    camara.lookAt(camara.position.x * .6, 1.4 + suave * 8, -12);
    luzCalida.position.set(xCorr, 3.2, 2);
    luna.position.set(xCorr - 12, 22, 8); luna.target.position.set(xCorr, 0, -6);
    renderer.render(escena, camara);
  }

  // --- Selección de puertas con el puntero (raycasting) ---
  const rayo = renderer ? new THREE.Raycaster() : null, ndc = renderer ? new THREE.Vector2() : null;
  function puertaEn(x, y) {
    if (!renderer || !s.puertaActual || !s.puertaActual.malla) return -1;
    ndc.set((x / W) * 2 - 1, -(y / H) * 2 + 1);
    rayo.setFromCamera(ndc, camara);
    const hit = rayo.intersectObjects(s.puertaActual.malla.children, false)[0];
    return hit && hit.object.userData.c != null ? hit.object.userData.c : -1;
  }
  function centroPuerta(c) {
    const cart = s.puertaActual.malla.userData.carteles[c];
    const v = new THREE.Vector3(); cart.getWorldPosition(v); v.project(camara);
    return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H };
  }

  // ---------- Bucle ----------
  let rafId = 0, ultimo = 0;
  function bucle(t) {
    const dt = Math.min(.05, (t - ultimo) / 1000 || 0);
    ultimo = t;
    if (MJ.estado() === 'jugando') { actualizar(dt); vigilarRendimiento(dt); }
    dibujar(dt);
    if (MJ.estado() === 'jugando') rafId = requestAnimationFrame(bucle);
  }
  // window.__sinBucle: solo para pruebas automáticas (avanzan el juego a mano con avanzar())
  function arrancar() { cancelAnimationFrame(rafId); if (window.__sinBucle) return; ultimo = performance.now(); rafId = requestAnimationFrame(bucle); }

  // ---------- Controles (idénticos a la versión 1) ----------
  document.addEventListener('keydown', (e) => {
    if (s && s.fase === 'eligiendo' && ['1', '2', '3'].includes(e.key)) { elegir(Number(e.key) - 1); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { mover(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { mover(1); e.preventDefault(); }
  });
  MJ.gestos(zona, {
    onDir: (d) => { if (d === 'izq') mover(-1); else if (d === 'der') mover(1); },
    onToque: (x, y, r) => {
      if (s.fase === 'eligiendo') { const c = puertaEn(x, y); if (c >= 0) elegir(c); return; }
      mover(x < r.width / 2 ? -1 : 1);
    },
  });
  cv.addEventListener('pointermove', (e) => {
    if (!s || s.fase !== 'eligiendo' || e.pointerType === 'touch') return;
    const r = zona.getBoundingClientRect(), c = puertaEn(e.clientX - r.left, e.clientY - r.top);
    if (c !== s.hover) {
      s.hover = c; cv.style.cursor = c >= 0 ? 'pointer' : 'default';
      $po.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sobre', i === c));
      dibujar(0);
    }
  });

  if (!renderer) { window.__minijuego = { juego: 'carrera-v2', webgl: false }; return; }
  MJ.iniciar({
    preparar: () => { nuevo(); camara && camara.position.set(0, 3.3, 6.6); dibujar(0); },
    empezar: arrancar,
    pausar: () => cancelAnimationFrame(rafId),
    reanudar: () => { arrancar(); if (s.fase === 'eligiendo') MJ.sonido.redoble(true); },
    sonidoFin: (victoria) => (victoria ? MJ.sfx.fanfarria() : MJ.sfx.tamborLento()),  // la aclamación ya sonó al llegar
  });
  nuevo();
  montarEscena(); new ResizeObserver(medir).observe(zona); medir();

  // Gancho de pruebas (mismo que la versión 1)
  window.__minijuego = Object.assign(window.__minijuego || {}, {
    juego: 'carrera-v2', webgl: !!renderer, llegada: () => ({ fase: s.fase, t: s.tLlegada, dist: s.dist, meta: s.meta && s.meta.pos, bandera: bandera && bandera.position.y }),
    info: () => ({ vidas: s.vidas, puntos: Math.round(s.puntos), carril: s.carril, aciertos: s.aciertos, fallos: s.fallos, dist: Math.round(s.dist * 10) / 10, fin: s.fin, pregunta: s.mostrada, objetos: s.objs.length, fase: s.fase, bonus: s.bonus, rapidesa: s.rapidesa, panel: $preg.classList.contains('ver') }),
    mover, elegir, puertaEn, centroPuerta, sonido: () => MJ.sonido.estado(),
    escena: () => renderer ? { mallas: grupoPista.children.length, edificios: edificios.length, farolas: farolas.length, sombras: renderer.shadowMap.enabled, dpr: renderer.getPixelRatio(), llamadas: renderer.info.render.calls, triangulos: renderer.info.render.triangles } : null,
    avanzar: (seg, piloto) => {
      for (let t = 0; t < seg && !s.fin; t += 1 / 60) {
        if (piloto) piloto(s);
        actualizar(1 / 60);
      }
      dibujar(1 / 60);
    },
    estadoInterno: () => s,
  });
})();
</script>
</body>
