<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minijuego</title>
<style>
/*__COMUN_CSS__*/
  .mj-zona { touch-action: none; overflow: hidden; }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .pregunta {
    position: absolute; left: 50%; top: 12px; z-index: 5; transform: translateX(-50%);
    width: min(720px, calc(100% - 24px)); display: none; gap: 8px;
    background: var(--papel); color: var(--tinta); border-radius: var(--r); padding: 10px 12px 12px;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.8);
  }
  .pregunta.ver { display: grid; animation: bajar .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes bajar { from { transform: translate(-50%, -20px); opacity: 0; } }
  .pregunta p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1rem, 3.6vw, 1.35rem); text-align: center; text-wrap: balance; }
  .pregunta .carriles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pregunta .carriles button {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px;
    border: 1.5px solid var(--tinta); border-radius: 8px; background: color-mix(in srgb, var(--papel) 55%, white);
    font-family: var(--f-mono); font-weight: 500; font-size: clamp(.78rem, 3vw, .98rem); text-align: left; line-height: 1.15;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .pregunta .carriles button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tinta); color: var(--papel); font-weight: 700; }
  .pregunta .carriles button:not(:disabled):hover, .pregunta .carriles button.sobre { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, var(--papel)); transform: translateY(-1px); }
  .pregunta .carriles button:disabled { cursor: default; }
  .pregunta .carriles button.elegida { border-color: var(--tinta); border-width: 3px; }
  .pregunta .carriles button.bien { background: var(--acierto); border-color: var(--acierto); color: var(--papel); }
  .pregunta .carriles button.mal { background: var(--fallo); border-color: var(--fallo); color: var(--papel); }
  .pregunta .carriles button.bien .n, .pregunta .carriles button.mal .n { background: var(--papel); color: var(--tinta); }
  .pregunta .nota { margin: 0; text-align: center; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; color: var(--tinta-suave); }
  .pregunta .carriles button > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) {
    .pregunta { padding: 8px 8px 10px; gap: 6px; }
    .pregunta .carriles { gap: 5px; }
    .pregunta .carriles button { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 6px 4px; font-size: .78rem; }
    .pregunta .carriles button .n { width: 22px; height: 22px; font-size: .75rem; }
  }
  .mj-zona.eligiendo #lienzo { cursor: default; }
  .mj-zona.eligiendo .ayuda-tactil { display: none; }
  .ayuda-tactil { position: absolute; bottom: 14px; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; padding: 0 14px; pointer-events: none; opacity: .5; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; color: var(--claro); }
</style>
</head>
<body>
<main class="mj-zona" id="zona">
  <canvas id="lienzo" aria-label="Joc"></canvas>
  <div class="pregunta" id="pregunta" aria-live="polite"><p id="pregTexto"></p><div class="carriles" id="pregOpciones" role="group"></div><p class="nota" id="pregNota"></p></div>
  <div class="ayuda-tactil" id="ayuda"><span>◀</span><span>▶</span></div>
</main>
<script>
const DATOS = /*__DATOS__*/null;
</script>
<script>
/*__COMUN_JS__*/
</script>
<script>
(function () {
  'use strict';
  const J = MJ.JUEGO, T = MJ.T;
  const cv = document.getElementById('lienzo');
  const g = cv.getContext('2d');
  const zona = document.getElementById('zona');
  const $preg = document.getElementById('pregunta'), $pt = document.getElementById('pregTexto'), $po = document.getElementById('pregOpciones'), $pn = document.getElementById('pregNota');
  if (!MJ.esTactil()) document.getElementById('ayuda').style.display = 'none';

  // ---------- Constantes de juego ----------
  const F = 20;            // focal: cuanto mayor, perspectiva más suave
  const VISIBLE = 75;      // metros visibles
  const GENERA = 150;      // metros por delante que se generan
  const PARADA = 7;        // metros antes de la puerta en que el corredor se detiene
  const ARRANQUE = .8;     // segundos para recuperar la velocidad tras elegir
  const HUECO = 170;       // metros entre puertas
  const VIDAS = J.vidas || 3;
  const V0 = 17, VMAX = 31;

  let W = 0, H = 0, DPR = 1;
  function medir() {
    const r = zona.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    dibujar();
  }
  new ResizeObserver(medir).observe(zona);

  // ---------- Estado ----------
  let s = null;
  function nuevo() {
    s = {
      dist: 0, v: V0, carril: 1, x: 1, vidas: VIDAS, puntos: 0, monedas: 0, aciertos: 0, fallos: 0,
      objs: [], genPos: 40, puertaSig: 0, puertasGeneradas: 0, invul: 0, sacudida: 0, t: 0,
      meta: null, fin: false, preguntas: MJ.azar(J.puertas).slice(0, J.numPuertas || J.puertas.length).map((p) => {
        const ops = MJ.azar(p.opciones.map((texto, i) => ({ texto, ok: i === p.correcta })));
        return { pregunta: p.pregunta, ops };
      }),
      mostrada: -1, resaltado: null, particulas: [],
      fase: 'corre', vObjetivo: V0, puertaActual: null, elegida: null, tEspera: 0, bonus: 0, rapidesa: 0, hover: -1, zancada: 0, tAmbiente: -1,
    };
    zona.classList.remove('eligiendo');
    MJ.hud([{ id: 'vidas', etiqueta: T.vidas, valor: '♥'.repeat(VIDAS) }, { id: 'puntos', etiqueta: T.puntos, valor: 0 }, { id: 'puerta', etiqueta: T.porta, valor: `0/${s.preguntas.length}` }]);
    $preg.classList.remove('ver');
  }

  // ---------- Generación de pista ----------
  function generar() {
    while (s.genPos < s.dist + GENERA + 20 && !s.meta) {
      const i = s.puertasGeneradas;
      const posPuerta = 40 + (i + 1) * HUECO - 20;
      if (i >= s.preguntas.length) {
        s.meta = { tipo: 'meta', pos: s.genPos + 60 };
        s.objs.push(s.meta);
        break;
      }
      // Filas entre el inicio del tramo y la puerta (sin obstáculos cerca de las puertas)
      if (s.genPos < posPuerta - 28) {
        const fila = s.genPos;
        const r = Math.random();
        if (r < .62) {
          const libres = MJ.azar([0, 1, 2]);
          const n = Math.random() < .35 + Math.min(.3, i * .05) ? 2 : 1;
          for (let k = 0; k < n; k++) s.objs.push({ tipo: 'obst', carril: libres[k], pos: fila, v: Math.random() });
          const libre = libres[n];
          if (Math.random() < .55) for (let k = 1; k <= 3; k++) s.objs.push({ tipo: 'moneda', carril: libre, pos: fila + k * 4 });
        } else {
          const c = Math.floor(Math.random() * 3);
          for (let k = 0; k < 4; k++) s.objs.push({ tipo: 'moneda', carril: c, pos: fila + k * 4 });
        }
        s.genPos += 17 + Math.random() * 8 - Math.min(5, i * .6);
      } else {
        s.objs.push({ tipo: 'puerta', pos: posPuerta, idx: i });
        s.puertasGeneradas++;
        s.genPos = posPuerta + 30;
      }
    }
  }

  // ---------- Proyección ----------
  const horizonte = () => H * .3;
  const baseY = () => H * .9;
  const anchoCarrilCerca = () => Math.min(W * .28, 200);
  function proy(z, carrilX) {
    const p = F / (F + Math.max(-F * .5, z));
    return { p, y: horizonte() + (baseY() - horizonte()) * p, x: W / 2 + (carrilX - 1) * anchoCarrilCerca() * p };
  }

  // ---------- Actualización ----------
  function mover(dir) {
    if (MJ.estado() !== 'jugando' || s.fase !== 'corre') return;
    const n = Math.max(0, Math.min(2, s.carril + dir));
    if (n !== s.carril) { s.carril = n; MJ.sfx.paso(); }
  }
  function perderVida(motivo) {
    s.vidas--; s.invul = 1.4; s.sacudida = .35;
    MJ.hudSet('vidas', '♥'.repeat(Math.max(0, s.vidas)) + '♡'.repeat(VIDAS - Math.max(0, s.vidas)));
    if (s.vidas <= 0) terminar(false);
    return motivo;
  }
  function actualizar(dt) {
    if (s.fin) return;
    s.t += dt;
    if (s.invul > 0) s.invul -= dt;
    if (s.sacudida > 0) s.sacudida -= dt;
    if (s.fase === 'eligiendo') {
      // Parado ante las puertas: solo corre el reloj del bonus (en pausa no se llama a actualizar)
      s.tEspera += dt;
      s.particulas.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.vida -= dt; });
      s.particulas = s.particulas.filter((p) => p.vida > 0);
      return;
    }
    if (s.v < s.vObjetivo) s.v = Math.min(s.vObjetivo, s.v + (s.vObjetivo / ARRANQUE) * dt);
    s.dist += s.v * dt;
    sonidoCarrera();
    s.puntos += s.v * dt * .5;
    s.x += (s.carril - s.x) * Math.min(1, dt * 16);
    generar();
    const carrilActual = Math.round(s.x);
    // Al llegar a la próxima puerta, el corredor se detiene hasta que se elige
    const prox = s.objs.find((o) => o.tipo === 'puerta' && !o.pasada);
    if (s.fase === 'corre' && prox && prox.pos - s.dist <= PARADA) { detenerse(prox); return; }
    for (const o of s.objs) {
      const z = o.pos - s.dist;
      if (o.hecho) continue;
      if (o.tipo === 'moneda' && z < 1.2 && z > -1 && o.carril === carrilActual) {
        o.hecho = true; s.monedas++; s.puntos += 10; MJ.sfx.moneda(); chispas(proy(0, s.x));
      } else if (o.tipo === 'obst' && z < 1.1 && z > -.8 && o.carril === carrilActual && s.invul <= 0) {
        o.hecho = true; MJ.sfx.madera(); MJ.flash(T.ai, false); perderVida('obst');
      } else if (o.tipo === 'puerta' && z < .4) {
        o.hecho = true; o.pasada = true;
        const elegida = s.elegida != null ? s.elegida : carrilActual;
        const q = s.preguntas[o.idx], ok = q.ops[elegida].ok;
        s.resaltado = { idx: o.idx, elegida, t: 1.6 };
        pintarOpciones(o.idx, elegida, true);
        MJ.hudSet('puerta', `${o.idx + 1}/${s.preguntas.length}`);
        if (ok) {
          s.aciertos++; s.puntos += 150 + s.bonus; s.rapidesa += s.bonus;
          $pn.textContent = s.bonus ? `+150 · +${s.bonus} ${String(T.rapidesa).toLowerCase()}` : '+150';
          MJ.sfx.canon(); MJ.sfx.fanfarria(); MJ.flash(T.selloAcierto, true); s.vObjetivo = Math.min(VMAX, s.vObjetivo + 1.6);
        } else {
          s.fallos++; $pn.textContent = '';
          MJ.sfx.trompeta(); MJ.flash(T.selloFallo, false); perderVida('puerta');
        }
        s.fase = 'corre'; s.elegida = null; s.puertaActual = null;
      } else if (o.tipo === 'meta' && z < 2) {
        o.hecho = true; terminar(true);
      }
    }
    s.objs = s.objs.filter((o) => o.pos - s.dist > -6);
    if (s.resaltado) { s.resaltado.t -= dt; if (s.resaltado.t <= 0) { s.resaltado = null; $preg.classList.remove('ver'); } }
    s.particulas.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.vida -= dt; });
    s.particulas = s.particulas.filter((p) => p.vida > 0);
    MJ.hudSet('puntos', MJ.fmt(Math.round(s.puntos)));
  }
  function chispas(pt) {
    if (MJ.reducido()) return;
    for (let i = 0; i < 8; i++) s.particulas.push({ x: pt.x, y: pt.y - 40, vx: (Math.random() - .5) * 260, vy: -Math.random() * 260, vida: .6 });
  }
  // Sonido ligado a la carrera: tempo de la música según la velocidad, pasos y multitud creciente
  function sonidoCarrera() {
    MJ.sonido.tempo(.9 + Math.max(0, Math.min(1, (s.v - V0) / (VMAX - V0))) * .25);
    const zancada = Math.floor((s.t * 14) / Math.PI);
    if (zancada !== s.zancada && s.v > 3) { s.zancada = zancada; MJ.sfx.adoquin(zancada % 2); }
    if (s.t - s.tAmbiente > .5) {
      s.tAmbiente = s.t;
      MJ.sonido.ambienteIntensidad(.3 + .7 * Math.min(1, s.dist / (40 + (s.preguntas.length + 1) * HUECO)));
    }
  }
  function detenerse(puerta) {
    s.dist = puerta.pos - PARADA;
    s.vObjetivo = Math.max(s.vObjetivo, s.v); s.v = 0;
    s.fase = 'eligiendo'; s.puertaActual = puerta; s.tEspera = 0; s.hover = -1;
    zona.classList.add('eligiendo');
    mostrarPregunta(puerta.idx);
    MJ.sfx.tic();
    MJ.sonido.atenuar(true); MJ.sonido.redoble(true);
  }
  function elegir(c) {
    if (MJ.estado() !== 'jugando' || s.fase !== 'eligiendo' || c < 0 || c > 2) return false;
    s.elegida = c; s.carril = c; s.fase = 'cruzando'; s.hover = -1;
    // Bonus de rapidez: 100 si responde en 2 s o menos, bajando hasta 0 a los 10 s
    s.bonus = Math.round(100 * Math.max(0, Math.min(1, 1 - (s.tEspera - 2) / 8)));
    zona.classList.remove('eligiendo');
    MJ.sonido.redoble(false); MJ.sonido.atenuar(false);
    pintarOpciones(s.puertaActual.idx, c, false);
    $pn.textContent = '';
    MJ.sfx.paso();
    return true;
  }
  function mostrarPregunta(idx) {
    s.mostrada = idx;
    const q = s.preguntas[idx];
    $pt.textContent = q.pregunta;
    pintarOpciones(idx, null, false);
    $pn.textContent = MJ.esTactil() ? T.triaTactil : T.triaTeclat;
    $preg.classList.add('ver');
    const b = $po.querySelector('button');
    if (b && !MJ.esTactil()) b.focus({ preventScroll: true });
  }
  function pintarOpciones(idx, elegida, resuelta) {
    const q = s.preguntas[idx];
    $po.innerHTML = q.ops.map((o, i) => {
      let cls = '';
      if (resuelta) { if (o.ok) cls = 'bien'; else if (i === elegida) cls = 'mal'; }
      else if (elegida === i) cls = 'elegida';
      const bloqueado = elegida != null || resuelta;
      return `<button data-i="${i}" class="${cls}" ${bloqueado ? 'disabled' : ''}><span class="n">${i + 1}</span><span>${MJ.esc(o.texto)}</span></button>`;
    }).join('');
  }
  $po.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) elegir(Number(b.dataset.i)); });
  // Rectángulo en pantalla de cada puerta (para tocarlas o señalarlas con el ratón)
  function puertaEn(x, y) {
    if (!s.puertaActual) return -1;
    const z = s.puertaActual.pos - s.dist;
    for (let c = 0; c < 3; c++) {
      const pt = proy(z, c), w = anchoCarrilCerca() * pt.p * .92, h = w * 1.25;
      if (x >= pt.x - w * .55 && x <= pt.x + w * .55 && y >= pt.y - h * 1.1 && y <= pt.y + 10) return c;
    }
    return -1;
  }
  function terminar(victoria) {
    if (s.fin) return;
    s.fin = true;
    const puntos = Math.round(s.puntos + (victoria ? 300 + s.vidas * 100 : 0));
    MJ.fin({
      puntos, victoria,
      titulo: victoria ? J.textoVictoria : J.textoDerrota,
      resumen: [[T.encerts, `${s.aciertos}/${s.preguntas.length}`], [J.objeto && J.objeto.plural || T.objetos, s.monedas], [T.rapidesa, `+${s.rapidesa}`]],
    });
  }

  // ---------- Dibujo ----------
  const C = {};
  function colores() {
    C.shell = MJ.color('--shell') || '#0f1733'; C.papel = MJ.color('--papel') || '#efe3c6'; C.tinta = MJ.color('--tinta') || '#1d1a16';
    C.acento = MJ.color('--acento') || '#b3202a'; C.oro = MJ.color('--oro') || '#c9a44c'; C.claro = MJ.color('--claro') || '#efe3c6';
    C.azul = (J.colores && J.colores.azul) || '#1f3b7a';
  }
  function mezcla(a, b, t) {
    const h = (c) => { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map((x) => x + x).join(''); return [0, 2, 4].map((i) => parseInt(c.substr(i, 2), 16)); };
    const x = h(a), y = h(b);
    return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',')})`;
  }
  function cielo() {
    const hz = horizonte();
    const gr = g.createLinearGradient(0, 0, 0, hz);
    gr.addColorStop(0, C.shell); gr.addColorStop(1, mezcla(C.shell, C.acento, .35));
    g.fillStyle = gr; g.fillRect(0, 0, W, hz + 2);
    g.fillStyle = mezcla(C.claro, C.shell, .3);
    for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = (i * 53.7) % (hz * .8); g.globalAlpha = .25 + (i % 5) * .1; g.fillRect(x, y, 1.5, 1.5); }
    g.globalAlpha = 1;
  }
  function ciudad() {
    const hz = horizonte();
    g.fillStyle = mezcla(C.shell, '#000000', .25);
    for (let i = 0; i < 14; i++) {
      const w = W / 14, hgt = 18 + ((i * 37) % 30);
      const x = i * w;
      if (Math.abs(x + w / 2 - W / 2) < W * .16) continue;
      g.fillRect(x, hz - hgt, w - 2, hgt + 2);
      g.fillStyle = C.oro; g.globalAlpha = .55;
      for (let k = 0; k < 3; k++) if ((i + k) % 2) g.fillRect(x + 4 + k * (w / 3.4), hz - hgt + 6, 3, 4);
      g.globalAlpha = 1; g.fillStyle = mezcla(C.shell, '#000000', .25);
    }
  }
  function bastilla(prog) {
    const hz = horizonte();
    const e = .45 + prog * 1.4;
    const bw = Math.min(W * .34, 260) * e, bh = bw * .55;
    const x0 = W / 2 - bw / 2, y0 = hz - bh;
    g.fillStyle = mezcla(C.shell, '#000000', .45);
    const torres = 5;
    for (let i = 0; i < torres; i++) {
      const tx = x0 + (i / (torres - 1)) * (bw - bw * .16), tw = bw * .16, th = bh * (i % 2 ? 1 : .88);
      g.fillRect(tx, hz - th, tw, th);
      for (let k = 0; k < 3; k++) g.fillRect(tx + k * tw / 2.6, hz - th - tw * .18, tw / 4, tw * .2);
    }
    g.fillRect(x0 + bw * .05, y0 + bh * .3, bw * .9, bh * .7);
    g.fillStyle = C.oro; g.globalAlpha = .7;
    for (let i = 0; i < 7; i++) g.fillRect(x0 + bw * (.12 + i * .12), y0 + bh * .55, Math.max(2, bw * .018), Math.max(3, bh * .06));
    g.globalAlpha = 1;
    if (J.objetivo) { g.fillStyle = C.claro; g.globalAlpha = .75; g.font = `600 ${Math.max(10, 11 * e)}px ${MJ.color('--f-mono') || 'monospace'}`; g.textAlign = 'center'; g.fillText(String(J.objetivo).toUpperCase(), W / 2, y0 - 10 * e); g.globalAlpha = 1; }
  }
  function carretera() {
    const hz = horizonte(), b = baseY();
    const aCerca = anchoCarrilCerca() * 1.5, pLejos = F / (F + VISIBLE);
    const aLejos = aCerca * pLejos;
    const yLejos = hz + (b - hz) * pLejos;
    g.fillStyle = mezcla(C.shell, '#000000', .35);
    g.fillRect(0, hz, W, H - hz);
    g.beginPath();
    g.moveTo(W / 2 - aLejos, yLejos); g.lineTo(W / 2 + aLejos, yLejos);
    const pAbajo = (H + 20 - hz) / (b - hz); // perspectiva prolongada hasta el borde inferior
    g.lineTo(W / 2 + aCerca * pAbajo, H + 20); g.lineTo(W / 2 - aCerca * pAbajo, H + 20); g.closePath();
    const gr = g.createLinearGradient(0, yLejos, 0, H);
    gr.addColorStop(0, mezcla(C.shell, C.papel, .12)); gr.addColorStop(1, mezcla(C.shell, C.papel, .28));
    g.fillStyle = gr; g.fill();
    // adoquines: líneas transversales que se desplazan
    g.strokeStyle = mezcla(C.shell, C.papel, .08); g.lineWidth = 1;
    const paso = 6, off = s ? s.dist % paso : 0;
    for (let z = VISIBLE - off; z > -2; z -= paso) {
      const a = proy(z, 0), bb = proy(z, 2);
      g.beginPath(); g.moveTo(a.x - anchoCarrilCerca() * a.p * .5, a.y); g.lineTo(bb.x + anchoCarrilCerca() * bb.p * .5, bb.y); g.stroke();
    }
    // líneas de carril
    g.strokeStyle = C.oro; g.globalAlpha = .6;
    const dash = 5, offd = s ? s.dist % (dash * 2) : 0;
    for (const cx of [.5, 1.5]) {
      for (let z = VISIBLE - offd; z > -2; z -= dash * 2) {
        const a = proy(z, cx), bb = proy(Math.max(-2, z - dash), cx);
        g.lineWidth = Math.max(1, 3 * a.p); g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(bb.x, bb.y); g.stroke();
      }
    }
    g.globalAlpha = 1;
  }
  // Fachadas a ambos lados de la calle, en perspectiva y desplazándose con la carrera
  function fachadas() {
    const paso = 9, off = s ? s.dist % paso : 0, fase = s ? Math.floor(s.dist / paso) : 0;
    const bloques = [];
    for (let z = VISIBLE - off, k = 0; z > -paso; z -= paso, k++) bloques.push({ z, id: fase + Math.round((VISIBLE - off - z) / paso) });
    for (const { z, id } of bloques.sort((a, b) => b.z - a.z)) {
      const a = proy(z, 0), b = proy(Math.max(-F * .4, z - paso), 0);
      for (const lado of [-1, 1]) {
        const bordeA = W / 2 + lado * anchoCarrilCerca() * 1.62 * a.p, bordeB = W / 2 + lado * anchoCarrilCerca() * 1.62 * b.p;
        const alto = (70 + ((id * 7 + (lado > 0 ? 3 : 0)) % 5) * 18);
        const hA = alto * a.p, hB = alto * b.p;
        g.fillStyle = (id + (lado > 0 ? 1 : 0)) % 2 ? mezcla(C.shell, C.papel, .1) : mezcla(C.shell, C.papel, .06);
        g.beginPath(); g.moveTo(bordeA, a.y); g.lineTo(bordeB, b.y); g.lineTo(bordeB, b.y - hB); g.lineTo(bordeA, a.y - hA); g.closePath(); g.fill();
        // frente del bloque hacia la calle y ventanas iluminadas
        g.fillStyle = C.oro; g.globalAlpha = .45;
        const n = 3;
        for (let v = 1; v <= n; v++) {
          const t = v / (n + 1), x = bordeA + (bordeB - bordeA) * t, y = a.y + (b.y - a.y) * t, hh = hA + (hB - hA) * t;
          if ((id + v) % 3) g.fillRect(x - 2 * a.p, y - hh * .72, Math.max(1.5, 5 * a.p), Math.max(2, 8 * a.p));
        }
        g.globalAlpha = 1;
      }
    }
  }
  function barricada(pt, w, semilla) {
    const h = w * .62;
    const x = pt.x - w / 2, y = pt.y - h;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(pt.x, pt.y, w * .55, w * .1, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#6b4a2b'; g.fillRect(x, y + h * .35, w * .55, h * .65);
    g.fillStyle = '#5a3d22'; g.fillRect(x + w * .45, y + h * .15, w * .55, h * .85);
    g.strokeStyle = '#3b2716'; g.lineWidth = Math.max(1, w * .02);
    for (let k = 1; k < 3; k++) { g.beginPath(); g.moveTo(x + w * .45, y + h * .15 + k * h * .28); g.lineTo(x + w, y + h * .15 + k * h * .28); g.stroke(); }
    g.beginPath(); g.moveTo(x, y + h * .35); g.lineTo(x + w * .55, y + h); g.stroke();
    // bandera pequeña
    if (semilla > .5) { g.fillStyle = C.acento; g.fillRect(x + w * .75, y - h * .35, w * .16, h * .22); g.fillStyle = '#3b2716'; g.fillRect(x + w * .74, y - h * .38, Math.max(1, w * .02), h * .55); }
  }
  function escarapela(pt, r, t) {
    const y = pt.y - r * 2.2 - Math.sin(t * 5 + pt.x) * r * .3;
    g.fillStyle = C.azul; g.beginPath(); g.arc(pt.x, y, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(pt.x, y, r * .66, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.acento; g.beginPath(); g.arc(pt.x, y, r * .36, 0, Math.PI * 2); g.fill();
  }
  function puerta(o, z, soloCartel) {
    const q = s.preguntas[o.idx];
    for (let c = 0; c < 3; c++) {
      const pt = proy(z, c), w = anchoCarrilCerca() * pt.p * .92, h = w * 1.25;
      const x = pt.x - w / 2, y = pt.y - h;
      g.fillStyle = mezcla(C.papel, C.tinta, .25);
      if (!soloCartel) { g.fillRect(x, y, w * .08, h); g.fillRect(x + w * .92, y, w * .08, h); }
      const activa = s.fase === 'eligiendo' && s.puertaActual === o;
      const marcada = activa && s.hover === c;
      g.fillStyle = marcada ? mezcla(C.papel, C.oro, .35) : C.papel; g.fillRect(x - w * .02, y - h * .02, w * 1.04, h * .3);
      g.strokeStyle = marcada ? C.acento : C.tinta; g.lineWidth = Math.max(1, w * (marcada ? .035 : .015)); g.strokeRect(x + w * .02, y + h * .005, w * .96, h * .26);
      const fs = Math.max(7, w * .15);
      g.fillStyle = C.tinta; g.font = `600 ${fs}px ${MJ.color('--f-mono') || 'monospace'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(q.ops[c].texto, pt.x, y + h * .14, w * .9);
      // distintivo con el número de la puerta
      const r = Math.max(7, w * .11);
      g.fillStyle = marcada ? C.acento : C.tinta; g.beginPath(); g.arc(pt.x, y - h * .02 - r * .9, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = C.papel; g.font = `700 ${r * 1.15}px ${MJ.color('--f-mono') || 'monospace'}`; g.fillText(String(c + 1), pt.x, y - h * .02 - r * .85);
      g.textBaseline = 'alphabetic';
    }
  }
  function jugador() {
    const pt = proy(0, s.x);
    const u = anchoCarrilCerca() * .5;
    if (s.invul > 0 && Math.floor(s.invul * 12) % 2) return;
    const fase = s.t * 14;
    const x = pt.x, y = pt.y;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x, y, u * .45, u * .1, 0, 0, Math.PI * 2); g.fill();
    // piernas
    g.strokeStyle = C.papel; g.lineWidth = u * .16; g.lineCap = 'round';
    const pl = s.fase === 'eligiendo' ? 0 : Math.sin(fase) * u * .25 * Math.min(1, s.v / V0);
    g.beginPath(); g.moveTo(x - u * .1, y - u * .75); g.lineTo(x - u * .12 + pl, y - u * .05); g.stroke();
    g.beginPath(); g.moveTo(x + u * .1, y - u * .75); g.lineTo(x + u * .12 - pl, y - u * .05); g.stroke();
    // cuerpo (casaca azul)
    g.fillStyle = C.azul; g.beginPath(); g.roundRect ? g.roundRect(x - u * .26, y - u * 1.5, u * .52, u * .8, u * .12) : g.rect(x - u * .26, y - u * 1.5, u * .52, u * .8); g.fill();
    g.fillStyle = C.acento; g.fillRect(x - u * .26, y - u * .82, u * .52, u * .08);
    // cabeza y gorro frigio
    g.fillStyle = '#e8c9a0'; g.beginPath(); g.arc(x, y - u * 1.72, u * .2, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.acento; g.beginPath(); g.moveTo(x - u * .22, y - u * 1.76); g.quadraticCurveTo(x - u * .05, y - u * 2.3, x + u * .3, y - u * 2.05); g.lineTo(x + u * .2, y - u * 1.78); g.closePath(); g.fill();
    // bandera tricolor ondeante
    const mx = x + u * .3, my = y - u * 1.4;
    g.strokeStyle = '#3b2716'; g.lineWidth = u * .05; g.beginPath(); g.moveTo(mx, my + u * .4); g.lineTo(mx, my - u * 1.2); g.stroke();
    const fw = u * .7, fh = u * .45, cols = [C.azul, '#ffffff', C.acento];
    for (let i = 0; i < 3; i++) {
      g.fillStyle = cols[i]; g.beginPath();
      const x1 = mx + (fw / 3) * i, x2 = mx + (fw / 3) * (i + 1);
      const o1 = Math.sin(fase * .5 + i) * u * .06, o2 = Math.sin(fase * .5 + i + 1) * u * .06;
      g.moveTo(x1, my - u * 1.2 + o1); g.lineTo(x2, my - u * 1.2 + o2); g.lineTo(x2, my - u * 1.2 + fh + o2); g.lineTo(x1, my - u * 1.2 + fh + o1); g.closePath(); g.fill();
    }
  }
  function dibujar() {
    if (!W || !H) return;
    if (!C.shell) colores();
    g.save();
    if (s && s.sacudida > 0 && !MJ.reducido()) g.translate((Math.random() - .5) * 10, (Math.random() - .5) * 6);
    cielo(); ciudad();
    const prog = s ? Math.min(1, s.dist / (40 + (s.preguntas.length + 1) * HUECO)) : 0;
    bastilla(prog);
    carretera();
    fachadas();
    if (s) {
      const orden = s.objs.filter((o) => !o.hecho || o.tipo === 'puerta').map((o) => ({ o, z: o.pos - s.dist })).filter((e) => e.z < VISIBLE && e.z > -3).sort((a, b) => b.z - a.z);
      for (const { o, z } of orden) {
        if (o.tipo === 'obst' && !o.hecho) { const pt = proy(z, o.carril); barricada(pt, anchoCarrilCerca() * pt.p * .78, o.v); }
        else if (o.tipo === 'moneda' && !o.hecho) { const pt = proy(z, o.carril); escarapela(pt, anchoCarrilCerca() * pt.p * .13, s.t); }
        else if (o.tipo === 'puerta' && !o.pasada) puerta(o, z);
      }
      jugador();
      // Parado: las puertas activas se redibujan encima del corredor para que su bandera no tape los carteles
      if (s.fase === 'eligiendo' && s.puertaActual) puerta(s.puertaActual, s.puertaActual.pos - s.dist, true);
      g.fillStyle = C.oro;
      for (const p of s.particulas) { g.globalAlpha = Math.max(0, p.vida / .6); g.fillRect(p.x, p.y, 4, 4); }
      g.globalAlpha = 1;
    }
    g.restore();
  }

  // ---------- Bucle ----------
  let rafId = 0, ultimo = 0;
  function bucle(t) {
    const dt = Math.min(.05, (t - ultimo) / 1000 || 0);
    ultimo = t;
    if (MJ.estado() === 'jugando') actualizar(dt);
    dibujar();
    if (MJ.estado() === 'jugando') rafId = requestAnimationFrame(bucle);
  }
  function arrancar() { cancelAnimationFrame(rafId); ultimo = performance.now(); rafId = requestAnimationFrame(bucle); }

  // ---------- Controles ----------
  document.addEventListener('keydown', (e) => {
    if (s && s.fase === 'eligiendo' && ['1', '2', '3'].includes(e.key)) { elegir(Number(e.key) - 1); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { mover(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { mover(1); e.preventDefault(); }
  });
  MJ.gestos(zona, {
    onDir: (d) => { if (d === 'izq') mover(-1); else if (d === 'der') mover(1); },
    onToque: (x, y, r) => {
      if (s.fase === 'eligiendo') { const c = puertaEn(x, y); if (c >= 0) elegir(c); return; }
      mover(x < r.width / 2 ? -1 : 1);
    },
  });
  cv.addEventListener('pointermove', (e) => {
    if (!s || s.fase !== 'eligiendo' || e.pointerType === 'touch') return;
    const r = zona.getBoundingClientRect(), c = puertaEn(e.clientX - r.left, e.clientY - r.top);
    if (c !== s.hover) {
      s.hover = c; cv.style.cursor = c >= 0 ? 'pointer' : 'default';
      $po.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sobre', i === c));
      dibujar();
    }
  });

  MJ.iniciar({
    preparar: () => { nuevo(); colores(); dibujar(); },
    empezar: arrancar,
    pausar: () => cancelAnimationFrame(rafId),
    reanudar: () => { arrancar(); if (s.fase === 'eligiendo') MJ.sonido.redoble(true); },
    sonidoFin: (victoria) => (victoria ? MJ.sfx.aclamacion() : MJ.sfx.tamborLento()),
  });
  nuevo(); medir();

  // Gancho de pruebas: permite simular sin depender de requestAnimationFrame
  window.__minijuego = Object.assign(window.__minijuego || {}, {
    juego: 'carrera',
    info: () => ({ vidas: s.vidas, puntos: Math.round(s.puntos), carril: s.carril, aciertos: s.aciertos, fallos: s.fallos, dist: Math.round(s.dist * 10) / 10, fin: s.fin, pregunta: s.mostrada, objetos: s.objs.length, fase: s.fase, bonus: s.bonus, rapidesa: s.rapidesa, panel: $preg.classList.contains('ver') }),
    mover, elegir, puertaEn, sonido: () => MJ.sonido.estado(),
    centroPuerta: (c) => { const z = s.puertaActual.pos - s.dist, pt = proy(z, c), w = anchoCarrilCerca() * pt.p * .92; return { x: pt.x, y: pt.y - w * .9 }; },
    avanzar: (seg, piloto) => {
      for (let t = 0; t < seg && !s.fin; t += 1 / 60) {
        if (piloto) piloto(s);
        actualizar(1 / 60);
      }
      dibujar();
    },
    estadoInterno: () => s,
  });
})();
</script>
