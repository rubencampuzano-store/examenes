<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salt de dades</title>
<style>
  /* ===== Base común de los minijuegos (se incrusta en cada plantilla) ===== */
  :root {
    color-scheme: dark;
    --shell: #0f1733;
    --shell-2: color-mix(in srgb, var(--shell) 86%, white);
    --papel: #efe3c6;
    --papel-2: color-mix(in srgb, var(--papel) 88%, var(--tinta));
    --tinta: #1d1a16;
    --tinta-suave: #5b5244;
    --claro: #efe3c6;
    --claro-suave: color-mix(in srgb, var(--claro) 68%, transparent);
    --acento: #b3202a;
    --oro: #c9a44c;
    --acierto: #2f7d4a;
    --fallo: #b3202a;
    --linea: color-mix(in srgb, var(--tinta) 18%, transparent);
    --linea-clara: color-mix(in srgb, var(--claro) 16%, transparent);
    --f-display: "Bodoni Moda", Didot, Georgia, serif;
    --f-texto: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
    --f-mono: "DM Mono", ui-monospace, Consolas, monospace;
    --patron: none;
    --grano: none;
    --r: 6px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--shell); color: var(--claro);
    font-family: var(--f-texto); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overflow: hidden;
    display: flex; flex-direction: column;
    padding-top: var(--safe-t); padding-bottom: var(--safe-b);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--patron); opacity: .07; z-index: 0; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--grano); opacity: .09; mix-blend-mode: overlay; z-index: 90; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
  h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; }
  .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; }

  /* Cabecera / HUD */
  .mj-top {
    position: relative; z-index: 20; flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--linea-clara);
    background: color-mix(in srgb, var(--shell) 85%, transparent);
  }
  .mj-titulo { margin-right: auto; min-width: 0; display: grid; }
  .mj-titulo b { font-family: var(--f-display); font-style: italic; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mj-titulo span { color: var(--oro); }
  .mj-hud { display: flex; gap: 8px; align-items: center; }
  .mj-dato { display: grid; justify-items: center; min-width: 52px; padding: 4px 10px; border: 1px solid var(--linea-clara); border-radius: 10px; }
  .mj-dato small { font-family: var(--f-mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--claro-suave); }
  .mj-dato b { font-family: var(--f-mono); font-weight: 500; font-size: 1rem; color: var(--oro); font-variant-numeric: tabular-nums; }
  .mj-icon { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--linea-clara); color: var(--claro-suave); }
  .mj-icon:hover { color: var(--claro); }
  .mj-icon svg { width: 18px; height: 18px; }
  .mj-volver { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--linea-clara); color: var(--claro-suave); font-family: var(--f-mono); font-size: .8rem; text-decoration: none; white-space: nowrap; }
  .mj-volver:hover, .mj-volver:focus-visible { color: var(--claro); border-color: var(--claro-suave); }
  .mj-volver svg { width: 18px; height: 18px; flex: none; }
  .mj-acciones a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .mj-zona { position: relative; z-index: 1; flex: 1; min-height: 0; }

  /* Botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 0 26px; border-radius: 999px;
    background: var(--acento); color: var(--papel); font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 10px 24px -10px color-mix(in srgb, var(--acento) 80%, black);
    transition: transform .12s, filter .2s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.fantasma { background: transparent; color: var(--tinta); border: 1px solid var(--linea); box-shadow: none; }

  /* Capas (intro, cuenta atrás, pausa, resultado) */
  .mj-capa {
    position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 16px;
    background: color-mix(in srgb, var(--shell) 72%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .mj-capa.ver { display: grid; animation: mjEntrar .3s ease; }
  @keyframes mjEntrar { from { opacity: 0; } }
  .mj-carta {
    position: relative; width: min(460px, 100%); max-height: calc(100% - 16px); overflow: auto;
    background: var(--papel); color: var(--tinta); border-radius: var(--r);
    padding: 26px 24px 22px; display: grid; gap: 14px; text-align: center;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.85);
    animation: mjSubir .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes mjSubir { from { transform: translateY(24px) scale(.97); opacity: 0; } }
  .mj-carta::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background-image: var(--grano); opacity: .35; mix-blend-mode: multiply; pointer-events: none; }
  .mj-carta > * { position: relative; }
  .mj-carta h2 { font-size: clamp(1.8rem, 6vw, 2.4rem); font-style: italic; }
  .mj-carta p { margin: 0; color: var(--tinta-suave); }
  .mj-carta .eyebrow { color: var(--acento); }
  .mj-controles { display: grid; gap: 8px; text-align: left; margin: 4px 0; padding: 0; list-style: none; }
  .mj-controles li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; font-size: .95rem; }
  .mj-controles li i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-style: normal; border: 1.5px solid var(--tinta); font-family: var(--f-mono); font-size: .8rem; }
  .mj-acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .mj-audio { display: grid; gap: 8px; text-align: left; padding: 12px 0 4px; border-top: 1px solid var(--linea); }
  .mj-audio > .eyebrow { color: var(--tinta-suave); }
  .mj-interruptores { display: grid; gap: 6px; }
  .mj-switch {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; width: 100%; min-height: 52px;
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--linea); background: color-mix(in srgb, var(--papel) 70%, white);
    text-align: left; transition: border-color .15s, background .15s;
  }
  .mj-switch:hover { border-color: var(--tinta); }
  .mj-switch-txt { display: grid; min-width: 0; }
  .mj-switch-txt b { font-weight: 700; }
  .mj-switch-txt small { color: var(--tinta-suave); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mj-switch-estado { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
  .mj-switch-pista { position: relative; width: 46px; height: 26px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 22%, transparent); transition: background .2s; }
  .mj-switch-pista i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--papel); box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .2s; }
  .mj-switch[aria-checked="true"] .mj-switch-pista { background: var(--acierto); }
  .mj-switch[aria-checked="true"] .mj-switch-pista i { transform: translateX(20px); }
  .mj-cuenta { font-family: var(--f-display); font-weight: 800; font-size: clamp(6rem, 30vw, 11rem); color: var(--claro); text-shadow: 0 10px 40px rgba(0,0,0,.6); animation: mjLatido .9s ease both; }
  @keyframes mjLatido { 0% { transform: scale(1.8); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: .0; transform: scale(.8); } }
  .mj-sello { width: 110px; justify-self: center; transform: rotate(-10deg); filter: drop-shadow(0 8px 14px rgba(0,0,0,.35)); }
  /* Tarjeta de inicio compacta: el botón de jugar siempre queda a la vista */
  .mj-intro { gap: 10px; padding: 18px 22px 16px; }
  .mj-intro .mj-sello { width: 70px; margin-bottom: -2px; }
  .mj-intro h2 { font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.1; }
  .mj-intro > p { font-size: .9rem; line-height: 1.4; }
  .mj-intro .mj-controles { gap: 5px; margin: 0; }
  .mj-intro .mj-controles li { grid-template-columns: 28px 1fr; gap: 8px; font-size: .86rem; line-height: 1.3; }
  .mj-intro .mj-controles li i { width: 28px; height: 28px; font-size: .66rem; border-width: 1.2px; }
  .mj-intro .mj-nota { font-size: .76rem; }
  .mj-intro .mj-acciones { margin-top: 2px; }
  .mj-intro > p:last-child { font-size: .7rem !important; line-height: 1.3; }
  /* Si aun así no cabe (pantallas muy bajas), el botón queda fijo abajo y el resto se desplaza */
  @media (max-height: 560px) { .mj-intro .mj-acciones { position: sticky; bottom: -16px; z-index: 1; margin: 0 -22px; padding: 8px 22px; background: var(--papel); } }
  @media (max-height: 640px) { .mj-intro .mj-sello { display: none; } }
  .mj-estrellas { display: flex; justify-content: center; gap: 10px; color: var(--oro); }
  .mj-estrellas svg { width: 44px; height: 44px; animation: mjBrillo .6s cubic-bezier(.2,1.4,.4,1) backwards; }
  .mj-estrellas svg.off { color: var(--linea); }
  .mj-estrellas svg:nth-child(2) { animation-delay: .15s; }
  .mj-estrellas svg:nth-child(3) { animation-delay: .3s; }
  @keyframes mjBrillo { from { transform: scale(0) rotate(-60deg); opacity: 0; } }
  .mj-billete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border: 1px solid var(--linea); border-radius: 4px; background: color-mix(in srgb, var(--papel) 70%, white); }
  .mj-billete b { font-family: var(--f-mono); font-weight: 500; font-size: 1.9rem; color: var(--acento); }
  .mj-billete em { font-family: var(--f-display); }
  .mj-resumen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mj-resumen div { padding: 8px; border-bottom: 1px solid var(--linea); display: grid; }
  .mj-resumen small { font-size: .72rem; color: var(--tinta-suave); }
  .mj-resumen b { font-family: var(--f-mono); font-weight: 500; font-size: 1.2rem; }

  /* Aviso flotante (acierto/fallo breve) */
  .mj-flash {
    position: fixed; left: 50%; top: 30%; z-index: 40; pointer-events: none;
    font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 2.2rem); letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 16px; border: 4px double currentColor; border-radius: 8px; background: color-mix(in srgb, var(--papel) 85%, transparent);
    transform: translate(-50%, -50%) rotate(-8deg); opacity: 0;
  }
  .mj-flash.ok { color: var(--acierto); }
  .mj-flash.ko { color: var(--fallo); }
  .mj-flash.ver { animation: mjEstampar .9s cubic-bezier(.2,1.3,.4,1) forwards; }
  @keyframes mjEstampar { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-20deg) scale(2.2); } 25% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }
  @keyframes mjTemblor { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  .temblor { animation: mjTemblor .4s; }

  @media (max-width: 900px) {
    .mj-volver { width: 40px; padding: 0; justify-content: center; }
    .mj-volver span { display: none; }
  }
  @media (max-width: 480px) {
    .mj-top { padding: 8px 12px; gap: 6px; }
    .mj-titulo { visibility: hidden; }
    .mj-dato { min-width: 44px; padding: 3px 7px; }
    .mj-icon { width: 36px; height: 36px; }
    .mj-volver { width: 36px; height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
  }

  .mj-zona { touch-action: none; overflow: hidden; background: var(--shell); user-select: none; -webkit-user-select: none; }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pregunta {
    position: absolute; left: 50%; top: 12px; z-index: 5; transform: translateX(-50%);
    width: min(720px, calc(100% - 24px)); display: none; gap: 8px;
    background: var(--papel); color: var(--tinta); border-radius: var(--r); padding: 10px 12px 12px;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.8);
  }
  .pregunta.ver { display: grid; animation: bajar .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes bajar { from { transform: translate(-50%, -20px); opacity: 0; } }
  .pregunta p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1rem, 3.6vw, 1.35rem); text-align: center; text-wrap: balance; }
  .pregunta .carriles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pregunta .carriles button {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px;
    border: 1.5px solid var(--tinta); border-radius: 8px; background: color-mix(in srgb, var(--papel) 55%, white);
    font-family: var(--f-mono); font-weight: 500; font-size: clamp(.78rem, 3vw, .98rem); text-align: left; line-height: 1.15;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .pregunta .carriles button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tinta); color: var(--papel); font-weight: 700; }
  .pregunta .carriles button:not(:disabled):hover { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, var(--papel)); transform: translateY(-1px); }
  .pregunta .carriles button:disabled { cursor: default; }
  .pregunta .carriles button.elegida { border-color: var(--tinta); border-width: 3px; }
  .pregunta .carriles button.bien { background: var(--acierto); border-color: var(--acierto); color: var(--papel); }
  .pregunta .carriles button.mal { background: var(--fallo); border-color: var(--fallo); color: var(--papel); }
  .pregunta .carriles button.bien .n, .pregunta .carriles button.mal .n { background: var(--papel); color: var(--tinta); }
  .pregunta .nota { margin: 0; text-align: center; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; color: var(--tinta-suave); }
  .pregunta .carriles button > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) {
    .pregunta { padding: 8px 8px 10px; gap: 6px; }
    .pregunta .carriles { gap: 5px; }
    .pregunta .carriles button { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 6px 4px; font-size: .78rem; }
    .pregunta .carriles button .n { width: 22px; height: 22px; font-size: .75rem; }
  }
  /* Controles táctiles: ◀ ▶ a la izquierda y «Salta» a la derecha */
  .controles { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: none; justify-content: space-between; align-items: end; gap: 12px; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); pointer-events: none; }
  .controles.ver { display: flex; }
  .controles .grupo { display: flex; gap: 10px; }
  .controles button {
    pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; touch-action: none;
    background: color-mix(in srgb, var(--papel) 22%, transparent); border: 1.5px solid color-mix(in srgb, var(--papel) 55%, transparent);
    color: var(--claro); font-size: 1.5rem; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .controles button.salta { width: 84px; height: 84px; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }
  .controles button.pulsat { background: color-mix(in srgb, var(--oro) 45%, transparent); }
</style>
</head>
<body>
<main class="mj-zona" id="zona">
  <canvas id="lienzo" aria-label="Joc"></canvas>
  <div class="pregunta" id="pregunta" aria-live="polite"><p id="pregTexto"></p><div class="carriles" id="pregOpciones" role="group"></div><p class="nota" id="pregNota"></p></div>
  <div class="controles" id="controles">
    <div class="grupo"><button id="btnIzq" aria-label="Esquerra">◀</button><button id="btnDer" aria-label="Dreta">▶</button></div>
    <button class="salta" id="btnSalta"></button>
  </div>
</main>

<script>

const MJ = (function () {
  'use strict';

  const azar = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (n) => Number(n).toLocaleString(D.meta.idioma || 'es');
  const reducido = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esTactil = () => window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const moneda = T.moneda || T.puntos;

  const ICON = {
    volver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

  };

  // ---------- Tema ----------
  const svgUrl = (svg) => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  function patron(tipo, color) {
    if (tipo === 'puntos') return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="1.4" fill="${color}"/></svg>`);
    if (tipo === 'rejilla') return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><path d="M36 0H0v36" fill="none" stroke="${color}" stroke-width=".8"/></svg>`);

    // circuito: pistas de placa base con giros a 45º y vías (tesela de 120 px que encaja por los bordes)
    if (tipo === 'circuito') return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><g fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round"><path d="M0 20h30l14 14h30l12-12h34"/><path d="M0 70h18l12 12v38"/><path d="M60 0v18l10 10v30l-12 12h-12"/><path d="M120 60h-26l-10 10v22l14 14v14"/><path d="M40 120v-18l10-10h22"/></g><g fill="${color}"><circle cx="44" cy="34" r="3"/><circle cx="46" cy="70" r="3"/><circle cx="72" cy="92" r="3"/><circle cx="84" cy="70" r="3"/><circle cx="30" cy="82" r="2.2"/></g></svg>`);

    return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60"><path d="${d}" fill="none" stroke="${color}" stroke-width=".7"/></svg>`);

  function aplicarTema() {

    const notas = [otra && otra.length ? esc(T.tambienTactil) : '', rec ? `<span class="num">${esc(T.record)}: ${fmt(rec.record)} ${esc(T.puntos)}</span>` : ''].filter(Boolean);
    const c = capa(`<div class="mj-carta mj-intro">
      ${sello(selloTexto(), monograma(), 'var(--acento)', 'mj-sello')}
      <span class="eyebrow">${esc(D.meta.titulo)}</span>
      <h2>${esc(JUEGO.titulo)}</h2>
      <p>${esc(JUEGO.subtitulo || '')}</p>
      <ul class="mj-controles">${lista.map(([k, t]) => `<li><i>${esc(k)}</i><span>${esc(t)}</span></li>`).join('')}</ul>
      ${notas.length ? `<p class="mj-nota">${notas.join(' · ')}</p>` : ''}
      <div class="mj-acciones"><button class="btn" id="mjJugar">${esc(T.jugar)} →</button></div>
      ${creditoMusica()}
    </div>`);
    const b = $('#mjJugar', c); b.focus({ preventScroll: true });
    b.addEventListener('click', () => { contexto(); fondoIniciar(); cuentaAtras(); });
  }
  function cuentaAtras() {
    estado = 'cuenta';
    opciones.preparar && opciones.preparar();
    let n = 3;
    const paso = () => {
      if (n === 0) { cerrarCapa(); estado = 'jugando'; opciones.empezar && opciones.empezar(); return; }
      capa(`<div class="mj-cuenta" aria-live="assertive">${n}</div>`);
      sfx.cuenta(n === 1); n--;
      setTimeout(paso, reducido() ? 250 : 750);
    };
    paso();
  }
  function pausar() {
    if (estado !== 'jugando') return;
    estado = 'pausa';
    opciones.pausar && opciones.pausar();
    fondoPausar();
    const c = capa(`<div class="mj-carta"><span class="eyebrow">${esc(JUEGO.titulo)}</span><h2>${esc(T.pausa)}</h2>
      <div class="mj-audio"><span class="eyebrow">${esc(T.audio || 'So')}</span><div class="mj-interruptores" id="mjInterruptores" role="group" aria-label="${esc(T.audio || 'So')}">${htmlInterruptores()}</div></div>
      <div class="mj-acciones"><button class="btn" id="mjSeguir">${esc(T.continuar)}</button><button class="btn fantasma" id="mjReiniciar">${esc(T.reiniciar)}</button></div></div>`);
    enlazarInterruptores($('#mjInterruptores', c));
    $('#mjSeguir', c).addEventListener('click', reanudar);
    $('#mjReiniciar', c).addEventListener('click', () => { cerrarCapa(); fondoIniciar(); cuentaAtras(); });
    $('#mjSeguir', c).focus({ preventScroll: true });
  }
  function reanudar() {
    if (estado !== 'pausa') return;
    cerrarCapa(); estado = 'jugando';
    fondoReanudar();
    opciones.reanudar && opciones.reanudar();
  }

  let flashT = 0;
  function flash(texto, ok) {
    const f = $('#mjFlash');
    f.textContent = texto; f.className = 'mj-flash ' + (ok ? 'ok' : 'ko');
    void f.offsetWidth; f.classList.add('ver');
    clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('ver'), 950);
  }

  // ---------- Récord y premio ----------
  const CLAVE_MJ = CLAVE + ':minijuegos';
  function leerTodo() { try { return JSON.parse(localStorage.getItem(CLAVE_MJ) || '{}'); } catch (e) { return {}; } }
  function record() { return leerTodo()[JUEGO.id] || null; }
  function premio(puntos) {
    const p = JUEGO.premio || {};
    const objetivo = p.objetivo || 1000, tope = p.tope || 300;
    const frac = Math.max(0, Math.min(1, puntos / objetivo));
    return { lliures: Math.round(tope * frac), estrellas: puntos <= 0 ? 0 : frac >= .9 ? 3 : frac >= .6 ? 2 : frac >= .3 ? 1 : 0 };
  }
  function fin(r) {
    if (estado === 'fin') return;
    estado = 'fin';
    opciones.pausar && opciones.pausar();
    const puntos = Math.max(0, Math.round(r.puntos || 0));
    const { lliures, estrellas } = premio(puntos);
    const todo = leerTodo();
    const prev = todo[JUEGO.id] || { record: 0, mejorLliures: 0, partidas: 0 };
    const nuevoRecord = puntos > prev.record;
    todo[JUEGO.id] = { record: Math.max(prev.record, puntos), mejorLliures: Math.max(prev.mejorLliures, lliures), partidas: prev.partidas + 1 };
    try { localStorage.setItem(CLAVE_MJ, JSON.stringify(todo)); } catch (e) {}
    const resultado = { tipo: 'minijuego', id: JUEGO.id, puntos, lliures, estrellas, victoria: !!r.victoria };
    window.__mjResultado = resultado;
    try { if (window.parent && window.parent !== window) window.parent.postMessage(resultado, '*'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('minijuego-fin', { detail: resultado }));
    fondoParar();
    if (opciones.sonidoFin) opciones.sonidoFin(!!r.victoria); else (r.victoria ? sfx.victoria : sfx.derrota)();
    const embebido = window.parent && window.parent !== window;
    const c = capa(`<div class="mj-carta">
      <span class="eyebrow">${esc(JUEGO.titulo)}</span>
      <h2>${esc(r.titulo || (r.victoria ? T.victoria : T.finPartida))}</h2>
      ${r.mensaje ? `<p>${esc(r.mensaje)}</p>` : ''}
      <div class="mj-estrellas">${[0, 1, 2].map((i) => ICON.estrella.replace('<svg', `<svg class="${i < estrellas ? '' : 'off'}"`)).join('')}</div>
      <div class="mj-resumen">${(r.resumen || []).concat([[T.puntos, fmt(puntos)], [T.record, fmt(Math.max(prev.record, puntos))]]).map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
      <div class="mj-billete"><span class="eyebrow">${esc(T.guanyes)}</span><span><b>+${fmt(lliures)}</b> <em>${esc(moneda)}</em></span></div>
      ${nuevoRecord && prev.partidas ? `<p style="color:var(--acento);font-family:var(--f-display);font-size:1.15rem">${esc(T.nuevoRecord)}</p>` : ''}
      <div class="mj-acciones"><button class="btn" id="mjRepetir">↻ ${esc(T.repetir)}</button>${embebido ? `<button class="btn fantasma" id="mjVolver">${esc(T.volver)}</button>` : ''}${D.portada ? `<a class="btn fantasma" id="mjPortada" href="${esc(D.portada)}" target="_top">${esc(T.volverExamenes || T.volver)}</a>` : ''}</div>
      ${creditoMusica()}
    </div>`);
    $('#mjRepetir', c).addEventListener('click', () => { cerrarCapa(); fondoIniciar(); cuentaAtras(); });
    if ($('#mjVolver', c)) $('#mjVolver', c).addEventListener('click', () => window.parent.postMessage({ tipo: 'minijuego-cerrar', id: JUEGO.id }, '*'));
    $('#mjRepetir', c).focus({ preventScroll: true });
    return resultado;
  }

  // ---------- Gestos ----------
  // Deslizar o tocar dentro de un elemento. onDir('izq'|'der'|'arriba'|'abajo'), onToque(x, y, rect)
  function gestos(el, { onDir, onToque, umbral = 28 }) {
    let x0 = 0, y0 = 0, t0 = 0, activo = false, disparado = false;
    el.addEventListener('pointerdown', (e) => {
      // Sobre un botón no hay gesto: capturar el puntero desviaría su clic hacia la zona y el botón no respondería
      if (e.target.closest('button, a, input, select, textarea')) return;
      activo = true; disparado = false; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); try { el.setPointerCapture(e.pointerId); } catch (_) {} });
    el.addEventListener('pointermove', (e) => {
      if (!activo || disparado) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= umbral) { disparado = true; onDir && onDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'der' : 'izq') : (dy > 0 ? 'abajo' : 'arriba')); }
    });
    const soltar = (e) => {
      if (!activo) return; activo = false;
      if (!disparado && performance.now() - t0 < 500 && onToque) { const r = el.getBoundingClientRect(); onToque(e.clientX - r.left, e.clientY - r.top, r); }
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', () => { activo = false; });
  }

  function iniciar(o) {
    opciones = o || {};
    aplicarTema();
    montar();
    intro();
    window.__minijuego = Object.assign(window.__minijuego || {}, { estado: () => estado, pausar, reanudar });
  }

  return { iniciar, hud, hudSet, flash, fin, sfx, sonido, sello, gestos, azar, esc, fmt, color, reducido, esTactil, estado: () => estado, pausar, reanudar, T, JUEGO, D, moneda };
})();

<script>
(function () {
  'use strict';
  const J = MJ.JUEGO, T = MJ.T;
  const cv = document.getElementById('lienzo'), g = cv.getContext('2d');
  const zona = document.getElementById('zona');
  const $preg = document.getElementById('pregunta'), $pt = document.getElementById('pregTexto'), $po = document.getElementById('pregOpciones'), $pn = document.getElementById('pregNota');
  const $ctl = document.getElementById('controles');
  const ESCENA = J.escena || 'paris-1789';
  const VIDAS = J.vidas || 3;

  // ---------- Mundo (unidades virtuales; el suelo está en y = SUELO, la y crece hacia abajo) ----------
  const ALTO = 480, SUELO = 400;
  const PW = 26, PH = 42;                         // jugador
  const CORRE = 270, ACEL = 2400, GRAV = 2300, SALTO = 830, CAIDA_MAX = 950;
  const COYOTE = .1, BUFFER = .13;
  const BW = 160, BH = 56, BSEP = 190, B_BASE = SUELO - 112;   // bloques de respuesta
  const ZONA_LARGO = 840;

  // ---------- Estado ----------
  let s = null;
  const teclas = { izq: false, der: false, salto: false };
  function generar(preguntas) {
    const suelos = [], plats = [], monedas = [], enemigos = [], zonas = [];
    let x = 0;
    suelos.push({ x: -400, w: 1000 });
    x = 600;
    preguntas.forEach((q, i) => {
      const fin = x + 1350 + i * 90;
      while (x < fin - 200) {
        const largo = 240 + Math.random() * 280;
        const seg = { x, w: Math.min(largo, fin - x) };
        suelos.push(seg);
        // plataforma flotante con monedas encima
        if (seg.w > 300 && Math.random() < .6) {
          const pw = 110 + Math.random() * 60, px = seg.x + 60 + Math.random() * (seg.w - pw - 120), py = SUELO - 95 - Math.random() * 40;
          plats.push({ x: px, y: py, w: pw });
          for (let k = 0; k < 3; k++) monedas.push({ x: px + pw / 2 + (k - 1) * 30, y: py - 34 });
        } else if (Math.random() < .5) {
          for (let k = 0; k < 4; k++) monedas.push({ x: seg.x + 60 + k * 34, y: SUELO - 30 });
        }
        // enemigos que patrullan el tramo de suelo
        if (seg.w > 300 && Math.random() < .45 + i * .06) {
          const a = seg.x + 50, b = seg.x + seg.w - 50;
          enemigos.push({ x: a + Math.random() * (b - a), a, b, v: (55 + Math.random() * 30 + i * 5) * (Math.random() < .5 ? -1 : 1), vivo: true, t: Math.random() * 6 });
        }
        x = seg.x + seg.w;
        if (x < fin - 200) {
          const hueco = 65 + Math.random() * 45 + Math.min(20, i * 4);   // màx. 130 u; el salt arriba a unes 195
          // arco de monedas sobre el hueco
          for (let k = 0; k < 3; k++) monedas.push({ x: x + hueco / 2 + (k - 1) * 28, y: SUELO - 70 - (k === 1 ? 22 : 0) });
          x += hueco;
        }
      }
      // Zona de pregunta: suelo llano, tres bloques y una barrera que no se abre hasta responder
      const z0 = x;
      suelos.push({ x: z0, w: ZONA_LARGO + 40 });
      const bloques = [0, 1, 2].map((c) => ({ c, x: z0 + 210 + c * BSEP - BW / 2, y: B_BASE - BH, w: BW, h: BH, golpe: 0, roto: false }));
      zonas.push({ i, x0: z0, disparo: z0 + 70, bloques, barrera: { x: z0 + ZONA_LARGO - 60, w: 44, h: 300, abierta: 0 }, activa: false, resuelta: false });
      x = z0 + ZONA_LARGO + 40;
    });
    // Meta
    suelos.push({ x, w: 1100 });
    const meta = { x: x + 560 };
    return { suelos, plats, monedas, enemigos, zonas, meta, fin: x + 1100 };
  }
  function nuevo() {
    const preguntas = MJ.azar(J.preguntas).slice(0, J.numPreguntas || 6).map((p) => ({ pregunta: p.pregunta, ops: MJ.azar(p.opciones.map((texto, i) => ({ texto, ok: i === p.correcta }))) }));
    s = {
      t: 0, preguntas, mundo: generar(preguntas),
      p: { x: 120, y: SUELO, vx: 0, vy: 0, suelo: true, dir: 1, coyote: 0, buffer: 0, anim: 0 },
      seguro: 120, vidas: VIDAS, puntos: 0, monedas: 0, aciertos: 0, fallos: 0, rapidesa: 0,
      fase: 'corre', zona: null, tEspera: 0, auto: null, resaltado: 0, invul: 0, sacudida: 0, fin: false, tLlegada: 0, parts: [], camX: 0,
    };
    teclas.izq = teclas.der = teclas.salto = false;
    $preg.classList.remove('ver');
    MJ.hud([{ id: 'vidas', etiqueta: T.vidas, valor: '♥'.repeat(VIDAS) }, { id: 'puntos', etiqueta: T.puntos, valor: 0 }, { id: 'preg', etiqueta: J.hudPregunta || 'Pregunta', valor: `0/${preguntas.length}` }]);
  }

  // ---------- Física y colisiones ----------
  const solapa = (a, b) => a.x1 > b.x0 && a.x0 < b.x1 && a.y1 > b.y0 && a.y0 < b.y1;
  function solidos() {
    const m = s.mundo, out = [];
    for (const z of m.zonas) {
      for (const b of z.bloques) out.push({ x0: b.x, x1: b.x + b.w, y0: b.y, y1: b.y + b.h, bloque: b, zona: z });
      const ba = z.barrera, h = ba.h * (1 - ba.abierta);
      if (h > 4) out.push({ x0: ba.x, x1: ba.x + ba.w, y0: SUELO - h, y1: SUELO });
    }
    return out;
  }
  function sobreSuelo(x) { return s.mundo.suelos.find((sg) => x + PW / 2 - 4 > sg.x && x - PW / 2 + 4 < sg.x + sg.w); }
  function paso(dt) {
    const p = s.p;
    // Entrada: teclado/táctil o piloto automático hacia un bloque (teclas 1-3, tocar el bloque o el botón del panel)
    let dir = (teclas.der ? 1 : 0) - (teclas.izq ? 1 : 0), quiereSaltar = false;
    if (s.auto != null && s.zona && !s.zona.resuelta) {
      const b = s.zona.bloques[s.auto], cx = b.x + b.w / 2, dx = cx - p.x;
      dir = Math.abs(dx) > 6 ? Math.sign(dx) : 0;
      if (Math.abs(dx) <= 10 && p.suelo) quiereSaltar = true;
    }
    if (s.fase === 'llegada') { const dx = s.mundo.meta.x - p.x; dir = Math.abs(dx) > 8 ? Math.sign(dx) : 0; }
    const objetivo = dir * CORRE;
    p.vx += Math.sign(objetivo - p.vx) * Math.min(Math.abs(objetivo - p.vx), ACEL * dt * (p.suelo ? 1 : .6));
    if (dir) p.dir = dir;
    // Salto con coyote time, búfer y altura variable
    if (quiereSaltar) p.buffer = BUFFER;
    p.buffer -= dt; p.coyote = p.suelo ? COYOTE : p.coyote - dt;
    if (p.buffer > 0 && p.coyote > 0) { p.vy = -SALTO; p.suelo = false; p.coyote = 0; p.buffer = 0; MJ.sfx.paso(); }
    if (!teclas.salto && s.auto == null && p.vy < -320) p.vy *= .55;   // soltar pronto = salto corto
    p.vy = Math.min(CAIDA_MAX, p.vy + GRAV * dt);
    const sol = solidos();
    // Eje X
    p.x += p.vx * dt;
    let r = { x0: p.x - PW / 2, x1: p.x + PW / 2, y0: p.y - PH, y1: p.y - 1 };
    for (const o of sol) if (solapa(r, o)) { if (p.vx > 0) p.x = o.x0 - PW / 2; else if (p.vx < 0) p.x = o.x1 + PW / 2; p.vx = 0; r = { x0: p.x - PW / 2, x1: p.x + PW / 2, y0: p.y - PH, y1: p.y - 1 }; }
    p.x = Math.max(-380, p.x);
    // Eje Y
    const yAntes = p.y;
    p.y += p.vy * dt; p.suelo = false;
    r = { x0: p.x - PW / 2 + 2, x1: p.x + PW / 2 - 2, y0: p.y - PH, y1: p.y };
    let golpeado = null, mejor = 0;
    for (const o of sol) {
      if (!solapa(r, o)) continue;
      if (p.vy > 0 && yAntes <= o.y0 + 1) { p.y = o.y0; p.vy = 0; p.suelo = true; }
      else if (p.vy < 0) {
        const sol2 = Math.min(r.x1, o.x1) - Math.max(r.x0, o.x0);
        if (o.bloque && sol2 > mejor) { mejor = sol2; golpeado = o; }
        p.y = o.y1 + PH; p.vy = 40;
      }
      r = { x0: p.x - PW / 2 + 2, x1: p.x + PW / 2 - 2, y0: p.y - PH, y1: p.y };
    }
    if (golpeado) golpearBloque(golpeado.zona, golpeado.bloque);
    // Suelo y plataformas (solo se pisan desde arriba)
    if (p.vy >= 0) {
      const sg = sobreSuelo(p.x);
      if (sg && yAntes <= SUELO + 1 && p.y >= SUELO) { p.y = SUELO; p.vy = 0; p.suelo = true; s.seguro = Math.max(sg.x + 30, Math.min(sg.x + sg.w - 30, p.x)); }
      for (const pl of s.mundo.plats) if (p.x + PW / 2 - 4 > pl.x && p.x - PW / 2 + 4 < pl.x + pl.w && yAntes <= pl.y + 1 && p.y >= pl.y) { p.y = pl.y; p.vy = 0; p.suelo = true; }
    }
    p.anim += Math.abs(p.vx) * dt * .045;
    // Caer a un hueco
    if (p.y > ALTO + 120) caer();
  }
  function caer() {
    const p = s.p;
    MJ.sfx.fallo(); MJ.flash(T.ai, false);
    p.x = s.seguro; p.y = SUELO; p.vx = 0; p.vy = 0; p.suelo = true;
    perderVida();
  }
  function perderVida() {
    if (s.vidas <= 0 || s.fase === 'muerto') return;
    s.vidas--; s.invul = 1.5; s.sacudida = .3;
    MJ.hudSet('vidas', '♥'.repeat(Math.max(0, s.vidas)) + '♡'.repeat(VIDAS - Math.max(0, s.vidas)));
    // Sense vides: el joc s'atura i el final es compta amb el temps del joc (un temporitzador podria acabar la partida següent)
    if (s.vidas <= 0) { s.fase = 'muerto'; s.tMuerte = 0; s.auto = null; MJ.sonido.redoble(false); MJ.sonido.atenuar(false); }
  }
  function enemigos(dt) {
    const p = s.p;
    for (const e of s.mundo.enemigos) {
      if (!e.vivo) { e.t += dt; continue; }
      e.t += dt; e.x += e.v * dt;
      if (e.x < e.a) { e.x = e.a; e.v = Math.abs(e.v); } else if (e.x > e.b) { e.x = e.b; e.v = -Math.abs(e.v); }
      if (Math.abs(e.x - p.x) > 400) continue;
      const er = { x0: e.x - 17, x1: e.x + 17, y0: SUELO - 34, y1: SUELO }, pr = { x0: p.x - PW / 2 + 3, x1: p.x + PW / 2 - 3, y0: p.y - PH, y1: p.y };
      if (!solapa(er, pr)) continue;
      if (p.vy > 60 && p.y - er.y0 < 22) {                     // lo pisa: queda fuera de combate y el jugador rebota
        e.vivo = false; e.t = 0; p.vy = -520; s.puntos += 50; MJ.sfx.golpe(); chispas(e.x, SUELO - 20, C.oro, 10);
      } else if (s.invul <= 0) {
        MJ.sfx.madera(); MJ.flash(T.ai, false); p.vx = (p.x < e.x ? -1 : 1) * 320; p.vy = -380; perderVida();
      }
    }
  }
  function monedas() {
    const p = s.p;
    for (const m of s.mundo.monedas) {
      if (m.hecha || Math.abs(m.x - p.x) > 30) continue;
      if (Math.abs(m.y - (p.y - PH / 2)) < 30) { m.hecha = true; s.monedas++; s.puntos += 10; MJ.sfx.moneda(); chispas(m.x, m.y, C.oro, 6); }
    }
  }
  // ---------- Zonas de pregunta ----------
  function zonas(dt) {
    const p = s.p;
    if (!s.zona) {
      const z = s.mundo.zonas.find((zz) => !zz.resuelta && p.x >= zz.disparo);
      if (z) entrarZona(z);
    }
    if (s.fase === 'pregunta' && s.auto == null) s.tEspera += dt;   // el camí automàtic fins al bloc no resta rapidesa
    for (const z of s.mundo.zonas) {
      if (z.resuelta && z.barrera.abierta < 1) z.barrera.abierta = Math.min(1, z.barrera.abierta + dt * 1.6);
      for (const b of z.bloques) if (b.golpe > 0) b.golpe = Math.max(0, b.golpe - dt * 4);
    }
    if (s.resaltado > 0) { s.resaltado -= dt; if (s.resaltado <= 0) $preg.classList.remove('ver'); }
  }
  function entrarZona(z) {
    s.zona = z; z.activa = true; s.fase = 'pregunta'; s.tEspera = 0; s.auto = null;
    mostrarPregunta(z.i);
    MJ.sfx.tic(); MJ.sonido.atenuar(true); MJ.sonido.redoble(true);
  }
  function elegir(c) {
    if (MJ.estado() !== 'jugando' || s.fase !== 'pregunta' || !s.zona || s.zona.resuelta || c < 0 || c > 2) return false;
    s.auto = c;
    pintarOpciones(s.zona.i, c, false);
    return true;
  }
  function golpearBloque(z, b) {
    b.golpe = 1;
    if (z.resuelta || s.fase !== 'pregunta' || s.zona !== z) { MJ.sfx.golpe(); return; }
    z.resuelta = true; s.auto = null;
    const q = s.preguntas[z.i], ok = q.ops[b.c].ok;

    if (ESCENA === 'placa-base') {
      g.fillStyle = '#1f5a36'; g.fillRect(-170, -20, 340, 20);
      g.fillStyle = '#b9c0c7'; g.fillRect(-120, -150, 240, 130);
      g.fillStyle = '#8e969e'; for (let k = -110; k < 110; k += 12) g.fillRect(k, -200, 7, 50);
      g.fillStyle = '#d4a94a'; for (let k = -160; k < 160; k += 14) g.fillRect(k, -4, 7, 4);
      g.fillStyle = kL ? `rgba(95,243,255,${.5 + .5 * kL})` : '#062c33'; g.fillRect(-70, -110, 140, 50);
      g.fillStyle = kL ? '#062c33' : '#9ff8ff'; g.font = `700 34px ${F_MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('CPU', 0, -84);
    } else if (ESCENA === 'industrial') {
      g.fillStyle = '#9a8a72'; g.fillRect(-190, -170, 380, 170);
      g.fillStyle = '#c8b898'; g.fillRect(-196, -176, 392, 10);
      g.fillStyle = '#9a8a72'; g.fillRect(-60, -230, 120, 60);
      g.fillStyle = '#efe6cf'; g.beginPath(); g.arc(0, -205, 20, 0, 7); g.fill(); g.strokeStyle = '#2a2420'; g.lineWidth = 3; g.stroke(); g.beginPath(); g.moveTo(0, -205); g.lineTo(0, -219); g.moveTo(0, -205); g.lineTo(10, -201); g.stroke();
      g.fillStyle = '#120c08'; for (const ax of [-110, 0, 110]) { g.beginPath(); g.moveTo(ax - 30, 0); g.lineTo(ax - 30, -70); g.arc(ax, -70, 30, Math.PI, 0); g.lineTo(ax + 30, 0); g.fill(); }
      g.fillStyle = '#2a1a12'; g.fillRect(-110, -150, 220, 30); texto(String(J.objetivo || 'Liverpool').toUpperCase(), 0, -134, 200, 20, '#efe1c0');
    } else {
      g.scale(.74, .74);
      g.fillStyle = '#7a746a';
      g.fillRect(-170, -160, 340, 160);
      for (const tx of [-150, -50, 50, 150]) { g.fillRect(tx - 32, -220 - (tx === -50 || tx === 50 ? 20 : 0), 64, 220 + (tx === -50 || tx === 50 ? 20 : 0)); for (let a = -28; a < 30; a += 14) g.fillRect(tx + a - 5, -232 - (tx === -50 || tx === 50 ? 20 : 0), 10, 14); }
      g.fillStyle = '#120c08'; g.beginPath(); g.moveTo(-30, 0); g.lineTo(-30, -60); g.arc(0, -60, 30, Math.PI, 0); g.lineTo(30, 0); g.fill();
      g.fillStyle = '#ffb060'; for (const tx of [-150, 150]) for (let v = 0; v < 3; v++) g.fillRect(tx - 5, -190 + v * 50, 10, 18);
      // bandera tricolor que se iza al llegar
      g.fillStyle = '#222'; g.fillRect(-2, -330, 4, 90);
      const by = -300 + (1 - kL) * 50;
      [['#2a4a9a', 0], ['#ffffff', 1], [C.acento, 2]].forEach(([col, i]) => { g.fillStyle = col; g.fillRect(2 + i * 16, by, 16, 30); });
    }
    if (kL > 0 && J.textoLlegada) {
      g.setTransform(dpr * esc, 0, 0, dpr * esc, dpr * (-s.camX * esc), dpr * offY); g.translate(mx, SUELO);   // el rètol no s'escala amb l'edifici
      g.fillStyle = C.papel; g.globalAlpha = kL; g.fillRect(-150, -232 - kL * 16, 300, 42); g.globalAlpha = 1;
      if (kL > .2) texto(J.textoLlegada, 0, -211 - kL * 16, 280, 20, C.tinta);
    }
    g.restore();
  }
  function dibujarJugador() {
    const p = s.p;
    if (s.invul > 0 && Math.floor(s.invul * 12) % 2) return;
    g.save(); g.translate(p.x, p.y); g.scale(p.dir, 1);
    const enAire = !p.suelo, mov = Math.abs(p.vx) > 20 && !enAire, a = mov ? Math.sin(p.anim * 6) : 0;
    let cos, cames, cap, mans;
    if (ESCENA === 'placa-base') { cos = '#a8b2bc'; cames = '#2c3138'; cap = '#a8b2bc'; mans = '#a8b2bc'; }
    else if (ESCENA === 'industrial') { cos = '#5a3e2a'; cames = '#3a3530'; cap = '#e0b890'; mans = '#e0b890'; }
    else { cos = '#2a3c7a'; cames = '#e8dcc0'; cap = '#e0b890'; mans = '#e0b890'; }
    // cames
    g.fillStyle = cames;
    g.save(); g.translate(-5, -16); g.rotate(enAire ? -.5 : a * .7); g.fillRect(-3, 0, 7, 16); g.restore();
    g.save(); g.translate(5, -16); g.rotate(enAire ? .3 : -a * .7); g.fillRect(-3, 0, 7, 16); g.restore();
    g.fillStyle = '#1f1a16'; g.fillRect(-8 + (enAire ? -2 : a * 4), -3, 9, 4); g.fillRect(1 + (enAire ? 2 : -a * 4), -3, 9, 4);
    // cos
    g.fillStyle = cos; g.fillRect(-9, -34, 18, 20);
    if (ESCENA === 'placa-base') { g.fillStyle = '#5ff3ff'; g.fillRect(-5, -28, 10, 4); }
    else if (ESCENA === 'paris-1789') { g.fillStyle = C.acento; g.fillRect(-9, -18, 18, 3); }
    // braços
    g.fillStyle = cos;
    g.save(); g.translate(0, -31); g.rotate(enAire ? -2.4 : -a * .8); g.fillRect(-3, 0, 6, 14); g.fillStyle = mans; g.fillRect(-3, 13, 6, 4); g.restore();
    // cap
    g.fillStyle = cap; g.beginPath(); g.arc(1, -40, 7, 0, 7); g.fill();
    if (ESCENA === 'placa-base') { g.fillStyle = '#5ff3ff'; g.fillRect(1, -42, 7, 3); g.fillStyle = '#2c3138'; g.fillRect(0, -54, 2, 8); g.fillStyle = '#5ff3ff'; g.beginPath(); g.arc(1, -55, 2.5, 0, 7); g.fill(); }
    else if (ESCENA === 'industrial') { g.fillStyle = '#4a4036'; g.fillRect(-6, -48, 14, 4); g.fillRect(4, -46, 7, 2); }
    else { g.fillStyle = C.acento; g.beginPath(); g.moveTo(-6, -44); g.lineTo(8, -44); g.lineTo(6, -53); g.fill(); }
    g.restore();
  }
  function camara(dt) {
    if (!W) return;
    const p = s.p, vw = vistaW();
    // Ante una pregunta la cámara encuadra los tres bloques; si no, sigue al jugador
    const zc = s.zona || s.mundo.zonas.find((z) => !z.resuelta && p.x > z.x0 - 120 && p.x < z.x0 + ZONA_LARGO);
    const centro = zc ? zc.x0 + 210 + BSEP : null;
    const objetivo = Math.max(-200, Math.min(s.mundo.fin - vw, centro != null && vw >= 3 * BSEP ? Math.max(p.x + 50 - vw, Math.min(p.x - 50, centro - vw / 2)) : p.x - vw * .35));
    if (dt == null || Math.abs(objetivo - s.camX) > vw) s.camX = objetivo;
    else s.camX += (objetivo - s.camX) * Math.min(1, dt * 8);
  }
  function dibujar() {
    if (!s || !W) return;
    const vw = vistaW();
    fondo();
    let sx = 0, sy = 0;
    if (s.sacudida > 0 && !MJ.reducido()) { sx = (Math.random() - .5) * 8; sy = (Math.random() - .5) * 5; }
    g.setTransform(dpr * esc, 0, 0, dpr * esc, dpr * (-s.camX * esc + sx), dpr * (offY + sy));
    dibujarSuelo();
    dibujarMeta();
    for (const z of s.mundo.zonas) if (z.x0 < s.camX + vw + 100 && z.x0 + ZONA_LARGO > s.camX - 100) dibujarZona(z);
    for (const m of s.mundo.monedas) if (!m.hecha && m.x > s.camX - 30 && m.x < s.camX + vw + 30) dibujarMoneda(m);
    for (const e of s.mundo.enemigos) if (e.x > s.camX - 60 && e.x < s.camX + vw + 60) dibujarEnemigo(e);
    dibujarJugador();
    for (const q of s.parts) { g.globalAlpha = Math.min(1, q.vida * 2); g.fillStyle = q.col; g.fillRect(q.x, q.y, q.tam, q.tam); }
    g.globalAlpha = 1;
  }

  // ---------- Bucle ----------
  let rafId = 0, ultimo = 0;
  function bucle(t) {
    const dt = Math.min(.05, (t - ultimo) / 1000 || 0); ultimo = t;
    if (MJ.estado() === 'jugando') { for (let k = 0; k < 2; k++) actualizar(dt / 2); }
    dibujar();
    if (MJ.estado() === 'jugando' && !s.fin) rafId = requestAnimationFrame(bucle);
  }
  function arrancar() { cancelAnimationFrame(rafId); if (window.__sinBucle) return; ultimo = performance.now(); rafId = requestAnimationFrame(bucle); }
  function detener() { cancelAnimationFrame(rafId); teclas.izq = teclas.der = teclas.salto = false; document.querySelectorAll('.controles button').forEach((b) => b.classList.remove('pulsat')); }

  // ---------- Controles ----------
  const TECLAS = { ArrowLeft: 'izq', a: 'izq', A: 'izq', ArrowRight: 'der', d: 'der', D: 'der', ArrowUp: 'salto', w: 'salto', W: 'salto', ' ': 'salto' };
  document.addEventListener('keydown', (e) => {
    if (MJ.estado() !== 'jugando' || !s) return;
    if (['1', '2', '3'].includes(e.key) && s.fase === 'pregunta') { elegir(Number(e.key) - 1); e.preventDefault(); return; }
    const k = TECLAS[e.key]; if (!k) return;
    if (k === 'salto' && !teclas.salto && !e.repeat) s.p.buffer = BUFFER;
    teclas[k] = true; e.preventDefault();
  });
  document.addEventListener('keyup', (e) => { const k = TECLAS[e.key]; if (k) teclas[k] = false; });
  // Botones táctiles (multitoque: se puede correr y saltar a la vez)
  function boton(id, k) {
    const b = document.getElementById(id);
    const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} if (k === 'salto' && !teclas.salto && s) s.p.buffer = BUFFER; teclas[k] = true; b.classList.add('pulsat'); };
    const off = () => { teclas[k] = false; b.classList.remove('pulsat'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  }
  boton('btnIzq', 'izq'); boton('btnDer', 'der'); boton('btnSalta', 'salto');
  document.getElementById('btnSalta').textContent = J.textoSalta || 'Salta';
  if (MJ.esTactil()) $ctl.classList.add('ver');
  // Tocar un bloque en pantalla = saltar hacia él
  function bloqueEn(px, py) {
    if (!s || !s.zona || s.zona.resuelta) return -1;
    const wx = px / esc + s.camX, wy = (py - offY) / esc;
    const b = s.zona.bloques.find((bb) => wx >= bb.x && wx <= bb.x + bb.w && wy >= bb.y - 10 && wy <= bb.y + bb.h + 10);
    return b ? b.c : -1;
  }
  cv.addEventListener('pointerdown', (e) => {
    if (MJ.estado() !== 'jugando') return;
    const r = zona.getBoundingClientRect(), c = bloqueEn(e.clientX - r.left, e.clientY - r.top);
    if (c >= 0) elegir(c);
  });

  MJ.iniciar({
    preparar: () => { detener(); nuevo(); camara(); dibujar(); },
    empezar: arrancar,
    pausar: detener,
    reanudar: arrancar,
    sonidoFin: (victoria) => (victoria ? MJ.sfx.fanfarria() : MJ.sfx.tamborLento()),
  });
  nuevo();
  new ResizeObserver(medir).observe(zona); medir();

  // Gancho de pruebas
  window.__minijuego = Object.assign(window.__minijuego || {}, {
    juego: 'plataformas',
    info: () => ({ vidas: s.vidas, puntos: Math.round(s.puntos), aciertos: s.aciertos, fallos: s.fallos, monedas: s.monedas, x: Math.round(s.p.x), y: Math.round(s.p.y), suelo: s.p.suelo, fase: s.fase, fin: s.fin, zona: s.zona ? s.zona.i : null, panel: $preg.classList.contains('ver'), rapidesa: s.rapidesa }),
    elegir, bloqueEn, teclas,
    avanzar: (seg, piloto) => { for (let t = 0; t < seg && !s.fin; t += 1 / 120) { if (piloto) piloto(s); actualizar(1 / 120); } dibujar(); },
    estadoInterno: () => s,
    vista: () => ({ esc, offY, W, H }),
  });
})();
