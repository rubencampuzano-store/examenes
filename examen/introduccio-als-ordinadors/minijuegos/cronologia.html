    --claro: #efe3c6;

    --acento: #b3202a;
    --oro: #c9a44c;
    --acierto: #2f7d4a;
    --fallo: #b3202a;
    --linea: color-mix(in srgb, var(--tinta) 18%, transparent);
    --linea-clara: color-mix(in srgb, var(--claro) 16%, transparent);
    --f-display: "Bodoni Moda", Didot, Georgia, serif;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--shell); color: var(--claro);
    font-family: var(--f-texto); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overflow: hidden;
    display: flex; flex-direction: column;
    padding-top: var(--safe-t); padding-bottom: var(--safe-b);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--patron); opacity: .07; z-index: 0; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--grano); opacity: .09; mix-blend-mode: overlay; z-index: 90; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
  h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; }
  .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; }

  .mj-titulo b { font-family: var(--f-display); font-style: italic; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mj-titulo span { color: var(--oro); }
  .mj-hud { display: flex; gap: 8px; align-items: center; }
  .mj-dato { display: grid; justify-items: center; min-width: 52px; padding: 4px 10px; border: 1px solid var(--linea-clara); border-radius: 10px; }

  .mj-zona { position: relative; z-index: 1; flex: 1; min-height: 0; }

  .btn {

    min-height: 52px; padding: 0 26px; border-radius: 999px;

    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 10px 24px -10px color-mix(in srgb, var(--acento) 80%, black);
    transition: transform .12s, filter .2s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.fantasma { background: transparent; color: var(--tinta); border: 1px solid var(--linea); box-shadow: none; }

  .mj-capa {
    position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 16px;
    background: color-mix(in srgb, var(--shell) 72%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .mj-capa.ver { display: grid; animation: mjEntrar .3s ease; }
  @keyframes mjEntrar { from { opacity: 0; } }
  .mj-carta {
    position: relative; width: min(460px, 100%); max-height: calc(100% - 16px); overflow: auto;
    background: var(--papel); color: var(--tinta); border-radius: var(--r);
    padding: 26px 24px 22px; display: grid; gap: 14px; text-align: center;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.85);
    animation: mjSubir .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes mjSubir { from { transform: translateY(24px) scale(.97); opacity: 0; } }
  .mj-carta::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background-image: var(--grano); opacity: .35; mix-blend-mode: multiply; pointer-events: none; }

  .mj-carta h2 { font-size: clamp(1.8rem, 6vw, 2.4rem); font-style: italic; }

  .mj-carta .eyebrow { color: var(--acento); }

  .mj-acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .mj-audio > .eyebrow { color: var(--tinta-suave); }
  .mj-interruptores { display: grid; gap: 6px; }
  .mj-switch {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; width: 100%; min-height: 52px;
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--linea); background: color-mix(in srgb, var(--papel) 70%, white);
    text-align: left; transition: border-color .15s, background .15s;

  .mj-switch:hover { border-color: var(--tinta); }
  .mj-switch-txt { display: grid; min-width: 0; }

  .mj-switch-estado { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
  .mj-switch-pista { position: relative; width: 46px; height: 26px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 22%, transparent); transition: background .2s; }
  .mj-switch-pista i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--papel); box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .2s; }
  .mj-switch[aria-checked="true"] .mj-switch-pista { background: var(--acierto); }
  .mj-switch[aria-checked="true"] .mj-switch-pista i { transform: translateX(20px); }
  .mj-cuenta { font-family: var(--f-display); font-weight: 800; font-size: clamp(6rem, 30vw, 11rem); color: var(--claro); text-shadow: 0 10px 40px rgba(0,0,0,.6); animation: mjLatido .9s ease both; }
  @keyframes mjLatido { 0% { transform: scale(1.8); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: .0; transform: scale(.8); } }
  .mj-sello { width: 110px; justify-self: center; transform: rotate(-10deg); filter: drop-shadow(0 8px 14px rgba(0,0,0,.35)); }

  .mj-estrellas svg { width: 44px; height: 44px; animation: mjBrillo .6s cubic-bezier(.2,1.4,.4,1) backwards; }

  .bandeja { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; min-height: 70px; }
  .tarjeta {
    touch-action: none; min-height: 64px; padding: 12px 14px; border-radius: var(--r); text-align: left;
    background: var(--papel); color: var(--tinta); font-weight: 600; font-size: .95rem; line-height: 1.25;

  .pista { color: var(--claro-suave); font-size: .85rem; text-align: center; margin: 0; }

    .linea { grid-auto-flow: row; grid-auto-columns: auto; padding-top: 0; padding-left: 26px; gap: 8px; }
    .linea::before { left: 10px; right: auto; top: 0; bottom: 0; width: 2px; height: auto; background: linear-gradient(180deg, var(--oro), var(--linea-clara)); }

    .tarjeta { min-height: 56px; font-size: .86rem; padding: 10px 12px; }
  }
</style>

    });
  }
  const sonido = {
    fondoIniciar, fondoPausar, fondoReanudar, fondoParar, tempo, atenuar, redoble, ambienteIntensidad,
    estado: () => ({
      efectosOn: sonidoOn, musicaOn, ambienteOn, hayFondo: hayFondo(), redoble: !!redobleT, atenuada, ambiente: !!amb,
      gMusica: gMusica ? +gMusica.gain.value.toFixed(3) : null, gAmbiente: gAmbiente ? +gAmbiente.gain.value.toFixed(3) : null,
      musica: musEl ? { pausada: musEl.paused, rate: musEl.playbackRate, src: musEl.src.slice(0, 22), ganancia: musGain ? +musGain.gain.value.toFixed(3) : null } : null,
      gFondo: gFondo ? +gFondo.gain.value.toFixed(3) : null, gEfectos: gEfectos ? +gEfectos.gain.value.toFixed(3) : null,
    }),
  };

  // ---------- Sello de lacre ----------
  let sid = 0;
  function sello(texto, centro, col, cls) {
    const id = 'mjs' + (++sid);
    let borde = '';
    for (let i = 0; i < 28; i++) { const a = (i / 28) * Math.PI * 2, rr = i % 2 ? 46 : 49.5; borde += `${(60 + Math.cos(a) * rr).toFixed(1)},${(60 + Math.sin(a) * rr).toFixed(1)} `; }
    const t = esc(String(texto).toUpperCase());
    return `<svg viewBox="0 0 120 120" class="${cls || ''}" aria-hidden="true"><defs><radialGradient id="${id}g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient><path id="${id}p" d="M60 60 m-33 0 a33 33 0 1 1 66 0 a33 33 0 1 1 -66 0"/></defs>
      <polygon points="${borde}" fill="${col || 'var(--acento)'}"/><polygon points="${borde}" fill="url(#${id}g)"/>
      <circle cx="60" cy="60" r="39" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.2"/>
      <text font-family="DM Mono, monospace" font-size="8.2" letter-spacing="1.6" fill="rgba(255,255,255,.85)"><textPath href="#${id}p" startOffset="50%" text-anchor="middle">${t} · ${t}</textPath></text>
      <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="26" font-family="Bodoni Moda, Georgia, serif" font-weight="700" fill="rgba(255,255,255,.92)">${esc(centro)}</text></svg>`;
  }
  const monograma = () => (TEMA.motivo && TEMA.motivo.monograma) || D.meta.titulo.slice(0, 2);
  const selloTexto = () => (TEMA.motivo && TEMA.motivo.sello) || D.meta.titulo;

  // ---------- Estructura ----------
  let opciones = {};
  let estado = 'intro'; // intro | cuenta | jugando | pausa | fin
  const hudVals = {};
  function montar() {
    document.body.insertAdjacentHTML('afterbegin', `
      <header class="mj-top">
        <div class="mj-titulo"><b>${esc(JUEGO.titulo)}</b><span class="eyebrow">${esc(D.meta.titulo)}</span></div>
        <div class="mj-hud" id="mjHud"></div>
        <button class="mj-icon" id="mjPausa" aria-label="${esc(T.pausa)}" title="${esc(T.pausa)}">${ICON.pausa}</button>
        ${hayFondo() ? '<button class="mj-icon" id="mjMusica"></button>' : ''}
        <button class="mj-icon" id="mjSonido"></button>
      </header>`);
    document.body.insertAdjacentHTML('beforeend', `
      <div class="mj-capa" id="mjCapa" role="dialog" aria-modal="true"></div>
      <div class="mj-flash" id="mjFlash" aria-live="polite"></div>`);
    $('#mjSonido').addEventListener('click', alternarEfectos);
    if ($('#mjMusica')) $('#mjMusica').addEventListener('click', alternarMusica);
    $('#mjPausa').addEventListener('click', () => (estado === 'pausa' ? reanudar() : pausar()));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (estado === 'jugando') pausar(); else if (estado === 'pausa') reanudar(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && estado === 'jugando') pausar(); });
    pintarSonido();
  }
  function hud(defs) {
    $('#mjHud').innerHTML = defs.map((d) => `<div class="mj-dato"><small>${esc(d.etiqueta)}</small><b id="mjh-${d.id}">${esc(d.valor != null ? d.valor : '')}</b></div>`).join('');
  }
  function hudSet(id, v) { if (hudVals[id] === v) return; hudVals[id] = v; const el = $('#mjh-' + id); if (el) el.textContent = v; }

  function capa(html) { const c = $('#mjCapa'); c.innerHTML = html; c.classList.add('ver'); return c; }
  function cerrarCapa() { $('#mjCapa').classList.remove('ver'); }

  function creditoMusica() {
    const m = CFG_SONIDO.musica;
    return m && m.src ? `<p style="font-size:.74rem">♪ ${esc(T.musica || 'Música')}: ${esc(m.titulo)} · ${esc(m.interprete || '')}${m.anio ? ' (' + esc(m.anio) + ')' : ''} · ${esc(m.licencia)}</p>` : '';
  }
  function intro() {
    estado = 'intro';
    const tactil = esTactil();
    const ins = JUEGO.instrucciones || {};
    const lista = (tactil ? ins.tactil : ins.teclado) || ins.tactil || [];
    const otra = tactil ? null : ins.tactil;
    const rec = record();
    const c = capa(`<div class="mj-carta">
      ${sello(selloTexto(), monograma(), 'var(--acento)', 'mj-sello')}
      <span class="eyebrow">${esc(D.meta.titulo)}</span>
      <h2>${esc(JUEGO.titulo)}</h2>
      <p>${esc(JUEGO.subtitulo || '')}</p>
      <ul class="mj-controles">${lista.map(([k, t]) => `<li><i>${esc(k)}</i><span>${esc(t)}</span></li>`).join('')}</ul>
      ${otra && otra.length ? `<p style="font-size:.8rem">${esc(T.tambienTactil)}</p>` : ''}
      ${rec ? `<p class="num" style="font-size:.85rem">${esc(T.record)}: ${fmt(rec.record)} ${esc(T.puntos)}</p>` : ''}
      <div class="mj-acciones"><button class="btn" id="mjJugar">${esc(T.jugar)} →</button></div>
      ${creditoMusica()}
    </div>`);
    const b = $('#mjJugar', c); b.focus({ preventScroll: true });
    b.addEventListener('click', () => { contexto(); fondoIniciar(); cuentaAtras(); });
  }
  function cuentaAtras() {
    estado = 'cuenta';
    opciones.preparar && opciones.preparar();
    let n = 3;
    const paso = () => {
      if (n === 0) { cerrarCapa(); estado = 'jugando'; opciones.empezar && opciones.empezar(); return; }
      capa(`<div class="mj-cuenta" aria-live="assertive">${n}</div>`);
      sfx.cuenta(n === 1); n--;
      setTimeout(paso, reducido() ? 250 : 750);
    };
    paso();
  }
  function pausar() {
    if (estado !== 'jugando') return;
    estado = 'pausa';
    opciones.pausar && opciones.pausar();
    fondoPausar();
    const c = capa(`<div class="mj-carta"><span class="eyebrow">${esc(JUEGO.titulo)}</span><h2>${esc(T.pausa)}</h2>
      <div class="mj-audio"><span class="eyebrow">${esc(T.audio || 'So')}</span><div class="mj-interruptores" id="mjInterruptores" role="group" aria-label="${esc(T.audio || 'So')}">${htmlInterruptores()}</div></div>
      <div class="mj-acciones"><button class="btn" id="mjSeguir">${esc(T.continuar)}</button><button class="btn fantasma" id="mjReiniciar">${esc(T.reiniciar)}</button></div></div>`);
    enlazarInterruptores($('#mjInterruptores', c));
    $('#mjSeguir', c).addEventListener('click', reanudar);
    $('#mjReiniciar', c).addEventListener('click', () => { cerrarCapa(); fondoIniciar(); cuentaAtras(); });
    $('#mjSeguir', c).focus({ preventScroll: true });
  }
  function reanudar() {
    if (estado !== 'pausa') return;
    cerrarCapa(); estado = 'jugando';
    fondoReanudar();
    opciones.reanudar && opciones.reanudar();
  }

  let flashT = 0;
  function flash(texto, ok) {
    const f = $('#mjFlash');
    f.textContent = texto; f.className = 'mj-flash ' + (ok ? 'ok' : 'ko');
    void f.offsetWidth; f.classList.add('ver');
    clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('ver'), 950);
  }

  // ---------- Récord y premio ----------
  const CLAVE_MJ = CLAVE + ':minijuegos';
  function leerTodo() { try { return JSON.parse(localStorage.getItem(CLAVE_MJ) || '{}'); } catch (e) { return {}; } }
  function record() { return leerTodo()[JUEGO.id] || null; }
  function premio(puntos) {
    const p = JUEGO.premio || {};
    const objetivo = p.objetivo || 1000, tope = p.tope || 300;
    const frac = Math.max(0, Math.min(1, puntos / objetivo));
    return { lliures: Math.round(tope * frac), estrellas: puntos <= 0 ? 0 : frac >= .9 ? 3 : frac >= .6 ? 2 : frac >= .3 ? 1 : 0 };
  }
  function fin(r) {
    if (estado === 'fin') return;
    estado = 'fin';
    opciones.pausar && opciones.pausar();
    const puntos = Math.max(0, Math.round(r.puntos || 0));
    const { lliures, estrellas } = premio(puntos);
    const todo = leerTodo();
    const prev = todo[JUEGO.id] || { record: 0, mejorLliures: 0, partidas: 0 };
    const nuevoRecord = puntos > prev.record;
    todo[JUEGO.id] = { record: Math.max(prev.record, puntos), mejorLliures: Math.max(prev.mejorLliures, lliures), partidas: prev.partidas + 1 };
    try { localStorage.setItem(CLAVE_MJ, JSON.stringify(todo)); } catch (e) {}
    const resultado = { tipo: 'minijuego', id: JUEGO.id, puntos, lliures, estrellas, victoria: !!r.victoria };
    window.__mjResultado = resultado;
    try { if (window.parent && window.parent !== window) window.parent.postMessage(resultado, '*'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('minijuego-fin', { detail: resultado }));
    fondoParar();
    if (opciones.sonidoFin) opciones.sonidoFin(!!r.victoria); else (r.victoria ? sfx.victoria : sfx.derrota)();
    const embebido = window.parent && window.parent !== window;
    const c = capa(`<div class="mj-carta">
      <span class="eyebrow">${esc(JUEGO.titulo)}</span>
      <h2>${esc(r.titulo || (r.victoria ? T.victoria : T.finPartida))}</h2>
      ${r.mensaje ? `<p>${esc(r.mensaje)}</p>` : ''}
      <div class="mj-estrellas">${[0, 1, 2].map((i) => ICON.estrella.replace('<svg', `<svg class="${i < estrellas ? '' : 'off'}"`)).join('')}</div>
      <div class="mj-resumen">${(r.resumen || []).concat([[T.puntos, fmt(puntos)], [T.record, fmt(Math.max(prev.record, puntos))]]).map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
      <div class="mj-billete"><span class="eyebrow">${esc(T.guanyes)}</span><span><b>+${fmt(lliures)}</b> <em>${esc(moneda)}</em></span></div>
      ${nuevoRecord && prev.partidas ? `<p style="color:var(--acento);font-family:var(--f-display);font-size:1.15rem">${esc(T.nuevoRecord)}</p>` : ''}
      <div class="mj-acciones"><button class="btn" id="mjRepetir">↻ ${esc(T.repetir)}</button>${embebido ? `<button class="btn fantasma" id="mjVolver">${esc(T.volver)}</button>` : ''}</div>
      ${creditoMusica()}
    </div>`);
    $('#mjRepetir', c).addEventListener('click', () => { cerrarCapa(); fondoIniciar(); cuentaAtras(); });
    if ($('#mjVolver', c)) $('#mjVolver', c).addEventListener('click', () => window.parent.postMessage({ tipo: 'minijuego-cerrar', id: JUEGO.id }, '*'));
    $('#mjRepetir', c).focus({ preventScroll: true });
    return resultado;
  }

  // ---------- Gestos ----------
  // Deslizar o tocar dentro de un elemento. onDir('izq'|'der'|'arriba'|'abajo'), onToque(x, y, rect)
  function gestos(el, { onDir, onToque, umbral = 28 }) {
    let x0 = 0, y0 = 0, t0 = 0, activo = false, disparado = false;
    el.addEventListener('pointerdown', (e) => {
      // Sobre un botón no hay gesto: capturar el puntero desviaría su clic hacia la zona y el botón no respondería
      if (e.target.closest('button, a, input, select, textarea')) return;
      activo = true; disparado = false; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); try { el.setPointerCapture(e.pointerId); } catch (_) {} });
    el.addEventListener('pointermove', (e) => {
      if (!activo || disparado) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= umbral) { disparado = true; onDir && onDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'der' : 'izq') : (dy > 0 ? 'abajo' : 'arriba')); }
    });
    const soltar = (e) => {
      if (!activo) return; activo = false;
      if (!disparado && performance.now() - t0 < 500 && onToque) { const r = el.getBoundingClientRect(); onToque(e.clientX - r.left, e.clientY - r.top, r); }
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', () => { activo = false; });
  }

  function iniciar(o) {
    opciones = o || {};
    aplicarTema();
    montar();
    intro();
    window.__minijuego = Object.assign(window.__minijuego || {}, { estado: () => estado, pausar, reanudar });
  }

  return { iniciar, hud, hudSet, flash, fin, sfx, sonido, sello, gestos, azar, esc, fmt, color, reducido, esTactil, estado: () => estado, pausar, reanudar, T, JUEGO, D, moneda };
})();

</script>
<script>
(function () {
  'use strict';
  const J = MJ.JUEGO, T = MJ.T;
  const $linea = document.getElementById('linea'), $bandeja = document.getElementById('bandeja');
  const TIEMPO = J.tiempoRonda || 60;
  let s = null, reloj = 0, ultimo = 0;

  function nuevo() {
    s = { ronda: 0, puntos: 0, racha: 0, aciertos: 0, fallos: 0, restante: TIEMPO, sel: null, colocados: 0, fin: false };
    MJ.hud([{ id: 'ronda', etiqueta: T.ronda, valor: `1/${J.rondas.length}` }, { id: 'tiempo', etiqueta: T.temps, valor: TIEMPO }, { id: 'puntos', etiqueta: T.puntos, valor: 0 }]);
    pintarRonda();
  }
  function pintarRonda() {
    const r = J.rondas[s.ronda];
    s.colocados = 0; s.sel = null; s.restante = TIEMPO;
    document.getElementById('tituloRonda').textContent = r.titulo || `${T.ronda} ${s.ronda + 1}`;
    document.getElementById('subRonda').textContent = `${T.ronda} ${s.ronda + 1}/${J.rondas.length}`;
    document.getElementById('pista').textContent = MJ.esTactil() ? T.pistaCronoTactil : T.pistaCronoTeclado;
    const orden = r.eventos.slice().sort((a, b) => a.orden - b.orden);
    $linea.innerHTML = orden.map((e, i) => `<button class="hueco" role="listitem" data-orden="${e.orden}" data-i="${i}"><span class="fecha">${MJ.esc(e.fecha)}</span><span class="caja">${MJ.esc(T.deixaAqui)}</span></button>`).join('');
    $bandeja.innerHTML = MJ.azar(r.eventos).map((e) => `<button class="tarjeta" data-orden="${e.orden}">${MJ.esc(e.texto)}</button>`).join('');
    MJ.hudSet('ronda', `${s.ronda + 1}/${J.rondas.length}`);
    MJ.hudSet('tiempo', TIEMPO);
    enlazar();
  }

  // ---------- Colocar ----------
  function colocar(tarjeta, hueco) {
    if (!tarjeta || !hueco || hueco.classList.contains('lleno') || MJ.estado() !== 'jugando') return false;
    if (Number(tarjeta.dataset.orden) === Number(hueco.dataset.orden)) {
      s.racha++; s.aciertos++; s.colocados++;
      const g = 100 + (s.racha - 1) * 25;
      s.puntos += g;
      hueco.classList.add('lleno');
      hueco.querySelector('.caja').textContent = tarjeta.textContent;
      hueco.setAttribute('aria-label', hueco.querySelector('.fecha').textContent + ': ' + tarjeta.textContent);
      tarjeta.remove();
      MJ.sfx.acierto();
      if (s.racha >= 3) MJ.flash(`${T.ratxa} ×${s.racha}`, true);
      MJ.hudSet('puntos', MJ.fmt(s.puntos));
      if (s.colocados === J.rondas[s.ronda].eventos.length) finRonda();
      else { const sig = $bandeja.querySelector('.tarjeta'); if (sig && document.activeElement === hueco) sig.focus({ preventScroll: true }); }
      return true;
    }
    s.racha = 0; s.fallos++;
    s.restante = Math.max(0, s.restante - 3);
    hueco.classList.remove('mal'); void hueco.offsetWidth; hueco.classList.add('mal');
    setTimeout(() => hueco.classList.remove('mal'), 450);
    tarjeta.classList.add('temblor'); setTimeout(() => tarjeta.classList.remove('temblor'), 450);
    MJ.sfx.fallo();
    return false;
  }
  function finRonda() {
    const bonus = Math.round(s.restante * 5);
    s.puntos += bonus;
    MJ.hudSet('puntos', MJ.fmt(s.puntos));
    MJ.flash(`+${bonus} ${T.temps.toLowerCase()}`, true);
    if (s.ronda + 1 < J.rondas.length) {
      s.ronda++;
      detenerReloj();
      setTimeout(() => { if (MJ.estado() === 'jugando' && !s.fin) { pintarRonda(); iniciarReloj(); } }, 900);
    } else terminar(true);
  }
  function terminar(victoria) {
    if (s.fin) return;
    s.fin = true; detenerReloj();
    MJ.fin({ puntos: s.puntos, victoria, titulo: victoria ? J.textoVictoria : J.textoDerrota, resumen: [[T.encerts, s.aciertos], [T.errors, s.fallos]] });
  }

  // ---------- Reloj ----------
  function tic() {
    const t = performance.now();
    s.restante -= (t - ultimo) / 1000; ultimo = t;
    MJ.hudSet('tiempo', Math.max(0, Math.ceil(s.restante)));
    if (s.restante <= 0) terminar(false);
  }
  function iniciarReloj() { detenerReloj(); ultimo = performance.now(); reloj = setInterval(tic, 200); }
  function detenerReloj() { clearInterval(reloj); }

  // ---------- Interacción ----------
  function seleccionar(t) {
    if (s.sel) s.sel.classList.remove('sel');
    s.sel = s.sel === t ? null : t;
    if (s.sel) { s.sel.classList.add('sel'); MJ.sfx.tic(); }
  }
  function huecoEn(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.hueco:not(.lleno)') : null; }
  function enlazar() {
    $linea.querySelectorAll('.hueco').forEach((h) => h.addEventListener('click', () => { if (s.sel) { const t = s.sel; seleccionar(s.sel); colocar(t, h); } }));
    $bandeja.querySelectorAll('.tarjeta').forEach((t) => {
      let x0 = 0, y0 = 0, clon = null, dx = 0, dy = 0, activo = false, sobre = null;
      t.addEventListener('pointerdown', (e) => {
        if (MJ.estado() !== 'jugando') return;
        activo = true; x0 = e.clientX; y0 = e.clientY;
        const r = t.getBoundingClientRect(); dx = x0 - r.left; dy = y0 - r.top;
        try { t.setPointerCapture(e.pointerId); } catch (_) {}
      });
      t.addEventListener('pointermove', (e) => {
        if (!activo) return;
        if (!clon && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) {
          const r = t.getBoundingClientRect();
          clon = t.cloneNode(true); clon.classList.add('arrastre'); clon.classList.remove('sel');
          clon.style.width = r.width + 'px'; document.body.appendChild(clon);
          t.classList.add('fantasma');
        }
        if (clon) {
          clon.style.left = e.clientX - dx + 'px'; clon.style.top = e.clientY - dy + 'px';
          const h = huecoEn(e.clientX, e.clientY);
          if (h !== sobre) { if (sobre) sobre.classList.remove('sobre'); sobre = h; if (sobre) sobre.classList.add('sobre'); }
        }
      });
      const soltar = (e, cancelado) => {
        if (!activo) return; activo = false;
        if (clon) {
          clon.remove(); clon = null; t.classList.remove('fantasma');
          if (sobre) sobre.classList.remove('sobre');
          const h = cancelado ? null : huecoEn(e.clientX, e.clientY);
          sobre = null;
          if (h) { if (s.sel === t) seleccionar(t); colocar(t, h); }
        } else if (!cancelado) seleccionar(t);
      };
      t.addEventListener('pointerup', (e) => soltar(e, false));
      t.addEventListener('pointercancel', (e) => soltar(e, true));
      t.addEventListener('click', (e) => e.preventDefault());
      t.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seleccionar(t); if (s.sel) { const h = $linea.querySelector('.hueco:not(.lleno)'); if (h) h.focus({ preventScroll: true }); } }
      });
    });
    $linea.addEventListener('keydown', (e) => {
      const hs = [...$linea.querySelectorAll('.hueco:not(.lleno)')];
      const i = hs.indexOf(document.activeElement);
      if (i < 0) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { hs[(i + 1) % hs.length].focus({ preventScroll: true }); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { hs[(i - 1 + hs.length) % hs.length].focus({ preventScroll: true }); e.preventDefault(); }
      else if (e.key === 'Escape' && s.sel) { const t = s.sel; seleccionar(t); t.focus({ preventScroll: true }); e.stopPropagation(); }
    });
  }

  MJ.iniciar({
    preparar: () => { detenerReloj(); nuevo(); },
    empezar: () => { iniciarReloj(); const t = $bandeja.querySelector('.tarjeta'); if (t && !MJ.esTactil()) t.focus({ preventScroll: true }); },
    pausar: detenerReloj,
    reanudar: iniciarReloj,
  });
  nuevo();

  window.__minijuego = Object.assign(window.__minijuego || {}, {
    juego: 'cronologia',
    info: () => ({ ronda: s.ronda, puntos: s.puntos, racha: s.racha, aciertos: s.aciertos, fallos: s.fallos, restante: Math.round(s.restante), fin: s.fin, pendientes: $bandeja.querySelectorAll('.tarjeta').length }),
    colocar: (textoTarjeta, orden) => {
      const t = [...$bandeja.querySelectorAll('.tarjeta')].find((x) => x.textContent === textoTarjeta);
      const h = $linea.querySelector(`.hueco[data-orden="${orden}"]`);
      return colocar(t, h);
    },
  });
})();
</script>
